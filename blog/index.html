---
layout: page
title: Blog
---
<h1>Blog</h1>

{% if site.posts.size > 0 %}
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <span>{{ post.date | date: "%B %-d, %Y" }}</span> &raquo;
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No posts yet.</p>
{% endif %}
