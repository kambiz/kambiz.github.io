    const { stats, longestStreak, disciplines, instructors,
            disciplineStats, cadenceResistance, speedIncline, hrZones, timeOfDay,
            monthlyHours, partialNote, zoneEvolution, zoneMix, POWER_ZONES,
            effIndex, byClassType, weeklyLoad, calendar, calSummary } = data;

    // The cycling section predates the generic analyzer and reads these names
    // directly; map them across rather than rewriting eight working charts.
    const cycling        = disciplineStats.cycling;
    const progression    = cycling.summary;
    const efficiency     = cycling.efficiency;
    const powerByLength  = cycling.byLength;
    const powerHRScatter = cycling.scatter;
    const classProgress  = cycling.classProgress;
    const cyclingTrend   = {
        labels:   cycling.trend.labels,
        power:    cycling.trend.perf,
        powerStd: cycling.trend.perfStd,
        hr:       cycling.trend.hr,
        hrStd:    cycling.trend.hrStd,
        count:    cycling.trend.count
    };

    const luStr = lastModified
        ? new Date(lastModified).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})
        : null;

    const bestClass = classProgress[0];

    app.innerHTML = `
        <div class="header">
            <h1>Peloton Workout Analysis</h1>
            <div class="header-meta">
                <span class="subtitle">${stats.totalWorkouts.toLocaleString()} workouts &nbsp;|&nbsp; ${stats.firstDate} – ${stats.lastDate}</span>
                ${luStr ? `<span class="last-updated">Data last updated: ${luStr}</span>` : ''}
                <span class="nav-link"><a href="/">Home</a> &middot; <a href="/cv/">CV</a> &middot; <a href="/blog/">Blog</a> &middot; <a href="/music/">Music</a></span>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="insight-box">
            <strong>${stats.totalWorkouts.toLocaleString()}</strong> workouts totalling
            <strong>${stats.totalHours.toLocaleString()} hours</strong> since ${stats.firstDate}.
            On the bike, across ${stats.effortRides.toLocaleString()} real training rides, average power rose from
            <strong>${progression.powerEarly}W</strong> to <strong>${progression.powerNow}W</strong>
            (<strong>+${progression.powerPct}%</strong>) while cycling heart rate moved only
            ${progression.hrDelta >= 0 ? '+' : ''}${progression.hrDelta} bpm
            (${progression.hrEarly} → ${progression.hrNow}) — an aerobic efficiency gain of
            <strong>+${progression.effPct}%</strong>, from ${progression.effEarly} to
            ${progression.effNow} watts per heartbeat.
            ${bestClass ? `Biggest single-class jump: <strong>${bestClass.title}</strong>,
            ${Math.round(bestClass.early)}W → ${Math.round(bestClass.recent)}W over ${bestClass.rides} rides.` : ''}
            <br><br>
            Each discipline is measured on its own terms below — watts on the bike, speed on foot,
            pace on the rower — but all four share one efficiency metric: output per heartbeat.
            ${DISCIPLINE_SPECS
                .filter(sp => disciplineStats[sp.key].hasTrend)
                .map(sp => {
                    const d = disciplineStats[sp.key];
                    return `<strong>${sp.label}</strong> ${d.summary.effPct >= 0 ? '+' : ''}${d.summary.effPct}%`;
                }).join(' &nbsp;·&nbsp; ')}.
            ${DISCIPLINE_SPECS.filter(sp => disciplineStats[sp.key].hasData && !disciplineStats[sp.key].hasTrend)
                .map(sp => `${sp.label} has too few sessions so far to trend.`).join(' ')}
        </div>

        <!-- ═══════════ BY DISCIPLINE (tabbed) ═══════════ -->
        <div class="section-head">
            <h2>By Discipline</h2>
            <p>Each sport measured on its own terms — watts on the bike, speed on foot, pace on the rower —
               all sharing one efficiency metric: output per heartbeat.</p>
        </div>

        ${effIndex.series.length >= 2 ? `
        <div class="chart-container feature">
            <h2>Which Engine Is Improving Fastest</h2>
            <div class="description">Output per heartbeat, each discipline indexed to 100 at its own first full quarter</div>
            <canvas id="effIndexChart"></canvas>
            <div class="takeaway" id="effIndexTakeaway"></div>
            <div class="method-note">
                Watts and metres cannot be compared directly, but their <em>rates of change</em> can.
                Indexing each discipline to its own starting point puts all four on one axis:
                100 is where that sport began, 150 means half again as much output for the same
                cardiovascular cost.
                <b>The comparison is of shape, not of a fair race</b> — each curve starts when that
                discipline started, so cycling is showing three years of adaptation while rowing is
                showing two quarters, and early gains in any sport are always the cheapest.
            </div>
        </div>` : ''}

        <div class="tabs" role="tablist" id="discTabs">
            ${DISCIPLINE_SPECS.filter(sp => disciplineStats[sp.key].hasData).map((sp,i) => `
                <button role="tab" data-tab="${sp.key}" aria-selected="${i===0}"
                        aria-controls="panel-${sp.key}">${sp.label}<span class="n">${disciplineStats[sp.key].sessions.length}</span></button>`).join('')}
        </div>

        <div class="tab-panel" id="panel-cycling" role="tabpanel">
        <div class="panel-meta">${cycling.sessions.length} effort rides of ${cycling.spec.minMinutes}+ minutes
           (${cycling.totalSessions} logged in total, warm-ups and cool-downs excluded)
           &nbsp;|&nbsp; ${Math.round(cycling.totalMinutes/60)} hours all-in</div>

        <div class="chart-container feature">
            <h2>Power Output &amp; Heart Rate Over Time (Cycling)</h2>
            <div class="description">Left axis: time-weighted avg. power (W) &nbsp;|&nbsp; Right axis: avg. <b>cycling</b> heart rate (bpm) &nbsp;|&nbsp; Error bars: ±1 SD</div>
            <canvas id="combinedChart"></canvas>
            <div class="takeaway" id="combinedTakeaway"></div>
            <div class="method-note">
                <b>Two corrections vs. the earlier version of this chart.</b>
                (1) The heart-rate line now averages <b>cycling sessions only</b>. Previously it averaged
                every discipline, so a growing meditation habit (~67 bpm) and yoga (~86 bpm) pulled the
                line down from ~145 to ~105 bpm — that decline was a change in what was being averaged,
                not a change in cardiovascular fitness. Cycling heart rate has actually been broadly flat.
                (2) Power now excludes 5-minute warm-up and cool-down rides, which by 2026 were 57% of all
                logged rides at roughly 60W and were dragging the average down over time. Outdoor rides
                (${stats.noPowerRides} of them) are also excluded from power figures: they record heart
                rate but no wattage, so they land at 0W and pull the average down for no real reason.
            </div>
        </div>

        <div class="chart-container feature">
            <h2>Aerobic Efficiency — Watts per Heartbeat</h2>
            <div class="description">Average watts ÷ average heart rate, computed per ride then averaged. Rising = more power for the same cardiovascular cost</div>
            <canvas id="efficiencyChart"></canvas>
            <div class="method-note">
                This is the single number behind the trend you care about. Power and heart rate can each
                drift for reasons unrelated to fitness — a harder class, a hot room, poor sleep — but their
                <b>ratio</b> is the thing training actually moves. A flat power line paired with a falling
                heart rate and a rising power line paired with a flat heart rate are the same underlying win,
                and this chart scores both identically.
            </div>
        </div>

        <div class="chart-container">
            <h2>Power Progression at Constant Ride Length</h2>
            <div class="description">Average watts by half-year, split by ride duration — points shown only where a period has ${MIN_PER_LENGTH}+ rides of that length</div>
            <canvas id="powerByLengthChart"></canvas>
            <div class="method-note">
                Average watts falls as rides get longer — you simply cannot hold 45 minutes at your
                20-minute power. Ride mix has shifted markedly toward shorter sessions, so a single
                blended average understates recent progress and can even show a false plateau.
                Holding duration constant, <b>every length band climbs monotonically</b>: the 45-minute
                band alone went from 131W to 204W. Half-year periods are used here rather than months
                or quarters because splitting four ways leaves too few rides per cell to be stable.
            </div>
        </div>

        <div class="chart-container">
            <h2>Every Ride in Heart Rate × Power Space</h2>
            <div class="description">One dot per effort ride, coloured by year — watch the cloud migrate upward</div>
            <canvas id="scatterChart"></canvas>
            <div class="method-note">
                Moving <b>up</b> means more power. Moving up <b>without moving right</b> means more power at
                the same heart rate, which is the definition of an improved aerobic engine. Each year's
                centroid is drawn as a large ringed marker so the drift is readable through the noise.
            </div>
        </div>

        <div class="chart-container">
            <h2>Same Class, Stronger Rider</h2>
            <div class="description">Classes ridden 6+ times — average of the first 3 attempts vs. the most recent 3</div>
            <canvas id="classProgressChart"></canvas>
            <div class="method-note">
                The tightest possible comparison: identical class, identical length, identical instructor
                and identical intervals. Nothing varies except the rider, so the gap between the two ends
                of each bar is as close to a pure fitness measurement as this dataset allows.
            </div>
        </div>

        <div class="chart-container">
            <h2>How the Power Gets Made — Cadence vs. Resistance</h2>
            <div class="description">Left axis: avg. cadence (RPM) &nbsp;|&nbsp; Right axis: avg. resistance (%)</div>
            <canvas id="cadenceChart"></canvas>
            <div class="method-note">
                Power is cadence × torque, so the same watts can come from spinning faster or from pushing
                a heavier gear. Tracking both shows <em>how</em> the extra power is being produced, and
                whether one has been quietly carrying the other.
            </div>
        </div>

        <div class="chart-container feature">
            <h2>How Your Power Zones Have Moved</h2>
            <div class="description">Each band is one of Peloton's seven zones, in watts &nbsp;|&nbsp; the whole ladder rises as threshold power rises &nbsp;|&nbsp; dots mark actual FTP tests</div>
            <canvas id="zoneEvolutionChart"></canvas>
            <div class="takeaway" id="zoneTakeaway"></div>
            <div class="method-note">
                <b>Zones are anchored to estimated FTP, not to test results.</b> Peloton defines every zone
                as a percentage of FTP, so this chart needs a threshold history — and the six FTP tests in
                the export are a poor basis for one: they are sparse (a seven-month gap), and a test only
                captures how hard you went on that particular day.
                FTP is instead estimated each month from <b>the five best effort rides in the previous 90
                days</b>, which is a fair proxy because a hard 30–45 minute ride average is already close to
                threshold power. Using five rides rather than one keeps a single lucky day from setting the
                level, and using a fixed count rather than a percentile keeps the estimate stable while ride
                volume changed.
                <br><br>
                The tests are drawn as dots so the estimate can be checked rather than taken on faith.
                ${(() => {
                    const good = zoneEvolution.tests.filter(t => t.deltaPct !== null && Math.abs(t.deltaPct) <= 5).length;
                    const bad  = zoneEvolution.tests.filter(t => t.deltaPct !== null && Math.abs(t.deltaPct) > 5);
                    return `${good} of ${zoneEvolution.tests.filter(t=>t.deltaPct!==null).length} tests land within 5% of the estimate` +
                        (bad.length ? `. The exception is <b>${bad.map(t=>t.date).join(', ')}</b>, ` +
                        `${bad.map(t=>`${t.deltaPct}%`).join(', ')} against the surrounding riding — a test that came in well below what the training either side of it says was possible.` : '.');
                })()}
                Because the estimate needs only ordinary rides, it also reaches back
                ${zoneEvolution.labels[zoneEvolution.firstIdx]} — about a year before the first test.
                ${(zoneEvolution.gapInfo || []).filter(g => g.before && g.after).map(g => `

                <b>The hatched column is a lay-off, not missing data.</b> ${g.months} months away from the
                bike (${g.from} → ${g.to}) cost <b>${g.before}W → ${g.after}W, a ${Math.abs(g.lossPct)}% drop
                in threshold power</b>${g.recovery ? `, and took ${g.recovery} months of riding to win back` : ''}.
                Those months are collapsed into a single column rather than given one slot each: empty
                months would spend a third of the chart's width on nothing and squash the training either
                side of them.`).join('')}
            </div>
        </div>

        <div class="chart-container">
            <h2>Where Each Ride's Average Landed</h2>
            <div class="description">Share of rides per quarter by the zone their <em>average</em> power fell in, measured against that period's estimated FTP</div>
            <canvas id="zoneMixChart"></canvas>

                absent for the same reason — nobody averages above threshold for an entire ride — so they
                are left out rather than drawn as a permanent zero.
                <br><br>
                What it does show is where the bulk of the riding sits, normalised to the fitness of the
                time: because the zone boundaries rise as you do, a band holding steady means you are
                training at the same <em>relative</em> intensity while getting absolutely stronger.
            </div>

        ${byClassType.cycling ? `
        <div class="chart-container">
            <h2>Power by Class Type (Cycling)</h2>
            <div class="description">Average watts per Peloton class type, with average heart rate alongside — types with ${TYPE_MIN_SESSIONS}+ rides</div>
            <canvas id="cyclingTypeChart"></canvas>
            <div class="method-note">
                Class types are prescriptive, so this is mostly a picture of what each class asks for
                rather than of form. The useful consequence is that <b>a blended average-watts figure
                partly tracks class choice, not just fitness</b>: Power Zone rides sit lowest here because
                Endurance work is deliberately submaximal, not because they went badly. Ride length is
                already controlled for elsewhere in this section; this is the same confound in another
                dimension.
                ${(() => { const t = byClassType.cycling;
                    return `Widest gap: <b>${t[0].type} ${Math.round(t[0].mean)}W</b> against
                            <b>${t[t.length-1].type} ${Math.round(t[t.length-1].mean)}W</b> —
                            ${Math.round(t[0].mean - t[t.length-1].mean)}W apart.`; })()}
            </div>
        </div>` : ''}

        <div class="chart-container">
            <h2>Cycling Heart Rate Zone Distribution</h2>
            <div class="description">Effort rides by average heart rate — cycling only</div>
            <canvas id="hrZoneChart"></canvas>
        </div>

        </div><!-- /panel-cycling -->

        <!-- ═══════════ WALKING & HIKING ═══════════ -->
        <div class="tab-panel" id="panel-walking" role="tabpanel" hidden>
        ${disciplineSectionHTML(disciplineStats.walking, {
            trend: `Heart rate here is <b>walking sessions only</b>, on the same principle as the cycling
                    section. Note the confound this discipline cannot escape: Peloton exports incline for
                    runs but <b>not for walks</b>, and roughly a third of these sessions are Hike classes
                    that hold a steep simulated grade. A slow, steep hike and a brisk flat walk sit at
                    the same heart rate for entirely different reasons, and nothing in the export
                    distinguishes them — so read speed here as speed, not as effort.`,
            length: `Longer walks are paced more conservatively than short ones, so the blend of session
                     lengths moves the overall average independently of fitness. Holding duration constant
                     removes that.`,
            scatter:`Up means faster; up without moving right means faster at the same heart rate. Because
                     incline is missing for walks, some of the vertical spread is terrain rather than form.`,
            klass:  `Hike classes repeat the same simulated route and grade, which is exactly why they are
                     the most trustworthy comparison in this section — the terrain that confounds the other
                     walking charts is held fixed here.`,
            byType: byClassType.walking ? `Hikes run slower than music walks by design — the grade does the
                    work instead of the pace. Reading walking speed without the class type behind it makes a
                    block of hiking look like a loss of fitness.` : null
        })}

        </div><!-- /panel-walking -->

        <!-- ═══════════ RUNNING ═══════════ -->
        <div class="tab-panel" id="panel-running" role="tabpanel" hidden>
        ${disciplineSectionHTML(disciplineStats.running, {
            trend: `Heart rate is running sessions only. Running is the newest of these disciplines, so the
                    series is short and each month rests on relatively few sessions — treat the shape as
                    provisional until more of 2026 is in.`,
            length: `Average speed drops as runs get longer; splitting by duration keeps a change in
                     session mix from being read as a change in fitness.`,
            scatter:`Unlike walking, runs do carry incline, and it stays in a narrow 0–2.5% band — so the
                     vertical spread here is much closer to genuine pace difference.`
        })}

        ${disciplineStats.running.hasTrend ? `
        <div class="chart-container">
            <h2>How the Pace Gets Made — Speed vs. Incline (Running)</h2>
            <div class="description">Left axis: avg. speed (mph) &nbsp;|&nbsp; Right axis: avg. incline (%)</div>
            <canvas id="speedInclineChart"></canvas>

        <!-- ═══════════ TRAINING VOLUME & HABITS ═══════════ -->
        <div class="section-head">

        </div>

        <div class="chart-container feature">
            <h2>How the Training Mix Has Shifted</h2>
            <div class="description">Hours per month by discipline &nbsp;|&nbsp; red = walking, running, rowing &nbsp;|&nbsp; black = cycling &nbsp;|&nbsp; grey = yoga, stretching, meditation${partialNote ? ` &nbsp;|&nbsp; ${partialNote} omitted as a partial month` : ''}</div>
            <canvas id="mixChart"></canvas>
            <div class="method-note">
                Bars are stacked hours, so total height is total training volume and each band is
                its share of it. The dashed line is cycling's percentage of the month's hours, read
                on the right axis — it falls even in months where total volume rose, which is what
                separates a genuine change of emphasis from a quiet month on the bike.
                ${partialNote ? `<b>${partialNote}</b> is left out: the export stops partway through it,
                so its bar would show a collapse in elapsed days rather than in training.` : ''}
            </div>
        </div>

        <div class="chart-container">
            <h2>Workout Time of Day</h2>
            <div class="description">Bars: all sessions by hour &nbsp;|&nbsp; Line: average cycling power in that part of the day</div>
            <canvas id="timeOfDayChart"></canvas>
            <div class="method-note">
                Power is averaged in three-hour blocks, not single hours — one hour splits the effort
                rides too thin to mean anything — and a block is left blank below 15 rides.
                ${(() => {
                    const pts = timeOfDay.power.map((v,i)=>({v,i})).filter(x=>x.v!==null);
                    if (pts.length < 2) return '';
                    const lo = pts.reduce((a,b)=>b.v<a.v?b:a), hi = pts.reduce((a,b)=>b.v>a.v?b:a);
                    const hr = h => `${String(h).padStart(2,'0')}:00`;
                    return `Weakest around <b>${hr(Math.floor(lo.i/3)*3)}</b> at ${lo.v}W, strongest around
                            <b>${hr(Math.floor(hi.i/3)*3)}</b> at ${hi.v}W — a
                            ${Math.round(100*(hi.v/lo.v-1))}% spread across the day.
                            Worth reading against the bars: the hours with the most sessions are not
                            necessarily the hours with the best output.`;
                })()}
            </div>
        </div>

        <div class="chart-container feature">
            <h2>Weekly Load and Ramp Rate</h2>
            <div class="description">Bars: hours trained each week &nbsp;|&nbsp; Line: that week against the trailing ${ACWR_CHRONIC_WEEKS}-week average</div>
            <canvas id="loadChart"></canvas>
            <div class="method-note">
                The ratio compares one week's hours to the four before it. Around 1.0 is steady; a sharp
                ramp (roughly 1.5 and above) is the pattern most often associated with picking up an
                injury, and a sustained dip below about 0.8 is detraining — the same slide the 2024
                lay-off shows in the power-zone chart.
                <b>This counts hours, not intensity</b>, so a week of easy volume and a week of intervals
                weigh the same here; treat it as a rough guide rather than a verdict.
                ${partialNote ? `The current part-week is excluded, for the same reason partial months are.` : ''}
            </div>
        </div>

        <div class="chart-container feature">

            <div id="calendar"></div>
            <div class="method-note">

                both just make the square non-empty. Splitting the shading by kind shows the texture
                underneath: <b>${calSummary.trained} of ${calSummary.active} active days
                (${calSummary.pctTrained}%) include cycling, running, walking, rowing or strength</b>;
                the other ${calSummary.recovery} are yoga, stretching or meditation alone.
                <br><br>
                That recovery block is not padding — it is roughly one day in seven, and those days

        <div class="chart-container">

        <div class="footer">Chart.js &nbsp;|&nbsp; ${luStr ? 'Data last updated: ' + luStr : 'kambiz.github.io'}</div>
    `;

    // ── Stat cards ─────────────────────────────────────────────
    [

        <div><div class="k">Cycling HR then → now</div><div class="v">${progression.hrEarly} → ${progression.hrNow} bpm</div></div>
        <div><div class="k">Watts per heartbeat</div><div class="v up">${progression.effEarly} → ${progression.effNow}</div></div>
        <div><div class="k">Efficiency gain</div><div class="v up">+${progression.effPct}%</div></div>`;

    const SS = {
        x:{ ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },

    // ── Per-discipline chart builders ─────────────────────────
    // Charts are built on first tab activation, never up front: Chart.js sizes
    // its canvas from the container, and a canvas inside a hidden panel measures
    // zero — charts built there come out blank and stay blank. Deferring also
    // keeps first paint to one discipline's worth of work instead of four.
    function drawCyclingCharts() {
        if (byClassType.cycling)
            drawClassTypeChart('cyclingTypeChart', byClassType.cycling, disciplineStats.cycling.spec);
        // ═══════════════════════════════════════════════════════════
        //  FITNESS PROGRESSION CHARTS
        // ═══════════════════════════════════════════════════════════

        // 1 · Flagship: power + cycling HR, dual axis with ±1 SD error bars
        (()=>{
            new Chart(document.getElementById('combinedChart'),{
                type:'line',
                data:{ labels:cyclingTrend.labels, datasets:[
                    {
                        label:'Power Output (W)', data:cyclingTrend.power, yAxisID:'y',
                        borderColor:C.black, backgroundColor:'rgba(0,0,0,0.05)',
                        fill:true, tension:0.4, borderWidth:2,
                        pointRadius:4, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:2
                    },
                    {
                        label:'Cycling Heart Rate (bpm)', data:cyclingTrend.hr, yAxisID:'y1',
                        borderColor:C.red, backgroundColor:'rgba(192,57,43,0.05)',
                        fill:false, tension:0.4, borderWidth:2,
                        pointRadius:4, pointBackgroundColor:C.red, pointBorderColor:'#fff', pointBorderWidth:2
                    }
                ]},
                options:{
                    responsive:true, interaction:{mode:'index',intersect:false},
                    plugins:{
                        legend:{ display:true, position:'top', labels:{color:C.mid,font:{size:11}} },
                        tooltip:{ callbacks:{
                            title: items => `${items[0].label} · ${cyclingTrend.count[items[0].dataIndex]} effort rides`,
                            label: ctx=>{
                                const i=ctx.dataIndex, v=ctx.parsed.y;
                                if(v===null) return null;
                                return ctx.datasetIndex===0
                                    ? `Power: ${v.toFixed(1)} W ±${cyclingTrend.powerStd[i].toFixed(1)}`
                                    : `Cycling HR: ${v.toFixed(1)} bpm ±${cyclingTrend.hrStd[i].toFixed(1)}`;
                            }
                        }}
                    },
                    scales:{
                        x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                        y:{
                            type:'linear', position:'left', beginAtZero:true,
                            title:{display:true,text:'Power (W)',color:C.black},
                            ticks:{color:C.mid,callback:v=>v+'W'}, grid:{color:'rgba(0,0,0,0.04)'}
                        },
                        y1:{
                            type:'linear', position:'right', min:100, max:180,
                            title:{display:true,text:'Cycling Heart Rate (bpm)',color:C.red},
                            ticks:{color:C.red,callback:v=>v+' bpm'}, grid:{drawOnChartArea:false}
                        }
                    }
                },
                plugins:[{ afterDatasetsDraw(chart){
                    const ctx=chart.ctx;
                    const bars=(mi,means,stds,scaleId,color)=>{
                        const meta=chart.getDatasetMeta(mi), ys=chart.scales[scaleId];
                        meta.data.forEach((pt,i)=>{
                            if(means[i]===null) return;
                            const x=pt.x, yT=ys.getPixelForValue(means[i]+stds[i]), yB=ys.getPixelForValue(means[i]-stds[i]);
                            ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.2;
                            [[x,yT,x,yB],[x-3,yT,x+3,yT],[x-3,yB,x+3,yB]].forEach(([x1,y1,x2,y2])=>{
                                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
                            });
                            ctx.restore();
                        });
                    };
                    bars(0,cyclingTrend.power,cyclingTrend.powerStd,'y','rgba(0,0,0,0.25)');
                    bars(1,cyclingTrend.hr,cyclingTrend.hrStd,'y1','rgba(192,57,43,0.3)');
                }}]
            });
        })();

        // 2 · Aerobic efficiency (W/bpm) with least-squares trend
        new Chart(document.getElementById('efficiencyChart'),{
            type:'line',
            data:{ labels:efficiency.labels, datasets:[
                {
                    label:'Watts per heartbeat', data:efficiency.value,
                    borderColor:C.black, backgroundColor:'rgba(0,0,0,0.06)',
                    fill:true, tension:0.35, borderWidth:2,
                    pointRadius:3.5, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:1.5
                },
                {
                    label:'Trend', data:efficiency.trend,
                    borderColor:C.red, borderWidth:1.8, borderDash:[6,4],
                    fill:false, pointRadius:0, tension:0
                }
            ]},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11}} },
                    tooltip:{ callbacks:{
                        title: items => `${items[0].label} · ${efficiency.count[items[0].dataIndex]} effort rides`,
                        label: ctx => ctx.parsed.y === null ? null
                            : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)} W/bpm`
                    }}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ title:{display:true,text:'Watts per heartbeat',color:C.black},
                        ticks:{color:C.mid,callback:v=>v.toFixed(2)}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            }
        });

        // 3 · Power progression at constant ride length
        (()=>{
            const lenColors = { '20':'#c0392b', '30':'#000000', '45':'#666666', '60':'#aaaaaa' };
            const datasets = powerByLength.buckets
                .map(b => ({
                    label: b.label,
                    data:  powerByLength.series[b.key],
                    borderColor: lenColors[b.key],
                    backgroundColor: lenColors[b.key],
                    borderWidth: 2, tension:0.3, spanGaps:true,
                    pointRadius:3.5, pointBorderColor:'#fff', pointBorderWidth:1.5
                }))
                .filter(ds => ds.data.some(v => v !== null));

            new Chart(document.getElementById('powerByLengthChart'),{
                type:'line',
                data:{ labels:powerByLength.labels, datasets },
                options:{
                    responsive:true, interaction:{mode:'index',intersect:false},
                    plugins:{
                        legend:{ position:'top', labels:{color:C.mid,font:{size:11},padding:14} },
                        tooltip:{ callbacks:{ label: ctx => ctx.parsed.y === null ? null
                            : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(0)} W ` +
                              `(${powerByLength.counts[powerByLength.buckets.find(b=>b.label===ctx.dataset.label).key][ctx.dataIndex]} rides)` }}
                    },
                    scales:{
                        x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                        y:{ title:{display:true,text:'Average power (W)',color:C.black},
                            ticks:{color:C.mid,callback:v=>v+'W'}, grid:{color:'rgba(0,0,0,0.04)'} }
                    }
                }
            });
        })();

        // 4 · HR × power scatter by year, with per-year centroids
        (()=>{
            const yrs = powerHRScatter.years;
            // Oldest year lightest, newest darkest+red so the drift reads at a glance
            const colorFor = i => i === yrs.length-1 ? C.red : grays[Math.min(grays.length-1, (yrs.length-1-i)*2 + 2)];

            const datasets = yrs.map((y,i)=>({
                label: String(y),
                data:  powerHRScatter.points[y],
                backgroundColor: colorFor(i) + (i === yrs.length-1 ? 'cc' : '66'),
                borderColor: 'transparent',
                pointRadius: 3, pointHoverRadius: 5, order: 2
            }));

            // Centroid markers drawn on top
            yrs.forEach((y,i)=>{
                const pts = powerHRScatter.points[y];
                if (!pts.length) return;
                datasets.push({
                    label: `${y} avg`,
                    data: [{ x: pts.reduce((s,p)=>s+p.x,0)/pts.length,
                             y: pts.reduce((s,p)=>s+p.y,0)/pts.length }],
                    backgroundColor: colorFor(i),
                    borderColor: '#fff', borderWidth: 2.5,
                    pointRadius: 9, pointHoverRadius: 11, order: 1
                });
            });

            new Chart(document.getElementById('scatterChart'),{
                type:'scatter',
                data:{ datasets },
                options:{
                    responsive:true,
                    plugins:{
                        legend:{ position:'top',
                            labels:{ color:C.mid, font:{size:11}, padding:12, usePointStyle:true,
                                     filter: item => !item.text.includes('avg') } },
                        tooltip:{ callbacks:{ label: ctx =>
                            `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(0)}W @ ${ctx.parsed.x.toFixed(0)} bpm` +
                            ` (${(ctx.parsed.y/ctx.parsed.x).toFixed(2)} W/bpm)` }}
                    },
                    scales:{
                        x:{ title:{display:true,text:'Average heart rate (bpm)',color:C.black},
                            ticks:{color:C.mid,callback:v=>v+' bpm'}, grid:{color:'rgba(0,0,0,0.04)'} },
                        y:{ title:{display:true,text:'Average power (W)',color:C.black},
                            ticks:{color:C.mid,callback:v=>v+'W'}, grid:{color:'rgba(0,0,0,0.04)'} }
                    }
                }
            });
        })();

        // 5 · Same-class progression — floating bars from early avg to recent avg
        (()=>{
            // classProgress is already sorted by gain descending; Chart.js draws index 0 at
            // the top of a horizontal axis, so no reversal — biggest gain reads first.
            const rows = classProgress;
            const clsB  = niceBounds(rows.flatMap(c => [c.early, c.recent]), 0.25);
            const clsLo = clsB.lo, clsHi = clsB.hi;
            new Chart(document.getElementById('classProgressChart'),{
                type:'bar',
                data:{
                    labels: rows.map(c => c.title.replace(/ Ride$/,'')),
                    datasets:[{
                        label:'First 3 rides → most recent 3',
                        data: rows.map(c => [c.early, c.recent]),
                        backgroundColor: C.red, borderWidth:0, borderSkipped:false,
                        barPercentage:0.55
                    }]
                },
                options:{
                    indexAxis:'y', responsive:true,
                    plugins:{
                        legend:{display:false},
                        tooltip:{ callbacks:{ label: ctx => {
                            const c = rows[ctx.dataIndex];
                            return [`First 3: ${c.early}W`, `Recent 3: ${c.recent}W`,
                                    `Gain: +${c.gain}W (+${c.pct}%)`,
                                    `Best ever: ${c.best}W · ${c.rides} rides`];
                        }}}
                    },
                    scales:{
                        // Bounded to the data, not to zero — see the note in the generic
                        // renderer: the bar length is the change, and zero-anchoring hides it.
                        x:{ min:clsLo, max:clsHi,
                            title:{display:true,text:'Average power (W)',color:C.mid,font:{size:11}},
                            ticks:{color:C.mid,callback:v=>v+'W'}, grid:{color:'rgba(0,0,0,0.04)'} },
                        y:{ ticks:{color:C.mid,font:{size:10}}, grid:{display:false} }
                    }
                },
                plugins:[{ afterDatasetsDraw(chart){
                    // Dot the starting end of each bar so direction of travel is unambiguous
                    const ctx = chart.ctx, meta = chart.getDatasetMeta(0), xs = chart.scales.x;
                    meta.data.forEach((bar,i)=>{
                        const x = xs.getPixelForValue(rows[i].early);
                        ctx.save();
                        ctx.fillStyle = '#fff'; ctx.strokeStyle = C.red; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(x, bar.y, 4.5, 0, Math.PI*2);
                        ctx.fill(); ctx.stroke(); ctx.restore();
                    });
                }}]
            });
        })();

        // 6 · Cadence vs resistance
        new Chart(document.getElementById('cadenceChart'),{
            type:'line',
            data:{ labels:cadenceResistance.labels, datasets:[
                {
                    label:'Cadence (RPM)', data:cadenceResistance.cadence, yAxisID:'y',
                    borderColor:C.black, backgroundColor:'rgba(0,0,0,0.04)',

                    pointRadius:3, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:1.5
                },
                {
                    label:'Resistance (%)', data:cadenceResistance.resistance, yAxisID:'y1',

                }
            ]},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11}} },
                    tooltip:{ callbacks:{ label: ctx => ctx.parsed.y === null ? null

                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },

                         ticks:{color:C.red,callback:v=>v+'%'}, grid:{drawOnChartArea:false} }
                }
            }
        });

        // 6b · Power zone evolution — filled bands between zone boundaries
        (()=>{
            const Z = POWER_ZONES;
            // Each dataset carries its zone's UPPER edge; fill:'-1' paints down to the
            // band below it, so the stack of fills reproduces the zone ladder without
            // a stacked axis — which leaves the axis free for the test markers.
            const bands = Z.map((z,i) => ({
                label: `${z.name} · ${z.desc}`,
                data: zoneEvolution.bands[z.name],
                backgroundColor: z.color,
                borderColor: 'rgba(255,255,255,0.75)',
                borderWidth: 1,
                fill: i === 0 ? 'origin' : '-1',
                pointRadius: 0, pointHoverRadius: 0, tension: 0.25, order: 3,
                spanGaps: false
            }));

            const ftpLine = {
                label: 'Estimated FTP',
                data: zoneEvolution.ftp,
                borderColor: '#000', borderWidth: 2.5, borderDash: [6,3],
                fill: false, pointRadius: 0, tension: 0.25, order: 2, spanGaps: false
            };

            // Tests plotted at their month's index; null elsewhere so the marks float free
            const testPts = zoneEvolution.labels.map((_,i) => {
                const t = zoneEvolution.tests.find(t => t.i === i);
                return t ? t.tested : null;
            });
            const testMarks = {
                label: 'Actual FTP test',
                data: testPts,
                borderColor: 'transparent', backgroundColor: '#000',
                pointRadius: 6, pointHoverRadius: 8,
                pointStyle: 'rectRot', pointBorderColor: '#fff', pointBorderWidth: 2,
                showLine: false, fill: false, order: 1
            };

            new Chart(document.getElementById('zoneEvolutionChart'),{
                type:'line',
                data:{ labels: zoneEvolution.labels, datasets: [...bands, ftpLine, testMarks] },
                options:{
                    responsive:true, interaction:{mode:'index',intersect:false},
                    plugins:{
                        legend:{ position:'top',
                            labels:{ color:C.mid, font:{size:10}, padding:8, boxWidth:12,
                                     // `order` drives draw order; without this the reference
                                     // marks would also lead the legend, ahead of the zones.
                                     sort:(a,b)=>a.datasetIndex-b.datasetIndex } },
                        tooltip:{
                            callbacks:{
                                title: items => {
                                    const i = items[0].dataIndex;
                                    if (zoneEvolution.ftp[i] !== null)
                                        return `${zoneEvolution.labels[i]} · est. FTP ${zoneEvolution.ftp[i]}W ` +
                                               `(from ${zoneEvolution.rides[i]} rides)`;
                                    const g = (zoneEvolution.gapInfo || []).find(g => g.index === i);
                                    if (!g) return `${zoneEvolution.labels[i]} · no riding in the previous 90 days`;
                                    return `${g.months} months away from the bike (${g.from} → ${g.to})` +
                                           (g.before !== null && g.after !== null
                                              ? ` · ${g.before}W → ${g.after}W (${g.lossPct}%)` +
                                                (g.recovery ? ` · ${g.recovery} months to recover` : '')
                                              : '');
                                },
                                label: ctx => {
                                    const i = ctx.dataIndex;
                                    if (ctx.dataset.label === 'Estimated FTP') return null;
                                    if (ctx.dataset.label === 'Actual FTP test') {
                                        const t = zoneEvolution.tests.find(t => t.i === i);
                                        return t ? `Actual test: ${t.tested}W (${t.deltaPct >= 0 ? '+' : ''}${t.deltaPct}% vs estimate)` : null;
                                    }
                                    const zi = Z.findIndex(z => `${z.name} · ${z.desc}` === ctx.dataset.label);
                                    if (zi < 0) return null;
                                    const ftp = zoneEvolution.ftp[i];
                                    if (ftp === null) return null;
                                    const lo = Math.round(ftp * Z[zi].lo), hi = Math.round(ftp * Z[zi].hi);
                                    return `${ctx.dataset.label}: ${lo}–${zi === Z.length-1 ? '' : hi}${zi === Z.length-1 ? '+' : ''}W`;
                                }
                            }
                        }
                    },
                    scales:{
                        x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                        y:{ beginAtZero:true,
                            title:{display:true,text:'Power (W)',color:C.black},
                            ticks:{color:C.mid,callback:v=>v+'W'}, grid:{color:'rgba(0,0,0,0.06)'} }
                    }
                },
                plugins:[{
                    // Mark each collapsed lay-off: hatched column, and the cost written
                    // across it, so the gap reads as a fact about the training rather
                    // than as missing data.
                    id:'layoffBands',
                    beforeDatasetsDraw(chart){
                        const info = zoneEvolution.gapInfo;
                        if (!info || !info.length) return;
                        const ctx = chart.ctx, xs = chart.scales.x, ys = chart.scales.y;
                        info.forEach(g => {
                            const c = xs.getPixelForValue(g.index);
                            const half = (xs.width / Math.max(1, xs.ticks.length)) * 0.5;
                            const x0 = c - half, x1 = c + half;
                            ctx.save();
                            ctx.beginPath(); ctx.rect(x0, ys.top, x1-x0, ys.bottom-ys.top); ctx.clip();
                            ctx.fillStyle = '#fafafa';
                            ctx.fillRect(x0, ys.top, x1-x0, ys.bottom-ys.top);
                            ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 1;
                            for (let x = x0 - (ys.bottom-ys.top); x < x1; x += 7) {
                                ctx.beginPath();
                                ctx.moveTo(x, ys.bottom); ctx.lineTo(x + (ys.bottom-ys.top), ys.top);
                                ctx.stroke();
                            }
                            ctx.restore();
                            // Side rules so the break edge is unambiguous
                            ctx.save();
                            ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
                            [x0,x1].forEach(x => {
                                ctx.beginPath(); ctx.moveTo(x, ys.top); ctx.lineTo(x, ys.bottom); ctx.stroke();
                            });
                            ctx.restore();
                            // Vertical caption
                            ctx.save();
                            ctx.translate((x0+x1)/2, (ys.top+ys.bottom)/2);
                            ctx.rotate(-Math.PI/2);
                            ctx.textAlign='center'; ctx.textBaseline='middle';
                            ctx.fillStyle = C.dark; ctx.font = '600 11px inherit';
                            ctx.fillText(`${g.months} months off the bike`, 0, 0);
                            ctx.restore();
                        });
                    }
                }]
            });

            // Takeaway: first vs latest zone ladder
            if (zoneEvolution.firstIdx > -1) {
                const f0 = zoneEvolution.ftp[zoneEvolution.firstIdx];
                const f1 = zoneEvolution.ftp[zoneEvolution.lastIdx];
                const z2 = Z[1], z4 = Z[3];
                document.getElementById('zoneTakeaway').innerHTML = `
                    <div><div class="k">Estimated FTP</div><div class="v up">${f0} → ${f1}W</div></div>
                    <div><div class="k">Change</div><div class="v up">+${Math.round(100*(f1/f0-1))}%</div></div>
                    <div><div class="k">Zone 2 (Endurance)</div><div class="v">${Math.round(f0*z2.lo)}–${Math.round(f0*z2.hi)} → ${Math.round(f1*z2.lo)}–${Math.round(f1*z2.hi)}W</div></div>
                    <div><div class="k">Zone 4 (Threshold)</div><div class="v">${Math.round(f0*z4.lo)}–${Math.round(f0*z4.hi)} → ${Math.round(f1*z4.lo)}–${Math.round(f1*z4.hi)}W</div></div>`;
            }
        })();

        // 6c · Where each ride's average landed, by quarter (100% stacked)
        new Chart(document.getElementById('zoneMixChart'),{
            type:'bar',
            data:{
                labels: zoneMix.labels,
                datasets: zoneMix.series.map(sv => ({
                    label: `${sv.name} · ${sv.desc}`,
                    data: sv.data,
                    backgroundColor: sv.color,
                    borderWidth: 0, stack: 'z'
                }))
            },
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:10},padding:8,boxWidth:12} },
                    tooltip:{ callbacks:{
                        title: items => `${items[0].label} · ${zoneMix.counts[items[0].dataIndex]} rides`,
                        label: ctx => ctx.parsed.y ? `${ctx.dataset.label}: ${ctx.parsed.y}% of rides` : null
                    }}
                },
                scales:{
                    x:{ stacked:true, ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ stacked:true, beginAtZero:true, max:100,
                        title:{display:true,text:'Share of rides (%)',color:C.black},
                        ticks:{color:C.mid,callback:v=>v+'%'}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            }
        });

        // 8 · Cycling HR zones
        new Chart(document.getElementById('hrZoneChart'),{
            type:'bar',
            data:{ labels:hrZones.labels, datasets:[{
                data:hrZones.counts,
                backgroundColor:grays.slice(0,hrZones.labels.length),
                borderWidth:0
            }]},
            options:{ responsive:true,
                plugins:{ legend:{display:false},
                    tooltip:{ callbacks:{ label:ctx=>`${ctx.parsed.y} rides` }} },
                scales:{
                    y:{ beginAtZero:true, ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                    x:{ ticks:{color:C.mid,maxRotation:30,minRotation:30}, grid:{display:false} }
                }
            }
        });
    }

    function drawRunningExtras() {
        // Running's cadence-vs-resistance analogue: speed against grade
        if (disciplineStats.running.hasTrend) {
            new Chart(document.getElementById('speedInclineChart'),{
                type:'line',
                data:{ labels:speedIncline.labels, datasets:[
                    { label:'Speed (mph)', data:speedIncline.speed, yAxisID:'y',
                      borderColor:C.black, backgroundColor:'rgba(0,0,0,0.04)',
                      fill:false, tension:0.35, borderWidth:2,
                      pointRadius:3, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:1.5 },
                    { label:'Incline (%)', data:speedIncline.incline, yAxisID:'y1',
                      borderColor:C.red, backgroundColor:'rgba(192,57,43,0.04)',
                      fill:false, tension:0.35, borderWidth:2, borderDash:[5,3],
                      pointRadius:3, pointBackgroundColor:C.red, pointBorderColor:'#fff', pointBorderWidth:1.5 }
                ]},
                options:{
                    responsive:true, interaction:{mode:'index',intersect:false},
                    plugins:{
                        legend:{ position:'top', labels:{color:C.mid,font:{size:11}} },
                        tooltip:{ callbacks:{ label: ctx => ctx.parsed.y===null ? null
                            : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}` }}
                    },
                    scales:{
                        x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                        y:{ position:'left', title:{display:true,text:'Speed (mph)',color:C.black},
                            ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                        y1:{ position:'right', title:{display:true,text:'Incline (%)',color:C.red},
                             ticks:{color:C.red,callback:v=>v+'%'}, grid:{drawOnChartArea:false} }
                    }
                }
            });
        }
    }

    // The generic panel renderer draws lazily, after this scope has returned,
    // so its class-type data is parked where that callback can reach it.
    window.__byClassType = byClassType;

    // ── Cross-discipline efficiency index ─────────────────────
    if (effIndex.series.length >= 2) {
        const lineColors = { cycling:'#000000', walking:'#c0392b', running:'#e0573f', rowing:'#8f8f8f' };
        new Chart(document.getElementById('effIndexChart'),{
            type:'line',
            data:{ labels: effIndex.labels, datasets: effIndex.series.map(sv => ({
                label: sv.label, data: sv.data,
                borderColor: lineColors[sv.key] || C.mid,
                backgroundColor: lineColors[sv.key] || C.mid,
                borderWidth:2.5, tension:0.3, spanGaps:true,
                pointRadius:3.5, pointBorderColor:'#fff', pointBorderWidth:1.5
            }))},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11},padding:14,usePointStyle:true} },
                    tooltip:{ callbacks:{ label: ctx => ctx.parsed.y === null ? null
                        : `${ctx.dataset.label}: ${ctx.parsed.y} (${ctx.parsed.y>=100?'+':''}${Math.round(ctx.parsed.y-100)}% vs its start)` }}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ title:{display:true,text:'Efficiency index (start = 100)',color:C.black},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            },
            plugins:[{ id:'baseline100', beforeDatasetsDraw(chart){
                // The 100 line is the reference every curve is measured from.
                const ys = chart.scales.y, ctx = chart.ctx;
                if (100 < ys.min || 100 > ys.max) return;
                const y = ys.getPixelForValue(100);
                ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
                ctx.beginPath(); ctx.moveTo(chart.scales.x.left,y); ctx.lineTo(chart.scales.x.right,y); ctx.stroke();
                ctx.restore();
            }}]
        });
        document.getElementById('effIndexTakeaway').innerHTML = effIndex.series.map(sv =>
            `<div><div class="k">${sv.label}</div><div class="v ${sv.gain>=0?'up':''}">${sv.gain>=0?'+':''}${sv.gain}%</div></div>`
        ).join('');
    }

    // ── Tab controller ────────────────────────────────────────
    const TAB_BUILDERS = {
        cycling: drawCyclingCharts,
        walking: () => drawDisciplineCharts(disciplineStats.walking),
        running: () => { drawDisciplineCharts(disciplineStats.running); drawRunningExtras(); },
        rowing:  () => drawDisciplineCharts(disciplineStats.rowing)
    };
    const tabsDrawn = new Set();
    function showDiscipline(key) {
        document.querySelectorAll('#discTabs button').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.tab === key)));
        document.querySelectorAll('.tab-panel').forEach(pnl =>
            pnl.hidden = pnl.id !== `panel-${key}`);
        if (!tabsDrawn.has(key)) { tabsDrawn.add(key); (TAB_BUILDERS[key] || (()=>{}))(); }
    }
    document.getElementById('discTabs').addEventListener('click', e => {
        const btn = e.target.closest('button[data-tab]');
        if (btn) showDiscipline(btn.dataset.tab);
    });
    // Draw whichever tab opens first
    showDiscipline(document.querySelector('#discTabs button')?.dataset.tab || 'cycling');


    // ═══════════════════════════════════════════════════════════
    //  VOLUME & HABIT CHARTS
    // ═══════════════════════════════════════════════════════════

    // (Walking, running and rowing are drawn by the tab controller above, on
    //  first activation of their tab.)

    // 9 · Discipline breakdown — hours (bars) + session count (line), one chart
    //     replacing the former doughnut + calories bar + time bar trio.
    (()=>{
        const paired = disciplines.labels
            .map((l,i)=>({ l, hrs:+(disciplines.minutes[i]/60).toFixed(1), n:disciplines.counts[i] }))
            .sort((a,b)=>b.hrs-a.hrs);
        new Chart(document.getElementById('disciplineChart'),{
            data:{
                labels: paired.map(p=>p.l),
                datasets:[
                    { type:'bar', label:'Hours', data:paired.map(p=>p.hrs), yAxisID:'y',
                      backgroundColor:grays, borderWidth:0, order:2 },
                    // tension 0 — these are unrelated categories, so a smoothed curve
                    // would imply interpolation between them that doesn't exist
                    { type:'line', label:'Sessions', data:paired.map(p=>p.n), yAxisID:'y1',
                      borderColor:C.red, backgroundColor:C.red, borderWidth:2, tension:0,
                      pointRadius:4, pointBackgroundColor:C.red, pointBorderColor:'#fff',
                      pointBorderWidth:1.5, fill:false, order:1 }
                ]
            },
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11},usePointStyle:true} },
                    tooltip:{ callbacks:{ label: ctx => ctx.datasetIndex===0
                        ? `${ctx.parsed.y} hrs`
                        : `${ctx.parsed.y.toLocaleString()} sessions` }}
                },
                scales:{
                    x:{ ticks:{color:C.mid}, grid:{display:false} },
                    y:{ beginAtZero:true, position:'left',
                        title:{display:true,text:'Hours',color:C.black},
                        ticks:{color:C.mid,callback:v=>v+' hrs'}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y1:{ beginAtZero:true, position:'right',
                         title:{display:true,text:'Sessions',color:C.red},
                         ticks:{color:C.red}, grid:{drawOnChartArea:false} }
                }
            }
        });
    })();

    // 9b · Monthly training mix — stacked hours + cycling's share
    new Chart(document.getElementById('mixChart'),{
        data:{
            labels: monthlyHours.labels,
            datasets: [
                ...monthlyHours.groups.map(g => ({
                    type:'bar', label:g.label, data:g.data,
                    backgroundColor:g.color, borderWidth:0, stack:'hrs', yAxisID:'y', order:2
                })),
                {
                    type:'line', label:'Cycling share of hours', data:monthlyHours.cyclingShare,
                    yAxisID:'y1', borderColor:'#000', borderWidth:2, borderDash:[5,3],
                    pointRadius:0, tension:0.3, fill:false, order:1, spanGaps:false
                }
            ]
        },
        options:{
            responsive:true, interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{ position:'top', labels:{color:C.mid,font:{size:10},padding:10,boxWidth:12} },
                tooltip:{
                    callbacks:{
                        label: ctx => {
                            if (ctx.parsed.y === null) return null;
                            if (ctx.dataset.type === 'line')
                                return `Cycling share: ${ctx.parsed.y.toFixed(0)}%`;
                            return ctx.parsed.y ? `${ctx.dataset.label}: ${ctx.parsed.y} hrs` : null;
                        },
                        footer: items => {
                            const tot = items.filter(i=>i.dataset.type!=='line')
                                             .reduce((s,i)=>s+i.parsed.y,0);
                            return `Total: ${tot.toFixed(1)} hrs`;
                        }
                    }
                }
            },
            scales:{
                x:{ stacked:true, ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                y:{ stacked:true, beginAtZero:true, position:'left',
                    title:{display:true,text:'Hours in the month',color:C.black},
                    ticks:{color:C.mid,callback:v=>v+' h'}, grid:{color:'rgba(0,0,0,0.04)'} },
                y1:{ position:'right', min:0, max:100, beginAtZero:true,
                     title:{display:true,text:'Cycling share of hours (%)',color:C.black},
                     ticks:{color:C.mid,callback:v=>v+'%'}, grid:{drawOnChartArea:false} }
            }
        }
    });

    // 12 · Time of day
    (()=>{
        const barColors = timeOfDay.counts.map((_,h) => {
            if (h >= 5  && h <= 11) return '#2e2e2e';
            if (h >= 12 && h <= 17) return '#575757';
            if (h >= 18 && h <= 22) return '#8c8c8c';
            return '#c4c4c4';
        });
        const pw = timeOfDay.power.filter(v=>v!==null);
        new Chart(document.getElementById('timeOfDayChart'),{
            data:{ labels:timeOfDay.labels, datasets:[
                { type:'bar', label:'Sessions', data:timeOfDay.counts,
                  backgroundColor:barColors, borderWidth:0, yAxisID:'y', order:2 },
                { type:'line', label:'Avg. cycling power', data:timeOfDay.power, yAxisID:'y1',
                  borderColor:C.red, backgroundColor:'rgba(192,57,43,0.05)', borderWidth:2.5,
                  tension:0, pointRadius:0, fill:false, spanGaps:false, order:1 }
            ]},
            options:{ responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11},usePointStyle:true} },
                    tooltip:{ callbacks:{ label: ctx => {
                        if (ctx.datasetIndex === 0) return `${ctx.parsed.y} sessions`;
                        if (ctx.parsed.y === null) return null;
                        return `Cycling power: ${ctx.parsed.y}W (${timeOfDay.blockCounts[ctx.dataIndex]} rides in this block)`;
                    }}}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ position:'left', beginAtZero:true,
                        title:{display:true,text:'Sessions',color:C.black},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y1:{ position:'right',
                         min: pw.length ? Math.floor((Math.min(...pw)-20)/10)*10 : 0,
                         max: pw.length ? Math.ceil((Math.max(...pw)+20)/10)*10 : 100,
                         title:{display:true,text:'Avg. cycling power (W)',color:C.red},
                         ticks:{color:C.red,callback:v=>v+'W'}, grid:{drawOnChartArea:false} }
                }
            }
        });
    })();

    // 15b · Weekly load with acute:chronic ratio
    (()=>{
        const el = document.getElementById('loadChart');
        if (!el || !weeklyLoad.labels.length) return;
        // Colour the bars by the ratio so ramps and drop-offs read without the line.
        const barCols = weeklyLoad.acwr.map(a =>
            a === null ? '#c4c4c4' : a > 1.5 ? '#c0392b' : a < 0.8 ? '#d8d8d8' : '#575757');
        new Chart(el,{
            data:{ labels: weeklyLoad.labels, datasets:[
                { type:'bar', label:'Hours trained', data: weeklyLoad.hours,
                  backgroundColor: barCols, borderWidth:0, yAxisID:'y', order:2 },
                { type:'line', label:`Week vs trailing ${ACWR_CHRONIC_WEEKS}-week average`,
                  data: weeklyLoad.acwr, yAxisID:'y1',
                  borderColor:'#000', borderWidth:1.8, borderDash:[5,3],
                  tension:0.25, pointRadius:0, fill:false, spanGaps:false, order:1 }
            ]},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top',
                        labels:{ color:C.mid, font:{size:10}, usePointStyle:true,
                                 sort:(a,b)=>a.datasetIndex-b.datasetIndex } },
                    tooltip:{ callbacks:{
                        title: items => `Week of ${items[0].label}`,
                        label: ctx => ctx.datasetIndex === 0
                            ? `${ctx.parsed.y} hours`
                            : (ctx.parsed.y === null ? null
                               : `Ratio ${ctx.parsed.y}` + (ctx.parsed.y > 1.5 ? ' — sharp ramp'
                                  : ctx.parsed.y < 0.8 ? ' — drop-off' : ''))
                    }}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45,autoSkip:true,maxTicksLimit:16},
                        grid:{display:false} },
                    y:{ position:'left', beginAtZero:true,
                        title:{display:true,text:'Hours in the week',color:C.black},
                        ticks:{color:C.mid,callback:v=>v+' h'}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y1:{ position:'right', beginAtZero:true,
                         max: Math.max(2, Math.ceil(Math.max(
                             ...weeklyLoad.acwr.filter(v=>v!==null), 1.5) * 4) / 4),
                         title:{display:true,text:'Acute : chronic ratio',color:C.black},
                         ticks:{color:C.mid}, grid:{drawOnChartArea:false} }
                }
            },
            plugins:[{ id:'acwrBands', beforeDatasetsDraw(chart){
                // Shade the 0.8–1.5 corridor so "normal" is visible, not memorised.
                const ys = chart.scales.y1, xs = chart.scales.x, ctx = chart.ctx;
                if (!ys) return;
                const yTop = ys.getPixelForValue(1.5), yBot = ys.getPixelForValue(0.8);
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.035)';
                ctx.fillRect(xs.left, yTop, xs.right-xs.left, yBot-yTop);
                ctx.restore();
            }}]
        });
    })();

    // 15c · Consistency calendar
    (()=>{
        const host = document.getElementById('calendar');
        if (!host || !calendar.length) return;
        // Same intensity steps either way, so length still reads; the ramp
        // chosen says whether the day was training or recovery.
        const shade = (mins, trained) => {
            const ramp = trained ? CAL_TRAIN : CAL_RECOV;
            if (!mins) return ramp[0];
            let i = 0; while (i < CAL_STEPS.length && mins > CAL_STEPS[i]) i++;
            return ramp[Math.min(i, ramp.length-1)];
        };
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        calendar.forEach(y => {
            const wrap = document.createElement('div');
            wrap.className = 'cal-year';
            wrap.innerHTML = `<div class="cal-head"><span class="y">${y.year}</span>` +
                `<span class="s">${y.active} active of ${y.elapsed} days · ${y.pct}%` +
                ` &nbsp;·&nbsp; ${y.trained} training, ${y.recovery} recovery-only</span></div>`;
            const grid = document.createElement('div');
            grid.className = 'cal-grid';
            // Pad so the first column starts on the right weekday
            for (let i = 0; i < y.days[0].dow; i++) {
                const pad = document.createElement('div');
                pad.className = 'cal-cell'; pad.style.background = 'transparent';
                grid.appendChild(pad);
            }
            y.days.forEach(d => {
                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                // A day that has not arrived yet is blank, not a rest day —
                // otherwise the rest of the year reads as months of nothing.
                cell.style.background = d.future ? 'transparent' : shade(d.mins, d.trained);
                cell.title = d.future ? `${d.date} · not yet`
                           : d.mins ? `${d.date} · ${d.mins} min · ${d.trained ? 'training' : 'recovery only'}`
                           : `${d.date} · rest`;
                grid.appendChild(cell);
            });
            wrap.appendChild(grid);
            host.appendChild(wrap);
        });
        const legend = document.createElement('div');
        legend.className = 'cal-legend';
        const ramp = arr => arr.slice(1).map(c=>`<i style="background:${c}"></i>`).join('');
        legend.innerHTML =
            `<span>Training</span>${ramp(CAL_TRAIN)}` +
            `<span class="gap">Recovery only</span>${ramp(CAL_RECOV)}` +
            `<span class="gap">Rest</span><i style="background:${CAL_TRAIN[0]}"></i>` +
            `<span class="gap">shorter → longer session</span>`;
        host.appendChild(legend);
    })();

    // 15 · Instructors
    new Chart(document.getElementById('instructorChart'),{
        type:'bar',
        data:{ labels:instructors.labels, datasets:[{ data:instructors.hours, backgroundColor:grays, borderWidth:0 }] },
        options:{ indexAxis:'y', responsive:true,
            plugins:{
                legend:{display:false},
                tooltip:{ callbacks:{ label:ctx=>`${ctx.parsed.x} hrs (${instructors.classes[ctx.dataIndex]} classes)` }}
            },
            scales:{
                x:{ beginAtZero:true,
                    title:{ display:true, text:'Hours spent', color:C.mid, font:{size:11} },
                    ticks:{ color:C.mid, callback:v=>v+' hrs' }, grid:{ color:'rgba(0,0,0,0.04)' } },
                y:{ ticks:{color:C.mid,font:{size:10}}, grid:{display:false} }
            }
        }
    });
}

// ─────────────────────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────────────────────
async function boot() {
    showLoading();

    let csvText = null, lastModified = null;
    try {
        const res = await fetch(CSV_FILENAME, { cache:'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
        lastModified = res.headers.get('Last-Modified') || new Date().toISOString();
        csvText = await res.text();
    } catch (fetchErr) {
        try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            if (cached?.data) {
                console.warn('CSV fetch failed; using cache:', fetchErr.message);
                renderDashboard(cached.data, cached.lastModified);
                return;
            }
        } catch (_) {}
        showError(fetchErr.message);
        return;
    }

    const rows    = parseCSV(csvText);
    const missing = validateColumns(rows);
    if (missing.length) { showValidationError(missing); return; }

    try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached?.lastModified === lastModified && cached?.rowCount === rows.length) {
            console.log('Cache hit — skipping re-processing.');
            renderDashboard(cached.data, cached.lastModified);
            return;
        }
    } catch (_) {}

    const processed = processData(rows);
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data: processed, lastModified, rowCount: rows.length,
            cachedAt: new Date().toISOString()
        }));
    } catch (e) {
        console.warn('localStorage write failed:', e.message);
    }

    renderDashboard(processed, lastModified);
}

boot();

</script>
