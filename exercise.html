<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peloton Workout Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:#fff;
    color:#000;
    padding:48px 24px;
    line-height:1.6;
}
.container { max-width:1200px; margin:0 auto; }

/* ── Header ── */
.header { border-bottom:2px solid #000; padding-bottom:28px; margin-bottom:44px; }
.header h1 { font-size:2.4em; font-weight:700; letter-spacing:-.5px; margin-bottom:6px; }
.header-meta { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
.header .subtitle { font-size:.95em; color:#666; }
.last-updated { font-size:.78em; color:#999; font-style:italic; }
.nav-link { font-size:.78em; color:#999; }
.nav-link a { color:#999; text-decoration:none; }
.nav-link a:hover { color:#000; text-decoration:underline; }

/* ── Stat cards ── */
.stats-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:48px;
}
.stat-card { border:2px solid #000; padding:22px 14px; text-align:center; transition:background .15s; }
.stat-card:hover { background:#f5f5f5; }
.stat-card .value { font-size:2em; font-weight:700; margin-bottom:5px; font-variant-numeric:tabular-nums; line-height:1.1; }
.stat-card .label { font-size:.75em; text-transform:uppercase; letter-spacing:1.1px; color:#666; }
.stat-card.accent { border-color:#c0392b; }
.stat-card.accent .value { color:#c0392b; }

/* ── Section dividers ── */
.section-head { margin:56px 0 24px; padding-bottom:10px; border-bottom:2px solid #000; }
.section-head:first-of-type { margin-top:0; }
.section-head h2 { font-size:1.35em; font-weight:700; letter-spacing:-.3px; }
.section-head p { font-size:.85em; color:#666; margin-top:3px; }

/* ── Discipline tabs ── */
.tabs { display:flex; flex-wrap:wrap; gap:0; margin:0 0 24px; border-bottom:2px solid #000; }
.tabs button {
    font:inherit; font-size:.9em; font-weight:600; letter-spacing:.2px;
    background:none; border:0; border-bottom:3px solid transparent;
    padding:10px 18px; margin-bottom:-2px; cursor:pointer; color:#888;
    transition:color .15s, border-color .15s;
}
.tabs button:hover { color:#000; }
.tabs button[aria-selected="true"] { color:#000; border-bottom-color:#c0392b; }
.tabs button .n { font-weight:400; color:#aaa; font-size:.85em; margin-left:6px; }
.tabs button[aria-selected="true"] .n { color:#c0392b; }
.tab-panel[hidden] { display:none; }
/* The active tab already names the discipline, so the panel only needs its
   numbers — not a second heading repeating the label. */
.panel-meta { font-size:.85em; color:#666; margin:-6px 0 22px; }

/* ── Consistency calendar ── */
.cal-year { margin-bottom:18px; }
.cal-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.cal-head .y { font-weight:700; font-size:.95em; }
.cal-head .s { font-size:.78em; color:#666; }
.cal-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr);
            gap:2px; overflow-x:auto; padding-bottom:4px; }
.cal-cell { width:11px; height:11px; border-radius:2px; background:#f0f0f0; }
.cal-legend { display:flex; align-items:center; gap:4px; flex-wrap:wrap;
               font-size:.72em; color:#888; margin-top:10px; }
.cal-legend .gap { margin-left:14px; }
.cal-legend i { width:11px; height:11px; border-radius:2px; display:inline-block; }
@media(max-width:600px){ .cal-cell, .cal-legend i { width:8px; height:8px; } }

/* ── Chart containers ── */
.chart-container { border:1px solid #ccc; padding:24px; margin-bottom:28px; background:#fff; }
.chart-container h2 { font-size:1.15em; font-weight:600; margin-bottom:5px; letter-spacing:-.2px; }
.chart-container .description { color:#666; font-size:.82em; margin-bottom:16px; }
.chart-container.feature { border:2px solid #000; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; }

canvas { max-height:400px; max-width:100%; }

/* ── Insight box ── */
.insight-box {
    border-left:3px solid #000;
    padding:16px 20px;
    margin:0 0 40px;
    background:#f9f9f9;
    font-size:.9em;
    line-height:1.75;
}
.insight-box strong { font-weight:700; }

/* ── Method note (explains a chart's filtering choices) ── */
.method-note {
    margin-top:14px; padding:10px 14px;
    background:#f7f7f7; border-left:2px solid #999;
    font-size:.76em; color:#555; line-height:1.6;
}
.method-note b { color:#000; }

/* ── Takeaway strip under a feature chart ── */
.takeaway {
    display:flex; flex-wrap:wrap; gap:0; margin-top:18px;
    border-top:1px solid #ddd; padding-top:14px;
}
.takeaway div { flex:1 1 130px; padding:0 14px; border-left:1px solid #eee; }
.takeaway div:first-child { border-left:0; padding-left:0; }
.takeaway .k { font-size:.68em; text-transform:uppercase; letter-spacing:1px; color:#888; }
.takeaway .v { font-size:1.25em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3; }
.takeaway .v.up { color:#c0392b; }

/* ── State screens ── */
.state-screen {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; text-align:center; gap:18px;
}
.state-screen .icon { font-size:3em; }
.state-screen h2 { font-size:1.4em; font-weight:600; }
.state-screen p { color:#666; font-size:.95em; max-width:480px; line-height:1.6; }
.state-screen code {
    background:#f3f3f3; border:1px solid #ddd;
    padding:12px 20px; font-family:monospace; font-size:.9em; color:#333;
    display:block; margin-top:4px;
}
.error-detail { color:#c0392b; font-size:.85em; font-family:monospace; }
.spinner {
    width:40px; height:40px;
    border:3px solid #eee; border-top-color:#000;
    border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Footer ── */
.footer { text-align:center; margin-top:48px; padding-top:24px; border-top:1px solid #ccc; color:#999; font-size:.82em; }

/* ── Tablet ── */
@media(max-width:900px){
    .stats-grid { grid-template-columns:repeat(3,1fr); }
    .three-col { grid-template-columns:1fr 1fr; }
}

/* ── Mobile ── */
@media(max-width:600px){
    body { padding:24px 14px; }
    .header h1 { font-size:1.6em; }
    .header-meta { flex-direction:column; gap:4px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:32px; }
    .stat-card { padding:16px 10px; }
    .stat-card .value { font-size:1.5em; }
    .stat-card .label { font-size:.68em; }
    .two-col { grid-template-columns:1fr; gap:0; }
    .two-col .chart-container { margin-bottom:28px; }
    .three-col { grid-template-columns:1fr; }
    .chart-container { padding:18px 14px; }
    canvas { max-height:300px; }
    .takeaway div { flex:1 1 50%; border-left:0; padding:6px 0; }
    .section-head h2 { font-size:1.15em; }
    .tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .tabs button { padding:9px 13px; font-size:.82em; white-space:nowrap; }
}
</style>

<script>
{% raw %}
/* ─────────────────────────────────────────────────────────────────────────
   LIQUID GUARD — do not remove the Liquid raw/endraw tags wrapping this
   script. (They are deliberately not spelled out inside this comment: a
   literal endraw tag here would close the guard early, orphan the real one
   at the bottom, and fail the Jekyll build with "Unknown tag 'endraw'".)

   This page carries Jekyll front matter (see the top of the file), which
   means Jekyll runs Liquid over it before serving. Liquid treats {{ ... }}
   as an expression to evaluate, and this file is ~2,700 lines of chart
   configuration full of nested object literals — so a perfectly ordinary
   edit like `scales:{{x:1}}` puts two braces side by side and Liquid
   silently DELETES that span. It does not raise a build error: the page
   deploys, the JavaScript is corrupt, and the dashboard renders blank.

   Everything between the raw tags is passed through untouched, which makes
   that failure impossible rather than merely unlikely. Jekyll strips the
   tags themselves, so they never reach the browser.

   The trade-off: no Liquid works in here either. If you ever genuinely need
   a Jekyll value in this script, put it in a data attribute on an element
   outside this block and read it from the DOM.
   ───────────────────────────────────────────────────────────────────────── */
// ─────────────────────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────────────────────
// Absolute path: the page is served from /exercise/ (see the permalink in this
// file's front matter), so a relative name would resolve to /exercise/<file>.
const CSV_FILENAME  = '/kambizkamrani_workouts.csv';
const CACHE_KEY     = 'peloton_cache_v15'; // v15: calendar splits training from recovery-only days
const REQUIRED_COLS = [
    'Workout Timestamp','Fitness Discipline','Length (minutes)',
    'Calories Burned','Avg. Watts','Avg. Heartrate','Instructor Name'
];

// An "effort session" is real training: long enough to count, and not a
// warm-up/cool-down. Peloton logs 5-min warm-ups and cool-downs as full workouts;
// by 2026 they were 57% of all logged rides at ~60W, which drags any raw average
// down over time and hides genuine gains. The minimum length is per-discipline
// (see DISCIPLINE_SPECS) because a 10-minute row is a session while a 10-minute
// ride, in this data, is usually a warm-up.
const NON_EFFORT_TYPES = ['Warm Up','Cool Down'];

// Outdoor rides are logged with a heart rate but no power meter, so they arrive
// as 0W. Left in, they drag the power average down and stack a false row of
// points along the 0W axis of the scatter. Power metrics require watts > 0.

const MIN_PER_BUCKET  = 3;  // monthly series: suppress a point below this many rides

// ─────────────────────────────────────────────────────────────
//  DISCIPLINE SPECS
//  Each discipline gets the same battery of progression charts; they differ
//  only in what counts as "performance" and what units that is measured in.
//
//  UNITS WARNING: Peloton labels two columns "Distance (mi)" and
//  "Avg. Speed (mph)" for every discipline, but the ROWER writes metres and
//  metres/second into them. Verified against distance = speed x time: the
//  mph/miles reading is off by 100% for rowing and by <1% for everything
//  else. Each spec therefore states its own conversion rather than assuming.
//
//  Performance is normalised to a per-minute rate so that dividing by heart
//  rate (beats per minute) yields a clean per-heartbeat figure:
//    cycling  -> watts            / bpm = watts per heartbeat
//    others   -> metres-per-min   / bpm = metres per heartbeat
// ─────────────────────────────────────────────────────────────
const MI_TO_M = 1609.34;
// Seconds per 500 m, from a pace in metres per minute — rowing's native unit.
function splitFmt(mPerMin) {
    const sec = 500 / (mPerMin/60);
    return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}`;
}
const DISCIPLINE_SPECS = [
    {
        key:'cycling', label:'Cycling', disciplines:['Cycling'],
        perfName:'Power', perfUnit:'W', effUnit:'W/beat', effName:'Watts per heartbeat',
        perfDigits:0, effDigits:2, minMinutes:15,
        perfAxis:'Power (W)', toDisplay:v=>v, fmt:v=>v.toFixed(0)+'W',
        // Outdoor rides record heart rate but no power, arriving as 0W; they would
        // drag the average down and stack a false row of points along the 0W axis.
        perf: r => { const w = num(r,'Avg. Watts'); return w !== null && w > 0 ? w : null; },
        buckets:[
            { key:'20', label:'~20 min', lo:15, hi:24 },
            { key:'30', label:'~30 min', lo:25, hi:37 },
            { key:'45', label:'~45 min', lo:38, hi:52 },
            { key:'60', label:'60+ min', lo:53, hi:1e9 }
        ]
    },
    {
        key:'walking', label:'Walking & Hiking', disciplines:['Walking'],
        perfName:'Speed', perfUnit:'m/min', effUnit:'m/beat', effName:'Metres per Heartbeat',
        perfDigits:1, effDigits:3, minMinutes:15,
        perfAxis:'Speed (mph)', toDisplay:v=>v*60/MI_TO_M, fmt:v=>(v*60/MI_TO_M).toFixed(2)+' mph',
        perf: r => { const v = num(r,'Avg. Speed (mph)'); return v !== null && v > 0 ? v*MI_TO_M/60 : null; },
        buckets:[
            { key:'20', label:'~20 min', lo:15, hi:24 },
            { key:'30', label:'~30 min', lo:25, hi:37 },
            { key:'45', label:'~45 min', lo:38, hi:52 },
            { key:'60', label:'60+ min', lo:53, hi:1e9 }
        ]
    },
    {
        key:'running', label:'Running', disciplines:['Running'],
        perfName:'Speed', perfUnit:'m/min', effUnit:'m/beat', effName:'Metres per Heartbeat',
        perfDigits:1, effDigits:3, minMinutes:15,
        perfAxis:'Speed (mph)', toDisplay:v=>v*60/MI_TO_M, fmt:v=>(v*60/MI_TO_M).toFixed(2)+' mph',
        perf: r => { const v = num(r,'Avg. Speed (mph)'); return v !== null && v > 0 ? v*MI_TO_M/60 : null; },
        buckets:[
            { key:'20', label:'~20 min', lo:15, hi:24 },
            { key:'30', label:'~30 min', lo:25, hi:37 },
            { key:'45', label:'45+ min', lo:38, hi:1e9 }
        ]
    },
    {
        key:'rowing', label:'Rowing', disciplines:['Rowing'],
        perfName:'Pace', perfUnit:'m/min', effUnit:'m/beat', effName:'Metres per Heartbeat',
        perfDigits:1, effDigits:3, minMinutes:10,   // 10-min rows are real sessions, not warm-ups
        // Kept as metres/min so "up is better" holds like every other section; the
        // 500 m split every rower actually thinks in is shown in the tooltip.
        perfAxis:'Pace (m/min)', toDisplay:v=>v,
        fmt:v=>`${v.toFixed(0)} m/min (${splitFmt(v)}/500m)`,
        // Rower reports metres/second in the "mph" column — see units warning above.
        perf: r => { const v = num(r,'Avg. Speed (mph)'); return v !== null && v > 0 ? v*60 : null; },
        buckets:[
            { key:'20', label:'~20 min', lo:15, hi:24 },
            { key:'30', label:'30+ min', lo:25, hi:1e9 }
        ]
    }
];
// A discipline needs this much history before trend lines mean anything.
const MIN_TREND_MONTHS   = 6;
const MIN_TREND_SESSIONS = 40;
// Class-type breakdown thresholds (quoted by the section renderer, so module scope).
const TYPE_MIN_SESSIONS  = 8;
const TYPE_MIN_KINDS     = 3;   // fewer than this is a fact, not a chart
// Weeks of history the acute:chronic ratio compares each week against, and the
// minimum base below which the ratio is not meaningful (see weeklyLoad).
const ACWR_CHRONIC_WEEKS     = 4;
const ACWR_MIN_CHRONIC_HOURS = 2;
// Calendar shading steps, in minutes logged on the day. Two ramps of the same
// intensity so a day's length still reads, while hue separates a training day
// from one spent entirely on yoga, stretching or meditation — the distinction
// a raw "active day" count hides.
const CAL_STEPS  = [0, 30, 60, 90, 120];
const CAL_TRAIN  = ['#f0f0f0','#c8c8c8','#8f8f8f','#5a5a5a','#2b2b2b','#000000'];
const CAL_RECOV  = ['#f0f0f0','#f3ded9','#e4b5ab','#d28b7c','#c0654f','#a8452f'];
// What counts as training rather than recovery.
const TRAINING_DISCIPLINES = ['Cycling','Running','Walking','Rowing','Strength','Cardio'];
const MIN_PER_LENGTH  = 5;  // duration-split series: needs more, since it splits four ways

// ─────────────────────────────────────────────────────────────
//  PALETTE
// ─────────────────────────────────────────────────────────────
const C = { black:'#000', dark:'#333', mid:'#666', light:'#999', vlight:'#ccc', red:'#c0392b' };
const grays = ['#1a1a1a','#2e2e2e','#424242','#575757','#6b6b6b','#808080','#949494','#a8a8a8','#bcbcbc'];
const vivid  = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e','#e91e63'];

Chart.defaults.font.family = 'inherit';
Chart.defaults.color       = C.mid;
Chart.defaults.borderColor = '#e8e8e8';

// ─────────────────────────────────────────────────────────────
//  STATE SCREENS
// ─────────────────────────────────────────────────────────────
const app = document.getElementById('app');

function showLoading() {
    app.innerHTML = `
        <div class="state-screen">
            <div class="spinner"></div>
            <h2>Loading workout data…</h2>
            <p>Fetching <code>${CSV_FILENAME}</code> from the same folder as this file.</p>
        </div>`;
}

function showError(detail) {
    app.innerHTML = `
        <div class="state-screen">
            <div class="icon">⚠️</div>
            <h2>Could not load ${CSV_FILENAME}</h2>
            <p class="error-detail">${detail}</p>
            <p>Place <code>${CSV_FILENAME}</code> in the same folder as this HTML file and reload.</p>
        </div>`;
}

function showValidationError(missing) {
    app.innerHTML = `
        <div class="state-screen">
            <div class="icon">🚫</div>
            <h2>Unexpected CSV format</h2>
            <p>This doesn't look like a Peloton workout export.<br>Missing columns:</p>
            <code>${missing.join(', ')}</code>
            <p>Please use the CSV exported directly from your Peloton profile page.</p>
        </div>`;
}

// ─────────────────────────────────────────────────────────────
//  CSV PARSER
// ─────────────────────────────────────────────────────────────
function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
        const fields = [];
        let cur = '', inQ = false;
        for (const ch of line) {
            if (ch === '"') inQ = !inQ;
            else if (ch === ',' && !inQ) { fields.push(cur); cur = ''; }
            else cur += ch;
        }
        fields.push(cur);
        const row = {};
        headers.forEach((h, i) => { row[h] = (fields[i] ?? '').trim(); });
        return row;
    });
}

// ─────────────────────────────────────────────────────────────
//  TIMESTAMP PARSER
// ─────────────────────────────────────────────────────────────
function parseTS(s) {
    if (!s) return null;
    const d = new Date(s.replace(/\s*\([^)]*\)$/, '').trim());
    return isNaN(d.getTime()) ? null : d;
}

// ─────────────────────────────────────────────────────────────
//  VALIDATE
// ─────────────────────────────────────────────────────────────
function validateColumns(rows) {
    if (!rows.length) return ['(file is empty)'];
    const cols = Object.keys(rows[0]);
    return REQUIRED_COLS.filter(c => !cols.includes(c));
}

// ─────────────────────────────────────────────────────────────
//  SHARED HELPERS
// ─────────────────────────────────────────────────────────────
// Peloton writes resistance as "40%" — strip the sign before parsing.
const num = (r, k) => {
    const raw = (r[k] ?? '').toString().trim().replace('%','');
    if (raw === '') return null;
    const v = parseFloat(raw);
    return isNaN(v) ? null : v;
};

function groupBy(arr, fn) {
    const m = new Map();
    arr.forEach(r => { const k = fn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
    return m;
}

function meanStd(arr) {
    const a = arr.filter(v => v !== null && v !== undefined);
    if (!a.length) return { mean:null, std:0 };
    const m = a.reduce((x,y)=>x+y,0) / a.length;
    const s = a.length > 1 ? Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)) : 0;
    return { mean:+m.toFixed(1), std:+s.toFixed(1) };
}

// ─────────────────────────────────────────────────────────────
//  GENERIC DISCIPLINE ANALYZER
//  Runs the same battery of progression metrics over any discipline, given a
//  spec that says how to read "performance" out of a row. Returns null-ish
//  sections rather than fabricating a trend when the data is too thin.
// ─────────────────────────────────────────────────────────────
function analyzeDiscipline(valid, spec) {
    const inDiscipline = r => spec.disciplines.includes(r['Fitness Discipline']);

    // A session counts only if it is a real effort (long enough, not a warm-up or
    // cool-down) and carries both a performance figure and a heart rate.
    const sessions = valid.filter(r =>
        inDiscipline(r) &&
        (num(r,'Length (minutes)') || 0) >= spec.minMinutes &&
        !NON_EFFORT_TYPES.includes((r['Type'] || '').trim()) &&
        spec.perf(r) !== null &&
        num(r,'Avg. Heartrate') !== null
    ).sort((a,b) => a.ts - b.ts);

    const allInDiscipline = valid.filter(inDiscipline);
    const out = {
        spec, sessions,
        totalSessions: allInDiscipline.length,
        totalMinutes:  Math.round(allInDiscipline.reduce((s,r)=>s+(num(r,'Length (minutes)')||0),0)),
        // Sessions dropped for want of a usable performance figure — worth stating
        // rather than silently shrinking the denominator.
        excluded: allInDiscipline.filter(r =>
            (num(r,'Length (minutes)') || 0) >= spec.minMinutes &&
            !NON_EFFORT_TYPES.includes((r['Type'] || '').trim()) &&
            spec.perf(r) === null).length
    };

    if (!sessions.length) {
        return { ...out, hasData:false, hasTrend:false,
                 trend:{labels:[]}, efficiency:{labels:[]}, byLength:null,
                 scatter:null, classProgress:[], summary:null };
    }

    // ── Monthly trend, time-weighted by session length ─────────
    const byMonth   = groupBy(sessions, r=>r._ym);
    const monthKeys = [...byMonth.keys()].sort().filter(k=>byMonth.get(k).length >= MIN_PER_BUCKET);

    function weighted(rows, valueOf) {
        const totalMin = rows.reduce((s,r)=>s+(num(r,'Length (minutes)')||0),0);
        if (totalMin === 0) return { mean:null, std:0 };
        const mu = rows.reduce((s,r)=>s+valueOf(r)*(num(r,'Length (minutes)')||0),0) / totalMin;
        const variance = rows.reduce((s,r)=>{
            const w = num(r,'Length (minutes)')||0;
            return s + w*(valueOf(r)-mu)**2;
        },0) / totalMin;
        return { mean:+mu.toFixed(2), std:+Math.sqrt(variance).toFixed(2) };
    }

    const trend = {
        labels: monthKeys,
        perf:      monthKeys.map(k=>weighted(byMonth.get(k), spec.perf).mean),
        perfStd:   monthKeys.map(k=>weighted(byMonth.get(k), spec.perf).std),
        hr:        monthKeys.map(k=>weighted(byMonth.get(k), r=>num(r,'Avg. Heartrate')).mean),
        hrStd:     monthKeys.map(k=>weighted(byMonth.get(k), r=>num(r,'Avg. Heartrate')).std),
        count:     monthKeys.map(k=>byMonth.get(k).length)
    };

    // ── Efficiency: performance per heartbeat, per session then averaged ──
    const efficiency = {
        labels: monthKeys,
        value:  monthKeys.map(k => {
            const vals = byMonth.get(k).map(r => spec.perf(r)/num(r,'Avg. Heartrate'));
            return +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(4);
        }),
        count:  monthKeys.map(k=>byMonth.get(k).length)
    };
    efficiency.trend = linearTrend(efficiency.value);

    // Enough history to draw a trend line at all?
    const hasTrend = monthKeys.length >= MIN_TREND_MONTHS && sessions.length >= MIN_TREND_SESSIONS;

    // ── Performance held at constant session length ────────────
    const periodKeys = [...new Set(sessions.map(r=>r._hy))].sort();
    const byLength = { labels: periodKeys, series:{}, counts:{}, buckets: spec.buckets };
    spec.buckets.forEach(b => {
        const cells = periodKeys.map(q => sessions.filter(r =>
            r._hy===q && num(r,'Length (minutes)')>=b.lo && num(r,'Length (minutes)')<=b.hi
        ));
        byLength.series[b.key] = cells.map(rows => rows.length < MIN_PER_LENGTH ? null
            : +(rows.reduce((s,r)=>s+spec.perf(r),0)/rows.length).toFixed(2));
        byLength.counts[b.key] = cells.map(rows => rows.length);
    });
    const hasAny = periodKeys.map((_,i)=>spec.buckets.some(b=>byLength.series[b.key][i]!==null));
    const firstI = hasAny.indexOf(true), lastI = hasAny.lastIndexOf(true);
    if (firstI > -1) {
        byLength.labels = periodKeys.slice(firstI, lastI+1);
        spec.buckets.forEach(b => {
            byLength.series[b.key] = byLength.series[b.key].slice(firstI, lastI+1);
            byLength.counts[b.key] = byLength.counts[b.key].slice(firstI, lastI+1);
        });
    }
    // Only worth drawing if at least one band has two points to join
    byLength.usable = spec.buckets.some(b => byLength.series[b.key].filter(v=>v!==null).length >= 2);

    // ── Every session in heart-rate x performance space ────────
    const scatterYears = [...new Set(sessions.map(r=>r._yr))].sort((a,b)=>a-b);
    const scatter = {
        years: scatterYears,
        points: Object.fromEntries(scatterYears.map(y => [y,
            sessions.filter(r=>r._yr===y).map(r=>({
                x:num(r,'Avg. Heartrate'), y:+spec.perf(r).toFixed(2)
            }))
        ]))
    };

    // ── Same class, repeated ───────────────────────────────────
    const classProgress = [...groupBy(sessions, r=>r['Title']).entries()]
        .filter(([,v]) => v.length >= 6)
        .map(([title,v]) => {
            const early  = v.slice(0,3).map(spec.perf);
            const recent = v.slice(-3).map(spec.perf);
            const e = early.reduce((a,b)=>a+b,0)/early.length;
            const l = recent.reduce((a,b)=>a+b,0)/recent.length;
            return { title, rides:v.length,
                     early:+e.toFixed(2), recent:+l.toFixed(2),
                     gain:+(l-e).toFixed(2), pct:+((l-e)/e*100).toFixed(1),
                     best:+Math.max(...v.map(spec.perf)).toFixed(2) };
        })
        .sort((a,b)=>b.gain-a.gain)
        .slice(0,10);

    // ── Then-vs-now summary over the first and last 15% of sessions ──
    const avg = (rows, valueOf) => {
        const v = rows.map(valueOf).filter(x=>x!==null && !isNaN(x));
        return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
    };
    const nWin = Math.max(5, Math.round(sessions.length * 0.15));
    const firstWin = sessions.slice(0, nWin), lastWin = sessions.slice(-nWin);
    const pE = avg(firstWin, spec.perf),                    pN = avg(lastWin, spec.perf);
    const hE = avg(firstWin, r=>num(r,'Avg. Heartrate')),   hN = avg(lastWin, r=>num(r,'Avg. Heartrate'));
    const eE = avg(firstWin, r=>spec.perf(r)/num(r,'Avg. Heartrate'));
    const eN = avg(lastWin,  r=>spec.perf(r)/num(r,'Avg. Heartrate'));
    const summary = {
        perfEarly:+pE.toFixed(spec.perfDigits), perfNow:+pN.toFixed(spec.perfDigits),
        hrEarly:Math.round(hE),                 hrNow:Math.round(hN),
        effEarly:+eE.toFixed(spec.effDigits),   effNow:+eN.toFixed(spec.effDigits),
        perfPct:Math.round((pN/pE-1)*100),      effPct:Math.round((eN/eE-1)*100),
        hrDelta:Math.round(hN-hE),              windowSize:nWin
    };
    // Legacy aliases so the cycling section's existing copy keeps working
    summary.powerEarly = summary.perfEarly;
    summary.powerNow   = summary.perfNow;
    summary.powerPct   = summary.perfPct;

    return { ...out, hasData:true, hasTrend, trend, efficiency, byLength, scatter,
             classProgress, summary, months:monthKeys.length };
}

// Pad a value range and round the ends outward to a readable step, so an axis
// bounded to its data still lands on round numbers rather than 78.75.
function niceBounds(values, padFrac) {
    const lo = Math.min(...values), hi = Math.max(...values);
    const pad = Math.max((hi - lo) * padFrac, Math.abs(hi) * 1e-3) || 1;
    const raw = (hi + pad) - (lo - pad);
    const step = Math.pow(10, Math.floor(Math.log10(raw))) / 4;
    return { lo: Math.max(0, Math.floor((lo - pad)/step)*step),
             hi: Math.ceil((hi + pad)/step)*step };
}

// Least-squares fit over indexed points; returns y-values for a straight trend line.
function linearTrend(values) {
    const pts = values.map((v,i)=>[i,v]).filter(p => p[1] !== null);
    if (pts.length < 2) return values.map(()=>null);
    const n = pts.length;
    const sx = pts.reduce((s,p)=>s+p[0],0), sy = pts.reduce((s,p)=>s+p[1],0);
    const sxy = pts.reduce((s,p)=>s+p[0]*p[1],0), sxx = pts.reduce((s,p)=>s+p[0]*p[0],0);
    const denom = n*sxx - sx*sx;
    if (denom === 0) return values.map(()=>null);
    const slope = (n*sxy - sx*sy) / denom;
    const inter = (sy - slope*sx) / n;
    return values.map((_,i)=> +(inter + slope*i).toFixed(3));
}

// ─────────────────────────────────────────────────────────────
//  DATA PROCESSOR
// ─────────────────────────────────────────────────────────────
function processData(rows) {
    const valid = rows
        .map(r => ({ ...r, ts: parseTS(r['Workout Timestamp']) }))
        .filter(r => r.ts !== null);

    const ym  = ts => `${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}`;

    valid.forEach(r => {
        r._ym  = ym(r.ts);
        r._yr  = r.ts.getFullYear();
        r._q   = `${r.ts.getFullYear()} Q${Math.floor(r.ts.getMonth()/3)+1}`;
        // Half-years keep the duration-split buckets large enough to be stable
        r._hy  = `${r.ts.getFullYear()} H${r.ts.getMonth() < 6 ? 1 : 2}`;
    });

    // ── Cycling subsets ────────────────────────────────────────
    // The effort-ride set itself now comes from analyzeDiscipline (below); this
    // is just the whole-discipline slice used for lifetime distance and output.
    const cyclingAll = valid.filter(r => r['Fitness Discipline'] === 'Cycling');

    // ═══════════════════════════════════════════════════════════
    //  PROGRESSION METRICS
    //  One analyzer, run per discipline. Each discipline supplies its own
    //  performance metric; everything downstream (trend, efficiency, split by
    //  session length, scatter, same-class progression) is shared.
    // ═══════════════════════════════════════════════════════════
    const disciplineStats = {};
    DISCIPLINE_SPECS.forEach(spec => {
        disciplineStats[spec.key] = analyzeDiscipline(valid, spec);
    });

    // Cycling remains the reference section and keeps its own extras.
    const cycling     = disciplineStats.cycling;
    const effort      = cycling.sessions;
    const progression = cycling.summary;

    // ── Headline stats ─────────────────────────────────────────
    const totalMinutes = valid.reduce((s,r)=>s+(num(r,'Length (minutes)')||0),0);
    const dates     = valid.map(r=>r.ts.getTime());
    const firstDate = new Date(Math.min(...dates));
    const lastDate  = new Date(Math.max(...dates));
    const fmtDate   = d => d.toLocaleDateString('en-US',{month:'short',year:'numeric'});

    const stats = {
        totalWorkouts:   valid.length,
        totalCalories:   Math.round(valid.reduce((s,r)=>s+(num(r,'Calories Burned')||0),0)),
        totalHours:      +(totalMinutes/60).toFixed(1),
        cyclingDistance: +cyclingAll.reduce((s,r)=>s+(num(r,'Distance (mi)')||0),0).toFixed(1),
        runWalkDistance: +valid
            .filter(r=>['Running','Walking'].includes(r['Fitness Discipline']))
            .reduce((s,r)=>s+(num(r,'Distance (mi)')||0),0).toFixed(1),
        totalOutputKJ:   Math.round(cyclingAll.reduce((s,r)=>s+(num(r,'Total Output')||0),0)),
        effortRides:     effort.length,
        noPowerRides:    cycling.excluded,
        firstDate:       fmtDate(firstDate),
        lastDate:        fmtDate(lastDate)
    };

    // ── Disciplines ────────────────────────────────────────────
    const byDisc = groupBy(valid, r=>r['Fitness Discipline']);
    const discE  = [...byDisc.entries()]
        .map(([k,v])=>({
            label:k, count:v.length,
            calories: Math.round(v.reduce((s,r)=>s+(num(r,'Calories Burned')||0),0)),
            minutes:  Math.round(v.reduce((s,r)=>s+(num(r,'Length (minutes)')||0),0))
        }))
        .sort((a,b)=>b.minutes-a.minutes);
    const disciplines = {
        labels:   discE.map(d=>d.label),
        counts:   discE.map(d=>d.count),
        calories: discE.map(d=>d.calories),
        minutes:  discE.map(d=>d.minutes)
    };

    // ── Partial trailing month ─────────────────────────────────
    // An export taken mid-month leaves that month with only a few days in it.
    // Plotted next to full months it reads as a collapse in training rather than
    // a collapse in elapsed days, so any per-month total chart drops it.
    const lastMonthKey  = ym(lastDate);
    const daysInLast    = new Date(lastDate.getFullYear(), lastDate.getMonth()+1, 0).getDate();
    const partialMonth  = lastDate.getDate() < daysInLast ? lastMonthKey : null;
    const partialNote   = partialMonth
        ? new Date(lastDate.getFullYear(), lastDate.getMonth(), 1)
            .toLocaleDateString('en-US',{month:'long',year:'numeric'})
        : null;
    const dropPartial = keys => keys.filter(k => k !== partialMonth);

    // ── Monthly hours by discipline ────────────────────────────
    // Shows the training mix shifting over time: how the week's hours get
    // divided, not just how many sessions were logged.
    const MIX_SHARE_MIN_HOURS = 5;
    const MIX_GROUPS = [
        { label:'Cycling',    match:['Cycling'],              color:'#000000' },
        { label:'Walking',    match:['Walking'],              color:'#c0392b' },
        { label:'Running',    match:['Running'],              color:'#e0573f' },
        { label:'Rowing',     match:['Rowing'],               color:'#f0907c' },
        { label:'Yoga',       match:['Yoga'],                 color:'#8c8c8c' },
        { label:'Stretching', match:['Stretching'],           color:'#b4b4b4' },
        { label:'Meditation', match:['Meditation'],           color:'#d4d4d4' },
        { label:'Other',      match:['Strength','Cardio'],    color:'#ececec' }
    ];
    const mixMap = new Map();
    valid.forEach(r => {
        const g = MIX_GROUPS.find(x => x.match.includes(r['Fitness Discipline']));
        if (!g) return;
        if (!mixMap.has(r._ym)) mixMap.set(r._ym, {});
        const mo = mixMap.get(r._ym);
        mo[g.label] = (mo[g.label] || 0) + (num(r,'Length (minutes)') || 0)/60;
    });
    const mixKeys = dropPartial([...mixMap.keys()].sort());
    const monthlyHours = {
        labels: mixKeys,
        groups: MIX_GROUPS.map(g => ({
            label: g.label, color: g.color,
            data: mixKeys.map(k => +((mixMap.get(k)?.[g.label]) || 0).toFixed(1))
        })).filter(g => g.data.some(v => v > 0)),
        // Cycling's share of hours, for the line drawn over the bars. A share of a
        // near-empty month is noise — one workout reads as 100% — so months below a
        // few hours get no point rather than a spurious extreme.
        cyclingShare: mixKeys.map(k => {
            const mo = mixMap.get(k) || {};
            const tot = Object.values(mo).reduce((a,b)=>a+b,0);
            return tot >= MIX_SHARE_MIN_HOURS ? +(100*(mo['Cycling']||0)/tot).toFixed(1) : null;
        })
    };

    // ── Instructors, top 10 by hours ───────────────────────────
    const instAgg = new Map();
    valid.forEach(r=>{
        const n=r['Instructor Name'];
        if(!n||!n.trim()) return;
        if(!instAgg.has(n)) instAgg.set(n,{classes:0,minutes:0});
        const e=instAgg.get(n);
        e.classes++;
        e.minutes += num(r,'Length (minutes)')||0;
    });
    const instTop = [...instAgg.entries()].sort((a,b)=>b[1].minutes-a[1].minutes).slice(0,10);
    const instructors = {
        labels:  instTop.map(d=>d[0]),
        hours:   instTop.map(d=>+(d[1].minutes/60).toFixed(1)),
        classes: instTop.map(d=>d[1].classes)
    };

    // How the power is produced: leg speed (cadence) vs gear (resistance).
    // Cycling only — Peloton exports neither field for the tread or the rower.
    const effMap  = groupBy(effort, r=>r._ym);
    const effKeys = cycling.trend.labels;
    const cadenceResistance = {
        labels:     effKeys,
        cadence:    effKeys.map(k=>meanStd(effMap.get(k).map(r=>num(r,'Avg. Cadence (RPM)'))).mean),
        resistance: effKeys.map(k=>meanStd(effMap.get(k).map(r=>num(r,'Avg. Resistance'))).mean)
    };

    // Running's closest analogue to cadence-vs-resistance: how fast versus how
    // steep. Incline is exported for runs (and only for runs), so pace changes
    // can be read against the grade they were run at.
    const runSessions = disciplineStats.running.sessions;
    const runMap  = groupBy(runSessions, r=>r._ym);
    const runKeys = disciplineStats.running.trend.labels;
    const speedIncline = {
        labels:  runKeys,
        speed:   runKeys.map(k=>meanStd(runMap.get(k).map(r=>num(r,'Avg. Speed (mph)'))).mean),
        incline: runKeys.map(k=>meanStd(runMap.get(k).map(r=>num(r,'Avg. Incline'))).mean)
    };

    // ═══════════════════════════════════════════════════════════
    //  POWER ZONE EVOLUTION
    //  Peloton's zones are percentages of FTP, so tracking how the zones
    //  themselves have moved needs an FTP history. The six FTP Test Rides in
    //  the export are too sparse (one seven-month gap) and a test only records
    //  how hard you went that day — the first one reads 14% below what the
    //  surrounding riding says was possible. So FTP is estimated from routine
    //  training instead: the mean of the five best effort rides in a trailing
    //  90 days, times a calibration constant.
    //
    //  Why top-five-of-90-days: a hard 30–45 minute ride average IS roughly
    //  threshold power, so this needs no heroic assumption — and using five
    //  rides rather than one keeps a single lucky day from setting the level.
    //  It is also volume-independent, which matters here because cycling volume
    //  halved during 2026; a percentile-based estimator would silently change
    //  meaning as ride counts fell.
    //
    //  FTP_CALIBRATION is fitted to this rider's own six tests (mean ratio of
    //  tested FTP to the estimator, 1.043 — i.e. the estimator sits ~4% below
    //  tested threshold). Recompute it if the method changes.
    const FTP_TREND_DAYS   = 90;
    const FTP_TOP_N        = 5;
    const FTP_MIN_RIDES    = 10;   // below this the window is too thin to trust
    const FTP_CALIBRATION  = 1.043;
    const FTP_TEST_FACTOR  = 0.95; // Peloton: FTP = 95% of the 20-min test average

    // Peloton's seven zones, as fractions of FTP. Zone 7 is open-ended; the top
    // of the band is a drawing cap, not a real ceiling.
    const POWER_ZONES = [
        { name:'Zone 1', desc:'Active Recovery', lo:0,    hi:0.55, color:'#e8e8e8' },
        { name:'Zone 2', desc:'Endurance',       lo:0.55, hi:0.75, color:'#c9c9c9' },
        { name:'Zone 3', desc:'Tempo',           lo:0.75, hi:0.90, color:'#a0a0a0' },
        { name:'Zone 4', desc:'Threshold',       lo:0.90, hi:1.05, color:'#6e6e6e' },
        { name:'Zone 5', desc:'VO2 Max',         lo:1.05, hi:1.20, color:'#e08b7a' },
        { name:'Zone 6', desc:'Anaerobic',       lo:1.20, hi:1.50, color:'#cf5540' },
        { name:'Zone 7', desc:'Neuromuscular',   lo:1.50, hi:1.75, color:'#a5271a' }
    ];

    // The routine-work pool: effort rides with the FTP tests themselves removed,
    // so the estimate never leans on the very thing it is meant to replace.
    const ftpPool = effort
        .filter(r => !/ftp test/i.test(r['Title'] || ''))
        .map(r => ({ t: r.ts.getTime(), w: num(r,'Avg. Watts') }))
        .sort((a,b) => a.t - b.t);

    function ftpEstimateAt(dateMs) {
        const cutoff = dateMs - FTP_TREND_DAYS*24*3600*1000;
        const w = ftpPool.filter(x => x.t <= dateMs && x.t > cutoff).map(x => x.w);
        if (w.length < FTP_MIN_RIDES) return null;
        const top = w.sort((a,b)=>b-a).slice(0, FTP_TOP_N);
        return { ftp: Math.round(top.reduce((a,b)=>a+b,0)/top.length * FTP_CALIBRATION),
                 rides: w.length };
    }

    // Monthly series, evaluated at each month's end.
    // The month list runs CONTINUOUSLY from first to last rather than skipping
    // months with no riding. A filled band chart reads as continuous, so an
    // eight-month training break collapsed into one x-step would draw a cliff
    // that looks like a sudden collapse in a single month. Empty months are
    // carried as nulls instead, which leaves a visible gap in the bands.
    const zoneMonths = [...new Set(effort.map(r=>r._ym))].sort();
    const [fy, fm] = zoneMonths[0].split('-').map(Number);
    const [ly, lm] = zoneMonths[zoneMonths.length-1].split('-').map(Number);
    const allMonths = [];
    for (let y=fy, mo=fm; y<ly || (y===ly && mo<=lm); mo===12 ? (mo=1, y++) : mo++)
        allMonths.push(`${y}-${String(mo).padStart(2,'0')}`);

    const zoneEvolution = { labels:[], ftp:[], rides:[], bands:{}, tests:[] };
    POWER_ZONES.forEach(z => zoneEvolution.bands[z.name] = []);
    allMonths.forEach(m => {
        const [y, mo] = m.split('-').map(Number);
        const e = ftpEstimateAt(new Date(y, mo, 0, 23, 59, 59).getTime());
        zoneEvolution.labels.push(m);
        zoneEvolution.ftp.push(e ? e.ftp : null);
        zoneEvolution.rides.push(e ? e.rides : 0);
        // Each band stores its UPPER edge in watts; the chart fills between them.
        POWER_ZONES.forEach(z =>
            zoneEvolution.bands[z.name].push(e ? Math.round(e.ftp * z.hi) : null));
    });
    // Trim any leading/trailing months that never produced an estimate
    while (zoneEvolution.ftp.length && zoneEvolution.ftp[0] === null) {
        zoneEvolution.labels.shift(); zoneEvolution.ftp.shift(); zoneEvolution.rides.shift();
        POWER_ZONES.forEach(z => zoneEvolution.bands[z.name].shift());
    }
    while (zoneEvolution.ftp.length && zoneEvolution.ftp[zoneEvolution.ftp.length-1] === null) {
        zoneEvolution.labels.pop(); zoneEvolution.ftp.pop(); zoneEvolution.rides.pop();
        POWER_ZONES.forEach(z => zoneEvolution.bands[z.name].pop());
    }
    // ── Collapse long lay-offs into a single labelled slot ─────
    // A run of empty months is not worth one x-slot each: it spends a third of
    // the chart's width on nothing and squashes the training either side of it.
    // But a lay-off is not nothing either — the drop across it is the clearest
    // measure of what detraining costs — so each run collapses to one slot that
    // carries how long it was, what was lost, and how long recovery took.
    const GAP_COLLAPSE_MIN = 2;   // runs shorter than this stay as ordinary months
    (() => {
        const L = zoneEvolution.labels, F = zoneEvolution.ftp, R = zoneEvolution.rides;
        const breaks = [];
        for (let i = 0; i < F.length; i++) {
            if (F[i] !== null) continue;
            let j = i; while (j+1 < F.length && F[j+1] === null) j++;
            const run = j - i + 1;
            if (run >= GAP_COLLAPSE_MIN) breaks.push({ start:i, end:j, run });
            i = j;
        }
        // Splice from the back so earlier indices stay valid
        breaks.reverse().forEach(b => {
            // How long the break really was must come from ride dates, not from
            // the run of empty months: the estimate keeps reporting for a while
            // after the last ride, because the 90-day window still holds rides.
            const runStart = new Date(L[b.start] + '-01').getTime();
            const runEndM  = L[b.end].split('-').map(Number);
            const runEnd   = new Date(runEndM[0], runEndM[1], 0, 23, 59, 59).getTime();
            const lastBefore  = [...ftpPool].reverse().find(x => x.t < runStart);
            const firstAfter  = ftpPool.find(x => x.t > runEnd);
            const months = (lastBefore && firstAfter)
                ? Math.round((firstAfter.t - lastBefore.t) / (30.44*24*3600*1000))
                : b.run + 1;
            // Fitness going in is the estimate for the month of the last ride —
            // not the final non-null month, which is already decaying as the
            // window empties out.
            const ymOf = ms => { const d = new Date(ms);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
            const idxBefore = lastBefore ? L.indexOf(ymOf(lastBefore.t)) : -1;
            const before = idxBefore > -1 ? F[idxBefore] : (F[b.start-1] ?? null);
            const after  = F[b.end+1] ?? null;
            // Months of riding needed to regain the pre-break level
            let recovery = null;
            if (before !== null && after !== null) {
                for (let k = b.end+1; k < F.length; k++)
                    if (F[k] !== null && F[k] >= before) { recovery = k - b.end; break; }
            }
            zoneEvolution.gapInfo = zoneEvolution.gapInfo || [];
            zoneEvolution.gapInfo.push({
                index: b.start, months, before, after,
                lossPct: (before && after) ? Math.round(100*(after/before-1)) : null,
                recovery,
                from: lastBefore ? ymOf(lastBefore.t) : (L[b.start-1] ?? null),
                to:   firstAfter ? ymOf(firstAfter.t) : (L[b.end+1] ?? null)
            });
            // The column itself is captioned, so the tick only needs to signal
            // an elision — the conventional mark for a broken axis.
            const label = '⋯';
            L.splice(b.start, b.run, label);
            F.splice(b.start, b.run, null);
            R.splice(b.start, b.run, 0);
            POWER_ZONES.forEach(z => zoneEvolution.bands[z.name].splice(b.start, b.run, null));
        });
        // Indices were computed back-to-front; restore chronological order
        if (zoneEvolution.gapInfo) zoneEvolution.gapInfo.reverse();
    })();

    // First and last months that actually carry an estimate, for the takeaway
    zoneEvolution.firstIdx = zoneEvolution.ftp.findIndex(v => v !== null);
    zoneEvolution.lastIdx  = zoneEvolution.ftp.length - 1 -
        [...zoneEvolution.ftp].reverse().findIndex(v => v !== null);

    // The actual tests, kept only as reference marks so the estimate can be
    // judged against them rather than trusted blindly.
    valid.filter(r => /20 min ftp test/i.test(r['Title'] || '') && num(r,'Avg. Watts'))
         .sort((a,b)=>a.ts-b.ts)
         .forEach(r => {
             const label = r._ym;
             const i = zoneEvolution.labels.indexOf(label);
             const tested = Math.round(num(r,'Avg. Watts') * FTP_TEST_FACTOR);
             zoneEvolution.tests.push({
                 label, i, tested, date: r.ts.toISOString().slice(0,10),
                 estimate: i > -1 ? zoneEvolution.ftp[i] : null,
                 deltaPct: i > -1 ? +(100*(tested/zoneEvolution.ftp[i]-1)).toFixed(1) : null
             });
         });

    // ── Which zone each ride's AVERAGE fell into, by quarter ───
    // NOT time-in-zone: the export carries one average per ride, so an interval
    // session spent in Zone 6 and Zone 1 reports as a Zone 3 average. Zones 6
    // and 7 therefore essentially cannot appear here — nobody averages above
    // threshold for a whole ride — and are dropped rather than drawn as flat zero.
    const zoneMixQ = new Map();
    effort.filter(r => !/ftp test/i.test(r['Title'] || '')).forEach(r => {
        const e = ftpEstimateAt(r.ts.getTime());
        if (!e) return;
        const frac = num(r,'Avg. Watts') / e.ftp;
        const z = POWER_ZONES.find(z => frac >= z.lo && frac < z.hi)
               || POWER_ZONES[POWER_ZONES.length-1];
        if (!zoneMixQ.has(r._q)) zoneMixQ.set(r._q, {});
        const q = zoneMixQ.get(r._q);
        q[z.name] = (q[z.name] || 0) + 1;
    });
    const zoneMixKeys = [...zoneMixQ.keys()].sort()
        .filter(k => Object.values(zoneMixQ.get(k)).reduce((a,b)=>a+b,0) >= 8);
    const zoneMix = {
        labels: zoneMixKeys,
        counts: zoneMixKeys.map(k => Object.values(zoneMixQ.get(k)).reduce((a,b)=>a+b,0)),
        series: POWER_ZONES.map(z => ({
            name: z.name, desc: z.desc, color: z.color,
            data: zoneMixKeys.map(k => {
                const q = zoneMixQ.get(k), tot = Object.values(q).reduce((a,b)=>a+b,0);
                return tot ? +(100*(q[z.name]||0)/tot).toFixed(1) : 0;
            })
        })).filter(sv => sv.data.some(v => v > 0))
    };

    // Cycling HR zones — cycling only, for the same reason as above.
    const HR_BINS   = [0,120,135,145,155,165,Infinity];
    const HR_LABELS = ['< 120','120–135','135–145','145–155','155–165','165+'];
    const hrZoneCounts = Array(HR_LABELS.length).fill(0);
    effort.forEach(r=>{ const h=num(r,'Avg. Heartrate'); if(h===null) return;
        for(let i=0;i<HR_BINS.length-1;i++) if(h>=HR_BINS[i]&&h<HR_BINS[i+1]){ hrZoneCounts[i]++; break; }
    });
    const hrZones = { labels:HR_LABELS, counts:hrZoneCounts };

    // ── Volume & habit views ───────────────────────────────────
    const hourBins = Array(24).fill(0);
    valid.forEach(r => { const h = r.ts.getHours(); if (h >= 0 && h < 24) hourBins[h]++; });
    // Power by hour, alongside the session count, so the chart answers both
    // "when do I train" and "when am I strong". Bucketed in 3-hour blocks
    // because single hours split the effort rides too thin to average.
    const hourPower = Array.from({length:24}, () => null);
    const blockRides = {};
    effort.forEach(r => { const b = Math.floor(r.ts.getHours()/3)*3;
        (blockRides[b] = blockRides[b] || []).push(num(r,'Avg. Watts')); });
    Object.entries(blockRides).forEach(([b, w]) => {
        if (w.length < 15) return;                 // too few to mean anything
        const mean = +(w.reduce((a,x)=>a+x,0)/w.length).toFixed(1);
        for (let h = +b; h < +b+3; h++) hourPower[h] = mean;
    });
    const timeOfDay = {
        labels: Array.from({length:24}, (_,h) => `${String(h).padStart(2,'0')}:00`),
        counts: hourBins,
        power:  hourPower,
        blockCounts: Array.from({length:24}, (_,h) => (blockRides[Math.floor(h/3)*3] || []).length)
    };

    const uniqueDates = [...new Set(valid.map(r=>r.ts.toDateString()))].map(s=>new Date(s)).sort((a,b)=>a-b);
    let longestStreak=1, curStreak=1;
    for(let i=1;i<uniqueDates.length;i++){
        const diff=(uniqueDates[i]-uniqueDates[i-1])/(1000*60*60*24);
        if(diff===1){ curStreak++; longestStreak=Math.max(longestStreak,curStreak); } else curStreak=1;
    }

    // ── Cross-discipline efficiency index ─────────────────────
    // Every discipline's output-per-heartbeat on one axis, each indexed to 100
    // at its own first qualifying quarter. Indexing is what makes watts and
    // metres comparable at all; the cost is that a later-starting discipline is
    // not being compared over the same stretch of time, so this shows the shape
    // of each curve rather than a fair race between them.
    const EFF_INDEX_MIN = 5;   // sessions per quarter before a point is drawn
    const effIndex = { labels: [], series: [] };
    (() => {
        const perDisc = DISCIPLINE_SPECS.map(spec => {
            const ds = disciplineStats[spec.key];
            if (!ds.hasData) return null;
            const byQ = groupBy(ds.sessions, r => r._q);
            const keys = [...byQ.keys()].sort().filter(k => byQ.get(k).length >= EFF_INDEX_MIN);
            if (keys.length < 2) return null;
            const meanAt = k => {
                const v = byQ.get(k).map(r => spec.perf(r)/num(r,'Avg. Heartrate'));
                return v.reduce((a,b)=>a+b,0)/v.length;
            };
            const base = meanAt(keys[0]);
            return { key:spec.key, label:spec.label,
                     values: Object.fromEntries(keys.map(k => [k, +(100*meanAt(k)/base).toFixed(1)])) };
        }).filter(Boolean);
        if (!perDisc.length) return;
        effIndex.labels = [...new Set(perDisc.flatMap(d => Object.keys(d.values)))].sort();
        effIndex.series = perDisc.map(d => ({
            key:d.key, label:d.label,
            data: effIndex.labels.map(k => d.values[k] ?? null),
            gain: Math.round(Object.values(d.values).slice(-1)[0] - 100)
        }));
    })();

    // ── Performance by class type, per discipline ─────────────
    // Peloton's class types are prescriptive: an Intervals ride and an
    // Endurance ride are different jobs, so a blended average-watts figure
    // partly tracks which classes were chosen rather than fitness alone.
    const byClassType = {};
    DISCIPLINE_SPECS.forEach(spec => {
        const ds = disciplineStats[spec.key];
        if (!ds.hasData) return;
        const m = groupBy(ds.sessions, r => (r['Type'] || 'Just Ride').trim() || 'Just Ride');
        const rowsOut = [...m.entries()]
            .filter(([,v]) => v.length >= TYPE_MIN_SESSIONS)
            .map(([type, v]) => ({
                type, n: v.length,
                mean: +(v.reduce((a,r)=>a+spec.perf(r),0)/v.length).toFixed(2),
                hr:   Math.round(v.reduce((a,r)=>a+num(r,'Avg. Heartrate'),0)/v.length)
            }))
            .sort((a,b) => b.mean - a.mean);
        if (rowsOut.length >= TYPE_MIN_KINDS) byClassType[spec.key] = rowsOut;
    });

    // ── Weekly load and acute:chronic ratio ───────────────────
    // Weekly hours against the trailing four-week average. Above ~1.5 is a
    // sharp ramp; below ~0.8 is a drop-off. A rough guide, not a diagnosis —
    // it counts hours, not intensity.
    const weekMap = new Map();
    valid.forEach(r => {
        const d = new Date(r.ts); d.setHours(0,0,0,0);
        d.setDate(d.getDate() - ((d.getDay()+6) % 7));          // back to Monday
        const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        weekMap.set(k, (weekMap.get(k)||0) + (num(r,'Length (minutes)')||0)/60);
    });
    let weekKeys = [...weekMap.keys()].sort();
    // The final week is usually cut off by the export date; a part-week reads as
    // a collapse in training rather than in elapsed days, exactly as months did.
    if (weekKeys.length) {
        const lastStart = new Date(weekKeys[weekKeys.length-1] + 'T00:00:00');
        if ((lastDate - lastStart) / 86400000 < 6) weekKeys = weekKeys.slice(0, -1);
    }
    // Weeks with no training are absent from the map, which on a categorical axis
    // would place a long lay-off's bookends side by side and hide it entirely. A
    // zero-hour week is a training fact, so the series runs continuously and the
    // gaps are filled with zeros — that is also what makes the ratio meaningful
    // across a break. The run starts at the first year with real volume, so a
    // single trial workout years earlier does not drag 70 empty weeks behind it.
    if (weekKeys.length) {
        const firstRealYear = [...new Set(valid.map(r => r._yr))].sort((a,b)=>a-b)
            .find(y => valid.filter(r => r._yr === y).length >= 20);
        const start = weekKeys.find(k => new Date(k + 'T00:00:00').getFullYear() >= firstRealYear);
        if (start) {
            const filled = [];
            const d = new Date(start + 'T00:00:00');
            const end = new Date(weekKeys[weekKeys.length-1] + 'T00:00:00');
            while (d <= end) {
                const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                filled.push(k);
                if (!weekMap.has(k)) weekMap.set(k, 0);
                d.setDate(d.getDate() + 7);
            }
            weekKeys = filled;
        }
    }
    const weeklyLoad = {
        labels: weekKeys,
        hours:  weekKeys.map(k => +weekMap.get(k).toFixed(1)),
        acwr:   weekKeys.map((k,i) => {
            if (i < ACWR_CHRONIC_WEEKS) return null;
            const prev = weekKeys.slice(i-ACWR_CHRONIC_WEEKS, i).map(x => weekMap.get(x));
            const chronic = prev.reduce((a,b)=>a+b,0)/prev.length;
            // Coming back from a lay-off divides by roughly nothing, which sends
            // the ratio to 10+ and flattens every real fluctuation against it.
            // Returning from zero is a restart, not a ramp, so the ratio simply
            // is not defined until there is a base to compare against.
            return chronic >= ACWR_MIN_CHRONIC_HOURS
                ? +(weekMap.get(k)/chronic).toFixed(2) : null;
        })
    };

    // ── Consistency calendar ──────────────────────────────────
    // Whole-history split of active days, so the note can say how much of the
    // streak is training and how much is recovery practice.
    const dayMinutes = new Map();
    const dayTrained = new Set();
    valid.forEach(r => {
        const k = `${r.ts.getFullYear()}-${String(r.ts.getMonth()+1).padStart(2,'0')}-${String(r.ts.getDate()).padStart(2,'0')}`;
        dayMinutes.set(k, (dayMinutes.get(k)||0) + (num(r,'Length (minutes)')||0));
        if (TRAINING_DISCIPLINES.includes(r['Fitness Discipline'])) dayTrained.add(k);
    });
    const calYears = [...new Set(valid.map(r => r._yr))].sort((a,b)=>a-b)
        // A year with a handful of days is a row of empty squares; skip it.
        .filter(y => valid.filter(r => r._yr === y).length >= 20);
    const calSummary = (() => {
        const all = [...dayMinutes.keys()];
        const trained = all.filter(k => dayTrained.has(k)).length;
        return { active: all.length, trained, recovery: all.length - trained,
                 pctTrained: all.length ? Math.round(100*trained/all.length) : 0 };
    })();
    const calendar = calYears.map(y => {
        const days = [];
        for (let d = new Date(y,0,1); d.getFullYear() === y; d.setDate(d.getDate()+1)) {
            const k = `${y}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            days.push({ date:k, dow:(d.getDay()+6)%7, month:d.getMonth(),
                        mins: Math.round(dayMinutes.get(k) || 0),
                        trained: dayTrained.has(k),
                        future: d > lastDate });
        }
        const active   = days.filter(d => d.mins > 0).length;
        const trained  = days.filter(d => d.trained).length;
        const recovery = active - trained;
        const elapsed  = days.filter(d => new Date(d.date) <= lastDate).length;
        return { year:y, days, active, trained, recovery, elapsed,
                 pct: elapsed ? Math.round(100*active/elapsed) : 0 };
    });

    console.log(`✅ ${valid.length} workouts · ${effort.length} effort rides · ` +
                `power ${progression.powerEarly}→${progression.powerNow}W · ` +
                `HR ${progression.hrEarly}→${progression.hrNow}bpm · ` +
                `eff ${progression.effEarly}→${progression.effNow} W/bpm · streak ${longestStreak}d`);

    return { stats, longestStreak, disciplines, instructors,
             disciplineStats, cadenceResistance, speedIncline, hrZones, timeOfDay,
             monthlyHours, partialNote, zoneEvolution, zoneMix, POWER_ZONES,
             effIndex, byClassType, weeklyLoad, calendar, calSummary };
}


// ─────────────────────────────────────────────────────────────
//  GENERIC DISCIPLINE SECTION
//  Cycling keeps its own bespoke charts below (they carry extras no other
//  discipline has data for). Walking, running and rowing share this renderer,
//  which emits only the charts their data can actually support.
// ─────────────────────────────────────────────────────────────
function disciplineSectionHTML(ds, notes) {
    const k = ds.spec.key, S = ds.spec, sum = ds.summary;
    if (!ds.hasData) {
        return `
        <div class="panel-meta">No sessions yet carry both a
           ${S.perfName.toLowerCase()} figure and a heart rate.</div>`;
    }

    const hrWord = sum.hrDelta === 0 ? 'at an unchanged average heart rate'
                 : sum.hrDelta  <  0 ? `while average heart rate <em>fell</em> ${Math.abs(sum.hrDelta)} bpm`
                 : `while average heart rate rose ${sum.hrDelta} bpm`;

    let html = `
        <div class="panel-meta">${ds.sessions.length} effort sessions of ${S.minMinutes}+ minutes
           (${ds.totalSessions} logged in total, warm-ups and cool-downs excluded)
           &nbsp;|&nbsp; ${Math.round(ds.totalMinutes/60)} hours all-in</div>`;

    // Thin-data disciplines get a plain statement instead of trend lines drawn
    // through too few points to mean anything.
    if (!ds.hasTrend) {
        html += `
        <div class="insight-box">
            <strong>Not enough history yet for trend lines.</strong>
            ${S.label} has ${ds.sessions.length} qualifying sessions across ${ds.months}
            month${ds.months===1?'':'s'} with enough volume to average — below the
            ${MIN_TREND_SESSIONS}-session, ${MIN_TREND_MONTHS}-month bar the other sections clear.
            The scatter below shows every session honestly; the month-by-month charts
            will appear on their own once the history is there.
        </div>`;
    }

    if (ds.hasTrend) {
        html += `
        <div class="chart-container feature">
            <h2>${S.perfName} &amp; Heart Rate Over Time (${S.label})</h2>
            <div class="description">Left axis: time-weighted avg. ${S.perfName.toLowerCase()} &nbsp;|&nbsp; Right axis: avg. heart rate for this discipline only &nbsp;|&nbsp; Error bars: ±1 SD</div>
            <canvas id="${k}TrendChart"></canvas>
            <div class="takeaway" id="${k}Takeaway"></div>
            ${notes.trend ? `<div class="method-note">${notes.trend}</div>` : ''}
        </div>

        <div class="chart-container feature">
            <h2>Aerobic Efficiency — ${S.effName} (${S.label})</h2>
            <div class="description">${S.perfName} ÷ heart rate, computed per session then averaged. Rising = more ${S.perfName.toLowerCase()} for the same cardiovascular cost</div>
            <canvas id="${k}EffChart"></canvas>
            <div class="method-note">
                ${S.label} covered ${sum.perfPct >= 0 ? 'a' : 'a'} ${Math.abs(sum.perfPct)}%
                ${sum.perfPct >= 0 ? 'gain' : 'drop'} in ${S.perfName.toLowerCase()}
                (${S.fmt(sum.perfEarly)} → ${S.fmt(sum.perfNow)}) ${hrWord}
                (${sum.hrEarly} → ${sum.hrNow} bpm), for an efficiency change of
                <b>${sum.effPct >= 0 ? '+' : ''}${sum.effPct}%</b>.
                Comparison is the first ${sum.windowSize} qualifying sessions against the most recent ${sum.windowSize}.
            </div>
        </div>`;
    }

    if (ds.byLength && ds.byLength.usable) {
        html += `
        <div class="chart-container">
            <h2>${S.perfName} Progression at Constant Session Length (${S.label})</h2>
            <div class="description">Average ${S.perfName.toLowerCase()} by half-year, split by session duration — points shown only where a period has ${MIN_PER_LENGTH}+ sessions of that length</div>
            <canvas id="${k}LengthChart"></canvas>
            ${notes.length ? `<div class="method-note">${notes.length}</div>` : ''}
        </div>`;
    }

    html += `
        <div class="chart-container">
            <h2>Every Session in Heart Rate × ${S.perfName} Space (${S.label})</h2>
            <div class="description">One dot per effort session, coloured by year — up and to the left is fitter</div>
            <canvas id="${k}ScatterChart"></canvas>
            ${notes.scatter ? `<div class="method-note">${notes.scatter}</div>` : ''}
        </div>`;

    if (notes.byType) {
        html += `
        <div class="chart-container">
            <h2>${S.perfName} by Class Type (${S.label})</h2>
            <div class="description">Average ${S.perfName.toLowerCase()} per Peloton class type, with average heart rate alongside — types with ${TYPE_MIN_SESSIONS}+ sessions</div>
            <canvas id="${k}TypeChart"></canvas>
            <div class="method-note">${notes.byType}</div>
        </div>`;
    }

    // One or two repeated classes is a data point, not a chart.
    if (ds.classProgress.length >= 3) {
        html += `
        <div class="chart-container">
            <h2>Same Class, Stronger Athlete (${S.label})</h2>
            <div class="description">Classes done 6+ times — average of the first 3 attempts vs. the most recent 3</div>
            <canvas id="${k}ClassChart"></canvas>
            ${notes.klass ? `<div class="method-note">${notes.klass}</div>` : ''}
        </div>`;
    } else if (ds.classProgress.length) {
        const c = ds.classProgress[0];
        html += `
        <div class="chart-container">
            <h2>Same Class, Stronger Athlete (${S.label})</h2>
            <div class="description">Needs several classes repeated 6+ times to make a chart — so far only ${ds.classProgress.length} qualifies</div>
            <div class="method-note">
                <b>${c.title}</b>, done ${c.rides} times: first three averaged ${S.fmt(c.early)},
                most recent three ${S.fmt(c.recent)} — a change of
                ${c.pct >= 0 ? '+' : ''}${c.pct}%. Best single effort: ${S.fmt(c.best)}.
            </div>
        </div>`;
    }
    return html;
}

// Bars are the performance metric, the line is heart rate on a second axis —
// so a type that is merely harder is distinguishable from one that is faster
// for the same effort.
function drawClassTypeChart(canvasId, rows, S) {
    const el = document.getElementById(canvasId);
    if (!el) return;
    new Chart(el, {
        data:{
            labels: rows.map(r => r.type),
            datasets:[
                { type:'bar', label:S.perfName, data: rows.map(r => S.toDisplay(r.mean)),
                  backgroundColor: grays, borderWidth:0, yAxisID:'y', order:2 },
                { type:'line', label:'Avg. heart rate', data: rows.map(r => r.hr),
                  borderColor:C.red, backgroundColor:C.red, borderWidth:2, tension:0,
                  pointRadius:4, pointBackgroundColor:C.red, pointBorderColor:'#fff',
                  pointBorderWidth:1.5, fill:false, yAxisID:'y1', order:1 }
            ]
        },
        options:{
            responsive:true, interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{ position:'top', labels:{color:C.mid,font:{size:11},usePointStyle:true} },
                tooltip:{ callbacks:{
                    title: items => `${items[0].label} · ${rows[items[0].dataIndex].n} sessions`,
                    label: ctx => ctx.datasetIndex === 0
                        ? `${S.perfName}: ${S.fmt(rows[ctx.dataIndex].mean)}`
                        : `Heart rate: ${ctx.parsed.y} bpm`
                }}
            },
            scales:{
                x:{ ticks:{color:C.mid,maxRotation:35,minRotation:35,font:{size:10}}, grid:{display:false} },
                y:{ position:'left', beginAtZero:false,
                    title:{display:true,text:S.perfAxis,color:C.black},
                    ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                y1:{ position:'right', title:{display:true,text:'Heart rate (bpm)',color:C.red},
                     ticks:{color:C.red,callback:v=>v+' bpm'}, grid:{drawOnChartArea:false} }
            }
        }
    });
}

function drawDisciplineCharts(ds) {
    if (!ds.hasData) return;
    const k = ds.spec.key, S = ds.spec, D = S.toDisplay;

    // ── Performance + heart rate, dual axis with ±1 SD bars ────
    if (ds.hasTrend) {
        const t = ds.trend, disp = t.perf.map(v => v===null?null:D(v));
        const dispStd = t.perf.map((v,i) => v===null?0:D(v+t.perfStd[i])-D(v));
        const hrLo = Math.max(60, Math.floor((Math.min(...t.hr.filter(v=>v!==null))-25)/10)*10);
        const hrHi = Math.ceil((Math.max(...t.hr.filter(v=>v!==null))+25)/10)*10;
        new Chart(document.getElementById(`${k}TrendChart`),{
            type:'line',
            data:{ labels:t.labels, datasets:[
                { label:`${S.perfName} (${S.perfAxis.replace(/.*\(|\)/g,'')})`, data:disp, yAxisID:'y',
                  borderColor:C.black, backgroundColor:'rgba(0,0,0,0.05)',
                  fill:true, tension:0.4, borderWidth:2,
                  pointRadius:4, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:2 },
                { label:'Heart Rate (bpm)', data:t.hr, yAxisID:'y1',
                  borderColor:C.red, backgroundColor:'rgba(192,57,43,0.05)',
                  fill:false, tension:0.4, borderWidth:2,
                  pointRadius:4, pointBackgroundColor:C.red, pointBorderColor:'#fff', pointBorderWidth:2 }
            ]},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11}} },
                    tooltip:{ callbacks:{
                        title: items => `${items[0].label} · ${t.count[items[0].dataIndex]} sessions`,
                        label: ctx => {
                            const i=ctx.dataIndex, v=ctx.parsed.y;
                            if (v===null) return null;
                            return ctx.datasetIndex===0
                                ? `${S.perfName}: ${S.fmt(t.perf[i])}`
                                : `Heart rate: ${v.toFixed(1)} bpm ±${t.hrStd[i].toFixed(1)}`;
                        }
                    }}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ type:'linear', position:'left',
                        title:{display:true,text:S.perfAxis,color:C.black},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y1:{ type:'linear', position:'right', min:hrLo, max:hrHi,
                         title:{display:true,text:'Heart Rate (bpm)',color:C.red},
                         ticks:{color:C.red,callback:v=>v+' bpm'}, grid:{drawOnChartArea:false} }
                }
            },
            plugins:[{ afterDatasetsDraw(chart){
                const ctx=chart.ctx;
                const bars=(mi,means,stds,scaleId,color)=>{
                    const meta=chart.getDatasetMeta(mi), ys=chart.scales[scaleId];
                    meta.data.forEach((pt,i)=>{
                        if(means[i]===null) return;
                        const x=pt.x, yT=ys.getPixelForValue(means[i]+stds[i]), yB=ys.getPixelForValue(means[i]-stds[i]);
                        ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.2;
                        [[x,yT,x,yB],[x-3,yT,x+3,yT],[x-3,yB,x+3,yB]].forEach(([x1,y1,x2,y2])=>{
                            ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
                        });
                        ctx.restore();
                    });
                };
                bars(0,disp,dispStd,'y','rgba(0,0,0,0.25)');
                bars(1,ds.trend.hr,ds.trend.hrStd,'y1','rgba(192,57,43,0.3)');
            }}]
        });

        // ── Takeaway strip ─────────────────────────────────────
        const el = document.getElementById(`${k}Takeaway`);
        const sum = ds.summary;
        el.innerHTML = `
            <div><div class="k">${S.perfName} then → now</div><div class="v ${sum.perfPct>=0?'up':''}">${S.fmt(sum.perfEarly)} → ${S.fmt(sum.perfNow)}</div></div>
            <div><div class="k">Heart rate then → now</div><div class="v">${sum.hrEarly} → ${sum.hrNow} bpm</div></div>
            <div><div class="k">${S.effName}</div><div class="v ${sum.effPct>=0?'up':''}">${sum.effEarly} → ${sum.effNow}</div></div>
            <div><div class="k">Efficiency change</div><div class="v ${sum.effPct>=0?'up':''}">${sum.effPct>=0?'+':''}${sum.effPct}%</div></div>`;

        // ── Efficiency with least-squares trend ────────────────
        new Chart(document.getElementById(`${k}EffChart`),{
            type:'line',
            data:{ labels:ds.efficiency.labels, datasets:[
                { label:S.effName, data:ds.efficiency.value,
                  borderColor:C.black, backgroundColor:'rgba(0,0,0,0.06)',
                  fill:true, tension:0.35, borderWidth:2,
                  pointRadius:3.5, pointBackgroundColor:C.black, pointBorderColor:'#fff', pointBorderWidth:1.5 },
                { label:'Trend', data:ds.efficiency.trend,
                  borderColor:C.red, borderWidth:1.8, borderDash:[6,4],
                  fill:false, pointRadius:0, tension:0 }
            ]},
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11}} },
                    tooltip:{ callbacks:{
                        title: items => `${items[0].label} · ${ds.efficiency.count[items[0].dataIndex]} sessions`,
                        label: ctx => ctx.parsed.y===null ? null
                            : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)} ${S.effUnit}`
                    }}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ title:{display:true,text:S.effName,color:C.black},
                        ticks:{color:C.mid,callback:v=>v.toFixed(2)}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            }
        });
    }

    // ── Performance at constant session length ─────────────────
    if (ds.byLength && ds.byLength.usable) {
        const lenColors = ['#c0392b','#000000','#666666','#aaaaaa'];
        const datasets = ds.byLength.buckets
            .map((b,i) => ({
                label: b.label,
                data:  ds.byLength.series[b.key].map(v => v===null?null:D(v)),
                raw:   ds.byLength.series[b.key],
                borderColor: lenColors[i % lenColors.length],
                backgroundColor: lenColors[i % lenColors.length],
                borderWidth:2, tension:0.3, spanGaps:true,
                pointRadius:3.5, pointBorderColor:'#fff', pointBorderWidth:1.5
            }))
            .filter(d => d.data.some(v => v !== null));
        new Chart(document.getElementById(`${k}LengthChart`),{
            type:'line',
            data:{ labels:ds.byLength.labels, datasets },
            options:{
                responsive:true, interaction:{mode:'index',intersect:false},
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11},padding:14} },
                    tooltip:{ callbacks:{ label: ctx => {
                        if (ctx.parsed.y === null) return null;
                        const b = ds.byLength.buckets.find(x=>x.label===ctx.dataset.label);
                        return `${ctx.dataset.label}: ${S.fmt(ctx.dataset.raw[ctx.dataIndex])} (${ds.byLength.counts[b.key][ctx.dataIndex]} sessions)`;
                    }}}
                },
                scales:{
                    x:{ ticks:{color:C.mid,maxRotation:45,minRotation:45}, grid:{display:false} },
                    y:{ title:{display:true,text:S.perfAxis,color:C.black},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            }
        });
    }

    // ── Heart rate × performance scatter, with per-year centroids ──
    (()=>{
        const yrs = ds.scatter.years;
        const colorFor = i => i === yrs.length-1 ? C.red
            : grays[Math.min(grays.length-1, (yrs.length-1-i)*2 + 2)];
        const datasets = yrs.map((y,i)=>({
            label: String(y),
            data: ds.scatter.points[y].map(p=>({x:p.x, y:D(p.y), raw:p.y})),
            backgroundColor: colorFor(i) + (i === yrs.length-1 ? 'cc' : '66'),
            borderColor:'transparent', pointRadius:3, pointHoverRadius:5, order:2
        }));
        yrs.forEach((y,i)=>{
            const pts = ds.scatter.points[y];
            if (!pts.length) return;
            datasets.push({
                label:`${y} avg`,
                data:[{ x: pts.reduce((s,p)=>s+p.x,0)/pts.length,
                        y: D(pts.reduce((s,p)=>s+p.y,0)/pts.length) }],
                backgroundColor: colorFor(i), borderColor:'#fff', borderWidth:2.5,
                pointRadius:9, pointHoverRadius:11, order:1
            });
        });
        new Chart(document.getElementById(`${k}ScatterChart`),{
            type:'scatter',
            data:{ datasets },
            options:{
                responsive:true,
                plugins:{
                    legend:{ position:'top', labels:{color:C.mid,font:{size:11},padding:12,
                             usePointStyle:true, filter:item=>!item.text.includes('avg')} },
                    tooltip:{ callbacks:{ label: ctx =>
                        `${ctx.dataset.label}: ${S.fmt(ctx.raw.raw ?? ctx.parsed.y)} @ ${ctx.parsed.x.toFixed(0)} bpm` }}
                },
                scales:{
                    x:{ title:{display:true,text:'Average heart rate (bpm)',color:C.black},
                        ticks:{color:C.mid,callback:v=>v+' bpm'}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y:{ title:{display:true,text:S.perfAxis,color:C.black},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} }
                }
            }
        });
    })();

    // ── Performance by class type ──────────────────────────────
    if (window.__byClassType && window.__byClassType[k]) {
        drawClassTypeChart(`${k}TypeChart`, window.__byClassType[k], S);
    }

    // ── Same class, repeated ───────────────────────────────────
    if (ds.classProgress.length >= 3) {
        const rows = ds.classProgress;
        const clsB  = niceBounds(rows.flatMap(c => [D(c.early), D(c.recent)]), 0.25);
        const clsLo = clsB.lo, clsHi = clsB.hi;
        new Chart(document.getElementById(`${k}ClassChart`),{
            type:'bar',
            data:{
                labels: rows.map(c => c.title),
                datasets:[{ label:'First 3 → most recent 3',
                    data: rows.map(c => [D(c.early), D(c.recent)]),
                    backgroundColor:C.red, borderWidth:0, borderSkipped:false, barPercentage:0.55 }]
            },
            options:{
                indexAxis:'y', responsive:true,
                plugins:{
                    legend:{display:false},
                    tooltip:{ callbacks:{ label: ctx => {
                        const c = rows[ctx.dataIndex];
                        return [`First 3: ${S.fmt(c.early)}`, `Recent 3: ${S.fmt(c.recent)}`,
                                `Change: ${c.pct>=0?'+':''}${c.pct}%`,
                                `Best: ${S.fmt(c.best)} · ${c.rides} sessions`];
                    }}}
                },
                scales:{
                    // A dumbbell chart encodes the CHANGE in each bar's length, so an
                    // axis anchored at zero squashes every bar against the right edge
                    // and hides the very thing the chart exists to show. Bound it to
                    // the data with a margin instead.
                    x:{ min:clsLo, max:clsHi,
                        title:{display:true,text:S.perfAxis,color:C.mid,font:{size:11}},
                        ticks:{color:C.mid}, grid:{color:'rgba(0,0,0,0.04)'} },
                    y:{ ticks:{color:C.mid,font:{size:10}}, grid:{display:false} }
                }
            },
            plugins:[{ afterDatasetsDraw(chart){
                const ctx=chart.ctx, meta=chart.getDatasetMeta(0), xs=chart.scales.x;
                meta.data.forEach((bar,i)=>{
                    const x = xs.getPixelForValue(D(rows[i].early));
                    ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle=C.red; ctx.lineWidth=2;
                    ctx.beginPath(); ctx.arc(x, bar.y, 4.5, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke(); ctx.restore();
                });
            }}]
        });
    }
}

// ─────────────────────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────────────────────
function renderDashboard(data, lastModified) {
