<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<title>Listening History</title>
<script src="/assets/js/chart-4.4.0.umd.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#fff; --bg-alt:#f5f5f5; --bg-soft:#f9f9f9; --bg-soft2:#f7f7f7; --bg-soft3:#fafafa;
  --fg:#000; --muted:#666; --faint:#999; --faint2:#888; --faint3:#bbb;
  --border-strong:#000; --border:#ccc; --border-soft:#ddd; --border-softer:#eee; --border-softer2:#f0f0f0;
  --accent:#c0392b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0d0d; --bg-alt:#1a1a1a; --bg-soft:#161616; --bg-soft2:#1c1c1c; --bg-soft3:#181818;
    --fg:#f0f0f0; --muted:#aaa; --faint:#888; --faint2:#999; --faint3:#666;
    --border-strong:#f0f0f0; --border:#444; --border-soft:#333; --border-softer:#2a2a2a; --border-softer2:#242424;
    --accent:#e0574a;
  }
}
:root[data-theme="dark"] {
  --bg:#0d0d0d; --bg-alt:#1a1a1a; --bg-soft:#161616; --bg-soft2:#1c1c1c; --bg-soft3:#181818;
  --fg:#f0f0f0; --muted:#aaa; --faint:#888; --faint2:#999; --faint3:#666;
  --border-strong:#f0f0f0; --border:#444; --border-soft:#333; --border-softer:#2a2a2a; --border-softer2:#242424;
  --accent:#e0574a;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--bg);
    color:var(--fg);
    padding:48px 24px;
    line-height:1.6;
}
.container { max-width:1200px; margin:0 auto; }
/* Inline links take their surrounding text colour rather than browser blue. */
a { color:inherit; text-underline-offset:2px; }

/* ── Theme toggle ── */
.theme-toggle {
  position:fixed; top:20px; right:20px; z-index:100;
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--bg); color:var(--fg);
  font-size:16px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.theme-toggle:hover { background:var(--bg-alt); }

/* ── Header ── */
.header { border-bottom:2px solid var(--border-strong); padding-bottom:28px; margin-bottom:44px; }
.header h1 { font-size:2.4em; font-weight:700; letter-spacing:-.5px; margin-bottom:6px; }
.header-meta { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
.header .subtitle { font-size:.95em; color:var(--muted); }
.last-updated { font-size:.78em; color:var(--faint); font-style:italic; }
.nav-link { font-size:.78em; color:var(--faint); }
.nav-link a { color:var(--faint); text-decoration:none; }
.nav-link a:hover { color:var(--fg); text-decoration:underline; }
.nav-link .current { color:var(--muted); font-weight:600; }

/* ── Stat cards ── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:48px; }
.stat-card { border:2px solid var(--border-strong); padding:22px 14px; text-align:center; transition:background .15s; }
.stat-card:hover { background:var(--bg-alt); }
.stat-card .value { font-size:2em; font-weight:700; margin-bottom:5px; font-variant-numeric:tabular-nums; line-height:1.1; }
.stat-card .label { font-size:.75em; text-transform:uppercase; letter-spacing:1.1px; color:var(--muted); }
.stat-card .sub { font-size:.68em; color:var(--faint); margin-top:3px; }
.stat-card.accent { border-color:var(--accent); }
.stat-card.accent .value { color:var(--accent); }

/* ── Section dividers ── */
.section-head { margin:56px 0 24px; padding-bottom:10px; border-bottom:2px solid var(--border-strong); }
.section-head:first-of-type { margin-top:0; }
.section-head h2 { font-size:1.35em; font-weight:700; letter-spacing:-.3px; }
.section-head p { font-size:.85em; color:var(--muted); margin-top:3px; }

/* ── Chart containers ── */
.chart-container { border:1px solid var(--border); padding:24px; margin-bottom:28px; background:var(--bg); }
.chart-container h2 { font-size:1.15em; font-weight:600; margin-bottom:5px; letter-spacing:-.2px; }
.chart-container .description { color:var(--muted); font-size:.82em; margin-bottom:16px; }
.chart-container.feature { border:2px solid var(--border-strong); }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; }
/* Grid children default to min-width:auto, which sizes them to their content and
   stops a wide child (the hour heatmap) from ever scrolling inside its own box —
   the column silently widens instead and the whole page scrolls sideways. */
.two-col > *, .three-col > * { min-width:0; }

canvas { max-height:400px; max-width:100%; }
.tall canvas { max-height:520px; }

/* ── Insight box ── */
.insight-box {
    border-left:3px solid var(--border-strong);
    padding:16px 20px;
    margin:0 0 40px;
    background:var(--bg-soft);
    font-size:.9em;
    line-height:1.75;
}
.insight-box strong { font-weight:700; }

/* ── Method note ── */
.method-note {
    margin-top:14px; padding:10px 14px;
    background:var(--bg-soft2); border-left:2px solid var(--faint);
    font-size:.76em; color:var(--muted); line-height:1.6;
}
.method-note b { color:var(--fg); }

/* ── Takeaway strip ── */
.takeaway { display:flex; flex-wrap:wrap; gap:0; margin-top:18px; border-top:1px solid var(--border-soft); padding-top:14px; }
.takeaway div { flex:1 1 130px; padding:0 14px; border-left:1px solid var(--border-softer); }
.takeaway div:first-child { border-left:0; padding-left:0; }
.takeaway .k { font-size:.68em; text-transform:uppercase; letter-spacing:1px; color:var(--faint2); }
.takeaway .v { font-size:1.25em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3; }
.takeaway .v.up { color:var(--accent); }

/* ── Clock / hour-by-year heatmap ── */
.hm { overflow-x:auto; max-width:100%; padding-bottom:6px; }
/* Fixed layout + full width lets the 24 hour columns share the container
   evenly instead of leaving dead space at wide sizes; the min-width keeps
   them legible on a phone, where the box scrolls instead. */
.hm table { border-collapse:collapse; font-size:.72em; width:100%; table-layout:fixed; min-width:560px; }
.hm th.rowhead { width:46px; }
.hm td, .hm th { padding:0; }
.hm th { font-weight:600; color:var(--faint2); font-size:.92em; padding:0 5px 5px; white-space:nowrap; }
.hm th.rowhead { text-align:right; padding-right:8px; font-variant-numeric:tabular-nums; }
.hm .c { width:auto; height:22px; border-radius:2px; }
.hm .c[data-v] { outline:0; }

/* ── Consistency calendar ── */
.cal-year { margin-bottom:18px; }
.cal-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.cal-head .y { font-weight:700; font-size:.95em; }
.cal-head .s { font-size:.78em; color:var(--muted); }
.cal-grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:2px; overflow-x:auto; padding-bottom:4px; }
.cal-cell { width:11px; height:11px; border-radius:2px; background:var(--border-softer2); }
.cal-legend { display:flex; align-items:center; gap:4px; flex-wrap:wrap; font-size:.72em; color:var(--faint2); margin-top:10px; }
.cal-legend .gap { margin-left:14px; }
.cal-legend i { width:11px; height:11px; border-radius:2px; display:inline-block; }
@media(max-width:600px){ .cal-cell, .cal-legend i { width:8px; height:8px; } }
@media(max-width:600px){ .hm .c { height:16px; } .hm table { font-size:.66em; min-width:520px; } }

/* ── Ranked lists ── */
.rank { width:100%; border-collapse:collapse; font-size:.85em; }
.rank th {
    text-align:left; font-size:.68em; text-transform:uppercase; letter-spacing:1px;
    color:var(--faint2); font-weight:600; padding:0 8px 8px 0; border-bottom:1px solid var(--border-soft);
}
.rank td { padding:7px 8px 7px 0; border-bottom:1px solid var(--border-softer2); vertical-align:middle; }
.rank td.n { color:var(--faint3); font-variant-numeric:tabular-nums; width:26px; font-size:.9em; }
.rank td.v { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
.rank td.meta { text-align:right; color:var(--faint); font-size:.85em; white-space:nowrap; font-variant-numeric:tabular-nums; }
.rank .bar { display:block; height:3px; background:var(--fg); margin-top:4px; }
.rank .sub { color:var(--faint); font-size:.85em; }
.rank tr:hover td { background:var(--bg-soft3); }

/* ── Era ribbon ── */
.ribbon { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--border-soft); border-left:0; margin-top:4px; }
.ribbon div { flex:1 1 92px; border-left:1px solid var(--border-soft); padding:11px 12px; }
.ribbon .y { font-size:.72em; letter-spacing:1px; color:var(--faint2); text-transform:uppercase; }
.ribbon .a { font-size:.88em; font-weight:700; line-height:1.35; margin-top:2px; }
.ribbon .p { font-size:.74em; color:var(--faint); font-variant-numeric:tabular-nums; }

/* ── State screens ── */
.state-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; gap:18px; }
.state-screen .icon { font-size:3em; }
.state-screen h2 { font-size:1.4em; font-weight:600; }
.state-screen p { color:var(--muted); font-size:.95em; max-width:480px; line-height:1.6; }
.state-screen code {
    background:var(--bg-soft); border:1px solid var(--border-soft);
    padding:12px 20px; font-family:monospace; font-size:.9em; color:var(--fg);
    display:block; margin-top:4px;
}
.error-detail { color:var(--accent); font-size:.85em; font-family:monospace; }
.spinner { width:40px; height:40px; border:3px solid var(--border-softer); border-top-color:var(--fg); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Footer ── */
.footer { text-align:center; margin-top:48px; padding-top:24px; border-top:1px solid var(--border); color:var(--faint); font-size:.82em; }
.footer a { color:var(--muted); }
.footer .social-row {
    display:flex; justify-content:center; flex-wrap:wrap;
    gap:8px 20px; margin-bottom:12px; font-size:1.05em;
}

/* ── Tablet ── */
@media(max-width:900px){
    .stats-grid { grid-template-columns:repeat(3,1fr); }
    .three-col { grid-template-columns:1fr 1fr; }
}

/* ── Mobile ── */
@media(max-width:600px){
    body { padding:24px 14px; }
    .header h1 { font-size:1.6em; }
    .header-meta { flex-direction:column; gap:4px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:32px; }
    .stat-card { padding:16px 10px; }
    .stat-card .value { font-size:1.5em; }
    .stat-card .label { font-size:.68em; }
    .two-col { grid-template-columns:1fr; gap:0; }
    .two-col .chart-container { margin-bottom:28px; }
    .three-col { grid-template-columns:1fr; }
    .chart-container { padding:18px 14px; }
    canvas { max-height:300px; }
    .tall canvas { max-height:380px; }
    .takeaway div { flex:1 1 50%; border-left:0; padding:6px 0; }
    .section-head h2 { font-size:1.15em; }
    .ribbon div { flex:1 1 50%; }
    .theme-toggle { top:12px; right:12px; width:32px; height:32px; }
}
</style>

<body>
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
<script>
(function () {
  // Deliberately independent of the Chart.js-dependent script below: the
  // toggle itself must keep working even if Chart.js fails to load.
  var btn = document.getElementById('theme-toggle');
  function render() {
    btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  btn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    render();
    document.dispatchEvent(new CustomEvent('themechange'));
  });
  render();
})();
</script>
<div class="container" id="app"></div>

<script>
{% raw %}
/* ─────────────────────────────────────────────────────────────────────────
   LIQUID GUARD — do not remove the Liquid raw/endraw tags wrapping this
   script. (They are deliberately not spelled out inside this comment: a
   literal endraw tag here would close the guard early, orphan the real one
   at the bottom, and fail the Jekyll build with "Unknown tag 'endraw'".)

   This page carries Jekyll front matter (see the top of the file), so Jekyll
   runs Liquid over it before serving. Liquid evaluates {{ ... }} as an
   expression, and this file is a thousand lines of chart configuration full
   of nested object literals — so an ordinary edit like `scales:{{x:1}}` puts
   two braces side by side and Liquid silently DELETES that span. There is no
   build error: the page deploys, the JavaScript is corrupt, and the
   dashboard renders blank. Everything between the raw tags is passed through
   untouched, which makes that failure impossible rather than merely unlikely.

   The trade-off: no Liquid works in here either. If you ever need a Jekyll
   value in this script, put it in a data attribute on an element outside
   this block and read it from the DOM.
   ───────────────────────────────────────────────────────────────────────── */
// ─────────────────────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────────────────────
// Absolute path: the page is served from /music/ (see the permalink in this
// file's front matter), so a relative name would resolve to /music/<file>.
const CSV_FILENAME = '/kambizkamrani_lastfm.csv';
// Optional. Generated by tools/fetch_lastfm_tags.py; absent until that has been
// run, in which case genre falls back to the curated list alone and the page
// says so rather than pretending to fuller coverage than it has.
const TAGS_FILENAME = '/lastfm_artist_tags.json';
const CACHE_KEY    = 'lastfm_cache_v2'; // v2: genre

// The account opens in Feb 2011 but then goes dark for years at a stretch —
// the longest silence runs 589 days, ending 8 Apr 2019. Everything before
// that is 578 scrobbles of fragments; everything after is a continuous daily
// record. Rate statistics ("per day", "% of days active") are quoted from the
// continuous era only, because averaging across a five-year silence describes
// a listener who does not exist. The long view charts still show all of it.
const ERA_START      = new Date(2019, 3, 8);
const ERA_START_TEXT = 'April 2019';

// A scrobble lands when a track finishes, so consecutive plays sit roughly one
// track-length apart. A half-hour of silence is a new sitting, not a pause.
const SESSION_GAP_MIN = 30;

// Median inter-scrobble gap in this file is 3 minutes; the mean track is a
// little longer than the median because the gap distribution has a tail.
// Used only for the "days of music" headline, which is explicitly an estimate.
const EST_TRACK_MIN = 3.5;

// Thresholds. Below these a chart is reporting noise, so it is suppressed
// rather than drawn — the same rule the exercise dashboard follows.
const MIN_ARTIST_PLAYS  = 150;  // artist-era ribbon and comet chart
const MIN_YEAR_SCROBBLES = 500; // a year thin enough to mislead is left out
const BINGE_MIN_PLAYS   = 60;   // a day has to be substantial to count
const BINGE_MIN_SHARE   = 0.5;  // ...and one artist has to own half of it

const TOP_N_ARTISTS = 25;
// A genre needs this many plays before its hour-of-day profile is a shape
// rather than a handful of evenings. The work window is only ~3.5% of the
// library, so a genre below this contributes a few dozen plays to it and its
// lift swings wildly on noise.
const GENRE_WINDOW_MIN = 900;
// The two windows compared. 08:00–11:59 is the trough the clock chart is built
// around; 18:00–23:59 is the evening peak on the far side of it.
const WORK_WINDOW = [8, 12];
const EVE_WINDOW  = [18, 24];
const ERA_ARTISTS   = 8;   // lines on the taste-migration chart

// ─────────────────────────────────────────────────────────────
//  PALETTE
// ─────────────────────────────────────────────────────────────
const PALETTE = {
    light: { black:'#000', dark:'#333', mid:'#666', light:'#999', vlight:'#ccc', red:'#c0392b', gridLine:'#eee' },
    dark:  { black:'#f0f0f0', dark:'#ccc', mid:'#aaa', light:'#888', vlight:'#444', red:'#e0574a', gridLine:'#2a2a2a' }
};
// Every chart is built from the light design; the theme code below maps it.
const C = PALETTE.light;
// Ordered so adjacent series stay separable in greyscale as well as colour.
const SERIES = ['#000000','#c0392b','#2c6e8f','#7a7a7a','#8e6d3f','#4a7c59','#8e5572','#b5893c'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// Calendar ramp, in scrobbles logged that day.
const CAL_STEPS  = [0, 10, 30, 60, 120];
const CAL_COLORS = ['#f0f0f0','#d8d8d8','#a8a8a8','#6e6e6e','#333333','#000000'];
// Dark-mode ramp inverts lightness: an empty day sits near the dark
// background instead of being the brightest cell on the page.
const CAL_COLORS_DARK = ['#242424','#454545','#6b6b6b','#969696','#c8c8c8','#f5f5f5'];

// ─────────────────────────────────────────────────────────────
//  THEME (light/dark)
//  Greys carry this design's ink: black series, grey ramps, hairlines.
//  In dark mode a grey's lightness is mapped from the light page's range
//  (white page → black ink) onto the dark page's (#0d0d0d → #f0f0f0), so
//  every grey keeps its contrast against the page — a black series turns
//  near-white instead of vanishing, and a faint grey stays faint instead of
//  becoming the brightest thing on screen. Saturated colours pass through,
//  except the accent, which follows the CSS. Charts are captured in their
//  light form once, so toggling back restores them exactly.
// ─────────────────────────────────────────────────────────────
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function toDark(c) {
    if (typeof c !== 'string') return c;
    if (c.toLowerCase() === PALETTE.light.red) return PALETTE.dark.red;
    let r, g, b, a = null, m;
    if ((m = c.match(/^#([0-9a-f]{3})$/i))) [r, g, b] = [...m[1]].map(h => parseInt(h + h, 16));
    else if ((m = c.match(/^#([0-9a-f]{6})$/i))) [r, g, b] = [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16));
    else if ((m = c.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)$/))) {
        [r, g, b] = [m[1], m[2], m[3]].map(Number);
        if (m[4] !== undefined) a = m[4];
    } else return c;
    if (r !== g || g !== b) return c;
    const l = Math.round(13 + (255 - r) * 227 / 255);
    return a === null ? `rgb(${l},${l},${l})` : `rgba(${l},${l},${l},${a})`;
}
// For colours read at draw time (plugins painting straight onto the canvas).
const ink = c => isDark() ? toDark(c) : c;

const INK_KEYS = new Set(['color', 'borderColor', 'backgroundColor', 'pointBackgroundColor',
    'pointBorderColor', 'pointHoverBackgroundColor', 'pointHoverBorderColor',
    'hoverBackgroundColor', 'hoverBorderColor', 'titleColor', 'bodyColor', 'tickColor']);
function collectInk(obj, path, out, depth) {
    if (!obj || typeof obj !== 'object' || depth > 6) return;
    for (const k of Object.keys(obj)) {
        const v = obj[k];
        if (INK_KEYS.has(k) && (typeof v === 'string' || (Array.isArray(v) && v.length && v.every(x => typeof x === 'string')))) {
            out.push({ path: path.concat(k), v });
        } else if (v && typeof v === 'object' && !Array.isArray(v)) {
            collectInk(v, path.concat(k), out, depth + 1);
        }
    }
}
// Paths, not object references: Chart.js re-clones scale options on every
// update, so the light values are re-applied through the live config.
function inkChart(chart, dark) {
    if (!chart.$ink) {
        const out = [];
        chart.config.data.datasets.forEach((ds, i) => collectInk(ds, ['data', 'datasets', i], out, 0));
        collectInk(chart.config.options, ['options'], out, 0);
        chart.$ink = out;
    }
    for (const { path, v } of chart.$ink) {
        let o = chart.config;
        for (let i = 0; i < path.length - 1 && o; i++) o = o[path[i]];
        if (o) o[path[path.length - 1]] = dark ? (Array.isArray(v) ? v.map(toDark) : toDark(v)) : v;
    }
}

const chartRegistry = [];
Chart.register({
    id: 'themeTracker',
    // Runs before the first render, so a chart built in dark mode never
    // flashes its light colours.
    afterInit(chart) { chartRegistry.push(chart); inkChart(chart, isDark()); }
});
// Chart.js copies its colour defaults into each chart's scale options when it
// is built, and inkChart() maps those copies — so they must stay on the light
// design, or a chart built in dark mode gets darkened twice.
Chart.defaults.color = PALETTE.light.mid;
function applyChartTheme() {
    // Legend text is resolved live at draw time rather than copied, so it
    // follows the theme here instead.
    Chart.defaults.plugins.legend.labels.color = isDark() ? PALETTE.dark.mid : PALETTE.light.mid;
    chartRegistry.forEach(chart => { inkChart(chart, isDark()); chart.update('none'); });
}

// ─────────────────────────────────────────────────────────────
//  GENRE
//  The scrobble export has no genre column — Last.fm attaches genre to the
//  ARTIST, as community tags, not to the play. Genre here is therefore a join,
//  resolved per artist in this order:
//
//    1. ARTIST_GENRE below — a hand-curated override for the artists that carry
//       the most plays. It wins over the crowd, because community tags are
//       unreliable exactly where it matters: short or ambiguous artist names
//       collide, and non-Western music gets flattened into "world".
//    2. lastfm_artist_tags.json — top tags from the Last.fm API, mapped through
//       TAG_GENRE and resolved to the highest-weighted tag that maps to
//       anything. Generated by tools/fetch_lastfm_tags.py; optional. Without it
//       the page still works, on the curated list alone.
//    3. Unclassified — stated plainly rather than guessed at.
//
//  Each artist gets exactly ONE genre, so every scrobble counts once and the
//  shares sum to 100%. That loses nuance on genuinely hybrid artists —

function resolveGenre(artist, tagIndex) {
    const override = ARTIST_GENRE[artist.toLowerCase()];
    if (override) return override;
    const tags = tagIndex && tagIndex[artist];
    if (tags) {
        // Tags arrive weight-descending; take the first that maps to a genre.
        for (const [tag] of tags) {

// ─────────────────────────────────────────────────────────────
//  CSV PARSER
//  The Last.fm export is headerless and quotes only the timestamp (it is the
//  one field containing a comma), but artist and track names carry quotes and
//  commas of their own often enough that splitting on "," is not safe. This is
//  a character scanner over the whole text rather than a per-line split, so a
//  newline inside a quoted field cannot desynchronise the parse.
// ─────────────────────────────────────────────────────────────
function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // strip BOM
    const out = [];
    let row = [], cur = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
            if (ch === '"') {
                if (text[i+1] === '"') { cur += '"'; i++; }     // escaped quote
                else inQ = false;
            } else cur += ch;
        } else if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); out.push(row); row = []; cur = ''; }
        else if (ch !== '\r') cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); out.push(row); }
    return out;
}

// "20 Sep 2026, 23:49" -> Date in the browser's local frame.
// Built component-wise rather than handed to Date.parse: the native parser
// treats some of these shapes as UTC, which would silently rotate the whole
// clock chart by the viewer's offset.
const MON = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
const TS_RE = /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/;
function parseTS(s) {
    const m = TS_RE.exec((s || '').trim());
    if (!m) return null;
    const mo = MON[m[2][0].toUpperCase() + m[2].slice(1,3).toLowerCase()];
    if (mo === undefined) return null;
    const d = new Date(+m[3], mo, +m[1], +m[4], +m[5]);
    return isNaN(d.getTime()) ? null : d;
}

// ─────────────────────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────────────────────
const ymd   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ym    = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const comma = n => n.toLocaleString('en-US');
const pct   = (a,b) => b ? 100*a/b : 0;

function bump(map, key, by) { map.set(key, (map.get(key) || 0) + (by === undefined ? 1 : by)); }
function topOf(map, n) {
    return [...map.entries()].sort((a,b) => b[1]-a[1]).slice(0, n);
}
function median(sorted) {
    if (!sorted.length) return 0;
    const m = sorted.length >> 1;
    return sorted.length % 2 ? sorted[m] : (sorted[m-1]+sorted[m])/2;
}
function quantile(sorted, q) {
    if (!sorted.length) return 0;
    return sorted[Math.min(sorted.length-1, Math.floor(q*sorted.length))];
}
// Two-proportion z test. Used once, to say whether the weekend lift in the
// morning trough is a real difference or a shrug.
function zProp(x1, n1, x2, n2) {
    if (!n1 || !n2) return 0;
    const p = (x1+x2)/(n1+n2);
    const se = Math.sqrt(p*(1-p)*(1/n1 + 1/n2));
    return se ? (x2/n2 - x1/n1)/se : 0;
}

    const ramp = document.documentElement.getAttribute('data-theme') === 'dark' ? CAL_COLORS_DARK : CAL_COLORS;
    if (!v) return ramp[0];
    let i = 1;
    for (let s = 1; s < CAL_STEPS.length; s++) if (v > CAL_STEPS[s]) i = s+1;
    return ramp[Math.min(i, ramp.length-1)];
}

// ─────────────────────────────────────────────────────────────
//  PROCESS
//  One ordered pass over ~112k scrobbles builds every aggregate the page
//  draws. Everything returned here is plain JSON so the whole result can be
//  cached in localStorage and redrawn instantly on a repeat visit.
// ─────────────────────────────────────────────────────────────
function processData(recs, tagIndex) {
    recs.sort((a,b) => a.t - b.t);
    const first = recs[0].t, last = recs[recs.length-1].t;

    // ── counters ──────────────────────────────────────────────
    const artistPlays = new Map(), trackPlays = new Map(), albumPlays = new Map();
    const artistFirst = new Map(), artistLast = new Map();
    const perDay = new Map(), perMonth = new Map();
    const hourAll = new Array(24).fill(0);
    const hourWd  = new Array(24).fill(0);
    const hourWe  = new Array(24).fill(0);
    const weekday = new Array(7).fill(0);
    const monthRate = new Array(12).fill(0);
    const yearPlays = new Map();
    const hourYear = new Map();          // year -> [24]
    const artistYear = new Map();        // artist -> Map(year -> plays)
    let wdTotal = 0, weTotal = 0, eraTotal = 0, sameAlbumAdj = 0;

    for (const r of recs) {
        const d = r.t, y = d.getFullYear(), h = d.getHours();
        bump(artistPlays, r.ar);
        bump(trackPlays, r.ar + ' \u0000 ' + r.tr);
        if (r.al) bump(albumPlays, r.ar + ' \u0000 ' + r.al);
        if (!artistFirst.has(r.ar)) artistFirst.set(r.ar, d.getTime());
        artistLast.set(r.ar, d.getTime());
        bump(perDay, ymd(d));
        bump(perMonth, ym(d));
        bump(yearPlays, y);
        hourAll[h]++;
        weekday[(d.getDay()+6) % 7]++;

        if (d >= ERA_START) {
            eraTotal++;
            monthRate[d.getMonth()]++;
            const wknd = d.getDay() === 0 || d.getDay() === 6;
            if (wknd) { hourWe[h]++; weTotal++; } else { hourWd[h]++; wdTotal++; }
            if (!hourYear.has(y)) hourYear.set(y, new Array(24).fill(0));
            hourYear.get(y)[h]++;
        }
        if (!artistYear.has(r.ar)) artistYear.set(r.ar, new Map());
        bump(artistYear.get(r.ar), y);
    }

    // Consecutive plays from the same album, within one sitting: the signature
    // of playing a record start to finish rather than shuffling a playlist.
    const gapMs = SESSION_GAP_MIN * 60000;
    for (let i = 1; i < recs.length; i++) {
        const p = recs[i-1], n = recs[i];
        if (n.t - p.t < gapMs && p.al && p.al === n.al && p.ar === n.ar) sameAlbumAdj++;
    }

    // ── sessions ─────────────────────────────────────────────
    const sessions = [];
    let cur = [recs[0]];
    for (let i = 1; i < recs.length; i++) {
        if (recs[i].t - recs[i-1].t > gapMs) { sessions.push(cur); cur = [recs[i]]; }
        else cur.push(recs[i]);
    }
    sessions.push(cur);
    const sLens = sessions.map(s => s.length).sort((a,b) => a-b);
    // Bucketed for display; the tail is long enough that a raw histogram is
    // unreadable past about 25.
    const sBuckets = [
        { label:'1',      lo:1,  hi:1 },
        { label:'2–3',    lo:2,  hi:3 },
        { label:'4–7',    lo:4,  hi:7 },
        { label:'8–15',   lo:8,  hi:15 },
        { label:'16–30',  lo:16, hi:30 },
        { label:'31–60',  lo:31, hi:60 },
        { label:'60+',    lo:61, hi:1e9 }
    ].map(b => ({ label:b.label, n:sLens.filter(v => v >= b.lo && v <= b.hi).length }));
    const longest = sessions.reduce((a,b) => b.length > a.length ? b : a, sessions[0]);
    const monoSessions = sessions.filter(s =>
        s.length >= 8 && s.every(x => x.ar === s[0].ar)).length;

    // ── daily streak ─────────────────────────────────────────
    const dayKeys = [...perDay.keys()].sort();
    let bestStreak = 1, run = 1, bestEnd = dayKeys[0];
    for (let i = 1; i < dayKeys.length; i++) {
        const prev = new Date(dayKeys[i-1] + 'T00:00:00');
        const now  = new Date(dayKeys[i]   + 'T00:00:00');
        if (Math.round((now-prev)/86400000) === 1) {
            run++;
            if (run > bestStreak) { bestStreak = run; bestEnd = dayKeys[i]; }
        } else run = 1;
    }

    // ── artists ──────────────────────────────────────────────
    const artistsRanked = [...artistPlays.entries()].sort((a,b) => b[1]-a[1]);
    const topArtists = artistsRanked.slice(0, TOP_N_ARTISTS).map(([name, plays]) => ({
        name, plays,
        first: artistFirst.get(name),
        last:  artistLast.get(name),
        share: +pct(plays, recs.length).toFixed(2)
    }));
    // How concentrated the whole library is: how few artists cover half of it.
    let acc = 0, half = 0, eighty = 0;
    for (let i = 0; i < artistsRanked.length; i++) {
        acc += artistsRanked[i][1];
        if (!half   && acc >= recs.length*0.5) half = i+1;
        if (!eighty && acc >= recs.length*0.8) { eighty = i+1; break; }
    }
    const onePlay = artistsRanked.filter(a => a[1] === 1).length;
    // Cumulative-share curve, sampled — 10k points would draw as a solid block.
    const lorenz = [];
    acc = 0;
    for (let i = 0; i < artistsRanked.length; i++) {
        acc += artistsRanked[i][1];
        if (i < 50 || i % 40 === 0 || i === artistsRanked.length-1)
            lorenz.push({ x:+pct(i+1, artistsRanked.length).toFixed(3), y:+pct(acc, recs.length).toFixed(2) });
    }

    // ── years, eras, discovery ───────────────────────────────
    const years = [...yearPlays.keys()].filter(y => yearPlays.get(y) >= MIN_YEAR_SCROBBLES).sort();
    const newArtistsByYear = new Map();
    for (const [name, ts] of artistFirst) bump(newArtistsByYear, new Date(ts).getFullYear());
    const discovery = years.map(y => {
        // Share of the year's plays that went to artists heard for the first
        // time that same year — "how much of this year was new to me".
        let fresh = 0;
        for (const [name, ym2] of artistYear) {
            const n = ym2.get(y);
            if (n && new Date(artistFirst.get(name)).getFullYear() === y) fresh += n;
        }
        return { year:y, newArtists:newArtistsByYear.get(y) || 0,
                 novelty:+pct(fresh, yearPlays.get(y)).toFixed(1),
                 total:yearPlays.get(y) };
    });
    // Defining artist of each year, by share of that year.
    const eras = years.map(y => {
        let bestA = null, bestN = 0;
        for (const [name, ym2] of artistYear) {
            const n = ym2.get(y) || 0;
            if (n > bestN) { bestN = n; bestA = name; }
        }
        return { year:y, artist:bestA, plays:bestN, share:+pct(bestN, yearPlays.get(y)).toFixed(1) };
    });
    // Migration lines: the biggest artists, as a share of each year.
    const eraArtists = artistsRanked.slice(0, ERA_ARTISTS).map(([name]) => name);
    const migration = eraArtists.map(name => ({
        name,
        series: years.map(y => +pct(artistYear.get(name).get(y) || 0, yearPlays.get(y)).toFixed(2))
    }));
    // Comet: when an artist entered the library vs how big they became.
    const comet = artistsRanked.filter(([,n]) => n >= MIN_ARTIST_PLAYS).map(([name, plays]) => ({
        name, plays, first:artistFirst.get(name),
        months: Math.max(1, Math.round((artistLast.get(name)-artistFirst.get(name))/2592000000))
    }));

    // ── binge days ───────────────────────────────────────────
    const dayArtists = new Map();
    for (const r of recs) {
        const k = ymd(r.t);
        if (!dayArtists.has(k)) dayArtists.set(k, new Map());
        bump(dayArtists.get(k), r.ar);
    }
    const binges = [];
    for (const [day, m] of dayArtists) {
        const total = perDay.get(day);
        if (total < BINGE_MIN_PLAYS) continue;
        const [a, n] = topOf(m, 1)[0];
        if (n/total >= BINGE_MIN_SHARE) binges.push({ day, artist:a, plays:n, total });
    }
    binges.sort((a,b) => b.plays-a.plays);

    // ── hour-of-day, as percentages of their own group ───────
    const clock = {
        weekday: hourWd.map(v => +pct(v, wdTotal).toFixed(2)),
        weekend: hourWe.map(v => +pct(v, weTotal).toFixed(2)),
        allPct:  hourAll.map(v => +pct(v, recs.length).toFixed(2)),
        counts:  hourAll,
        wdTotal, weTotal
    };
    // The morning trough (08:00–11:59) against the small hours (03:00–06:59).
    // If the trough were sleep it would deepen at the weekend, not fill in.
    const sum = (arr, lo, hi) => arr.slice(lo, hi).reduce((a,b) => a+b, 0);
    const mWd = sum(hourWd, 8, 12), mWe = sum(hourWe, 8, 12);
    const nWd = sum(hourWd, 3, 7),  nWe = sum(hourWe, 3, 7);
    const eWd = sum(hourWd, 17, 20), eWe = sum(hourWe, 17, 20);
    clock.test = {
        morningWd:+pct(mWd, wdTotal).toFixed(2), morningWe:+pct(mWe, weTotal).toFixed(2),
        morningRatio:+(pct(mWe, weTotal)/pct(mWd, wdTotal)).toFixed(2),
        morningZ:+zProp(mWd, wdTotal, mWe, weTotal).toFixed(1),
        nightWd:+pct(nWd, wdTotal).toFixed(2), nightWe:+pct(nWe, weTotal).toFixed(2),
        nightRatio:+(pct(nWe, weTotal)/pct(nWd, wdTotal)).toFixed(2),
        eveWd:+pct(eWd, wdTotal).toFixed(2), eveWe:+pct(eWe, weTotal).toFixed(2),
        eveZ:+zProp(eWd, wdTotal, eWe, weTotal).toFixed(1)
    };
    const quietH = hourAll.indexOf(Math.min(...hourAll));
    const peakH  = hourAll.indexOf(Math.max(...hourAll));
    clock.quietHour = quietH; clock.peakHour = peakH;
    clock.peakRatio = +(hourAll[peakH]/Math.max(1, hourAll[quietH])).toFixed(1);

    // Hour × year, each year normalised to itself so a busy year does not
    // simply look brighter than a quiet one.
    const hourYearRows = [...hourYear.keys()].sort().map(y => {
        const arr = hourYear.get(y), tot = arr.reduce((a,b) => a+b, 0);
        return { year:y, pct:arr.map(v => +pct(v, tot).toFixed(2)), total:tot };
    });

    // ── calendar + monthly series ────────────────────────────
    const monthKeys = [...perMonth.keys()].sort();
    const monthly = monthKeys.map(k => ({ k, n:perMonth.get(k) }));
    const calYears = [];
    for (let y = ERA_START.getFullYear(); y <= last.getFullYear(); y++) {
        const cells = [];
        let total = 0, active = 0;
        const d = new Date(y, 0, 1), end = new Date(y, 11, 31);
        for (; d <= end; d.setDate(d.getDate()+1)) {
            const k = ymd(d), v = perDay.get(k) || 0;
            // A day is "out of scope" if it falls before the continuous era began
            // or after the export ends. Counting either against the active-day
            // percentage would understate it: the first partial year would be
            // charged for 97 days that predate the record entirely.
            const scope = d >= ERA_START && d <= last;
            cells.push({ k, v, dow:(d.getDay()+6)%7, scope });
            if (scope) { total += v; if (v) active++; }
        }
        const inYear = cells.filter(c => c.scope).length;
        calYears.push({ year:y, cells, total, active, days:inYear });
    }

    // ── genre ────────────────────────────────────────────────
    // Resolved once per artist, not per scrobble: 10k lookups instead of 112k,
    // and it guarantees an artist cannot drift between genres mid-history.
    const artistGenre = new Map();
    for (const name of artistPlays.keys()) artistGenre.set(name, resolveGenre(name, tagIndex));

    const genreTotals   = new Map();
    const genreByYear   = new Map();   // genre -> Map(year -> plays)
    const genreByHour   = new Map();   // genre -> [24]
    const genreArtists  = new Map();   // genre -> Set(artist)
    for (const r of recs) {
        const g = artistGenre.get(r.ar), y = r.t.getFullYear();
        bump(genreTotals, g);
        if (!genreByYear.has(g)) genreByYear.set(g, new Map());
        bump(genreByYear.get(g), y);
        if (!genreArtists.has(g)) genreArtists.set(g, new Set());
        genreArtists.get(g).add(r.ar);
        if (r.t >= ERA_START) {
            if (!genreByHour.has(g)) genreByHour.set(g, new Array(24).fill(0));
            genreByHour.get(g)[r.t.getHours()]++;
        }
    }
    // Keep the canonical order rather than sorting by size, so a genre stays in
    // the same band and the same colour across every chart on the page.
    const genreOrder = GENRES.map(([g]) => g).filter(g => genreTotals.has(g));
    const genreRank = genreOrder.map(g => ({
        genre: g,
        plays: genreTotals.get(g),
        share: +pct(genreTotals.get(g), recs.length).toFixed(2),
        artists: genreArtists.get(g).size
    })).sort((a,b) => b.plays - a.plays);

    const genreSeries = genreOrder.map(g => ({
        genre: g,
        series: years.map(y => +pct(genreByYear.get(g).get(y) || 0, yearPlays.get(y)).toFixed(2))
    }));

    // Genre against the clock. Normalising each genre to its own total is not
    // enough: every genre inherits the library's overall daily rhythm, so the
    // curves come out nearly identical and say nothing. What discriminates is
    // LIFT — a genre's share of a window divided by the whole library's share
    // of that window. 1.0 means "behaves like everything else"; 2.0 means
    // "twice as concentrated there as the library is".
    //
    // Each genre is tested against the REST of the library rather than against
    // a total it is itself part of, which would shrink the very difference
    // being measured.
    const hourAllEra = new Array(24).fill(0);
    for (const arr of genreByHour.values()) arr.forEach((v,h) => { hourAllEra[h] += v; });
    const eraClassified = hourAllEra.reduce((a,b) => a+b, 0);
    const winSum = (arr, w) => arr.slice(w[0], w[1]).reduce((a,b) => a+b, 0);

    const genreWindows = genreOrder
        .filter(g => g !== UNCLASSIFIED && genreByHour.has(g) && genreTotals.get(g) >= GENRE_WINDOW_MIN)
        .map(g => {
            const arr = genreByHour.get(g), tot = arr.reduce((a,b) => a+b, 0);
            const rest = hourAllEra.map((v,h) => v - arr[h]);
            const restTot = eraClassified - tot;
            const one = w => {
                const n = winSum(arr, w), base = winSum(hourAllEra, w)/eraClassified;
                return {
                    n, share:+pct(n, tot).toFixed(2),
                    lift:+((n/tot)/base).toFixed(2),
                    z:+zProp(winSum(rest, w), restTot, n, tot).toFixed(1)
                };
            };
            return { genre:g, total:tot, work:one(WORK_WINDOW), eve:one(EVE_WINDOW) };
        })
        .sort((a,b) => b.work.lift - a.work.lift);

    const classified = recs.length - (genreTotals.get(UNCLASSIFIED) || 0);

    // Seasonality has to be a rate: calendar months differ in length and the
    // record stops partway through its final month, so raw monthly totals would
    // punish February for being short and the last month for being incomplete.
    const monthDays = new Array(12).fill(0);
    for (const d = new Date(ERA_START.getTime()); d <= last; d.setDate(d.getDate()+1))
        monthDays[d.getMonth()]++;
    const monthRatePerDay = monthRate.map((v,i) => +(v/Math.max(1, monthDays[i])).toFixed(2));

    // Days-of-music estimate, stated as an estimate everywhere it appears.
    const estHours = recs.length * EST_TRACK_MIN / 60;
    const eraDays  = Math.round((last - ERA_START)/86400000) + 1;
    const eraActive = dayKeys.filter(k => new Date(k+'T00:00:00') >= ERA_START).length;

    return {
        totals: {
            scrobbles: recs.length,
            artists: artistPlays.size,
            tracks: trackPlays.size,
            albums: albumPlays.size,
            first: first.getTime(), last: last.getTime(),
            estHours: Math.round(estHours),
            estDays: +(estHours/24).toFixed(0),
            eraDays, eraActive, eraTotal,
            eraActivePct: +pct(eraActive, eraDays).toFixed(1),
            perDay: +(eraTotal/eraDays).toFixed(1),
            bestStreak, bestEnd,
            half, eighty, onePlay,
            onePlayPct: +pct(onePlay, artistPlays.size).toFixed(0),
            sameAlbumPct: +pct(sameAlbumAdj, recs.length-1).toFixed(1),
            sessions: sessions.length,
            sessMedian: median(sLens),
            sessP90: quantile(sLens, 0.9),
            sessMax: sLens[sLens.length-1],
            monoSessions,
            longestSession: {
                n: longest.length,
                start: longest[0].t.getTime(),
                end: longest[longest.length-1].t.getTime(),
                top: topOf(longest.reduce((m,x) => (bump(m, x.ar), m), new Map()), 3)
            }
        },
        clock, hourYearRows, weekday,
        monthly, calYears,
        sessionBuckets: sBuckets,
        monthRatePerDay,
        topArtists,
        topTracks: topOf(trackPlays, 12).map(([k,n]) => { const [ar,tr] = k.split(' \u0000 '); return { ar, tr, n }; }),
        topAlbums: topOf(albumPlays, 12).map(([k,n]) => { const [ar,al] = k.split(' \u0000 '); return { ar, al, n }; }),
        years, eras, discovery, migration, comet, lorenz,
        genreRank, genreSeries, genreWindows,
        genreCoverage: {
            classified,
            pct: +pct(classified, recs.length).toFixed(1),
            genres: genreRank.filter(g => g.genre !== UNCLASSIFIED).length,
            tagged: tagIndex ? Object.keys(tagIndex).length : 0,
            curated: Object.keys(ARTIST_GENRE).length
        },
        binges: binges.slice(0, 12), bingeCount: binges.length
    };
}

function drawClock(D) {
    const K = D.clock, t = K.test;

    // Radar, 24 spokes, midnight at top. Only every third hour is labelled;
    // 24 labels around a small circle is unreadable.
    new Chart(document.getElementById('clockChart'), {
        type:'radar',
        data:{
            labels: Array.from({length:24}, (_,h) => h % 3 === 0 ? hourLabel(h) : ''),
            datasets:[
                { label:'Weekday (Mon–Fri)', data:K.weekday,
                  borderColor:C.black, backgroundColor:'rgba(0,0,0,.10)',
                  borderWidth:2, pointRadius:0, pointHoverRadius:4, pointHoverBackgroundColor:C.black },
                { label:'Weekend (Sat–Sun)', data:K.weekend,
                  borderColor:C.red, backgroundColor:'rgba(192,57,43,.10)',
                  borderWidth:2, pointRadius:0, pointHoverRadius:4, pointHoverBackgroundColor:C.red }
            ]
        },
        options:{
            responsive:true, maintainAspectRatio:true, aspectRatio:1,
            plugins:{
                legend:LEGEND_TOP,
                tooltip:{
                    callbacks:{
                        title: items => hourFull(items[0].dataIndex) + '–' + hourFull((items[0].dataIndex+1)%24),
                        label: c => `${c.dataset.label}: ${c.raw.toFixed(2)}%`
                    }
                }
            },
            scales:{
                r:{
                    beginAtZero:true,
                    angleLines:{ color:C.gridLine },
                    grid:{ color:C.gridLine },
                    pointLabels:{ font:{ size:10 }, color:C.light },
                    ticks:{ display:false }
                }
            }
        }
    });

    // The same two series unrolled, where the gap is easiest to read.
    new Chart(document.getElementById('clockLineChart'), {
        type:'line',
        data:{
            labels: Array.from({length:24}, (_,h) => hourLabel(h)),
            datasets:[
                { label:'Weekday', data:K.weekday, borderColor:C.black,
                  backgroundColor:'rgba(0,0,0,.06)', borderWidth:2, fill:true,
                  tension:.35, pointRadius:0, pointHoverRadius:4 },
                { label:'Weekend', data:K.weekend, borderColor:C.red,
                  backgroundColor:'rgba(192,57,43,.06)', borderWidth:2, fill:true,
                  tension:.35, pointRadius:0, pointHoverRadius:4 }
            ]
        },
        options:{
            responsive:true, maintainAspectRatio:true, aspectRatio:1,
            interaction:{ mode:'index', intersect:false },
            plugins:{
                legend:LEGEND_TOP,
                tooltip:{ callbacks:{
                    title: items => hourFull(items[0].dataIndex) + '–' + hourFull((items[0].dataIndex+1)%24),
                    label: c => `${c.dataset.label}: ${c.raw.toFixed(2)}%`
                }}
            },
            scales:{
                x:{ grid:{ display:false }, ticks:{ maxRotation:0, autoSkipPadding:12 } },
                y:{ beginAtZero:true, grid:GRID, title:{ display:true, text:'% of that group’s scrobbles' },
                    ticks:{ callback:v => v + '%' } }
            }
        }
    });

    document.getElementById('clockTakeaway').innerHTML = `
        <div><div class="k">Quietest hour</div><div class="v">${hourFull(K.quietHour)}</div></div>
        <div><div class="k">Busiest hour</div><div class="v">${hourFull(K.peakHour)}</div></div>
        <div><div class="k">Peak vs. trough</div><div class="v up">${K.peakRatio}&times;</div></div>
        <div><div class="k">08–12 weekend lift</div><div class="v up">${t.morningRatio}&times;</div></div>
        <div><div class="k">03–07 weekend lift</div><div class="v">${t.nightRatio}&times;</div></div>`;

    document.getElementById('clockInsight').innerHTML = `
        <strong>The most interesting thing in this data is a hole.</strong>
        Listening collapses between ${hourFull(8)} and noon — hour ${hourFull(K.quietHour)}
        carries ${K.allPct[K.quietHour].toFixed(2)}% of all scrobbles, against
        ${K.allPct[K.peakHour].toFixed(2)}% at ${hourFull(K.peakHour)}, a
        ${K.peakRatio}-fold difference. The obvious explanation is sleep, and the
        obvious explanation is wrong.<br><br>
        Sleep does not take weekends off. This trough does. On Saturday and Sunday the
        ${hourFull(8)}–noon window carries ${t.morningWe}% of the day's listening against
        ${t.morningWd}% on a weekday — <strong>${t.morningRatio}&times; more</strong>, a gap far
        too large to be chance (z&nbsp;=&nbsp;${t.morningZ}). Meanwhile the genuine small
        hours, ${hourFull(3)}–${hourFull(7)}, move the other way: ${t.nightWe}% at the
        weekend against ${t.nightWd}% on a weekday, ${t.nightRatio}&times; — slightly
        <em>less</em>, because a weekday that starts early starts with music on.
        And weekend evenings, ${hourFull(17)}–${hourFull(20)}, swell from ${t.eveWd}% to
        ${t.eveWe}% (z&nbsp;=&nbsp;${t.eveZ}).<br><br>
        A trough that fills in on weekends, beside a sleep window that does not, is not
        rest. It is obligation. For a surgeon, the missing hours are the ones spent
        scrubbed in, where nobody is choosing the music — and the two peaks either side
        are the drive in and the long decompression after. <strong>The negative space in
        that chart is the operating room.</strong>`;
}

// Hour-by-year heatmap. Each row normalised to its own maximum so the question
// answered is "when did that year listen", not "how much did that year listen".
function drawHourYear(D) {
    const rows = D.hourYearRows;
    let html = '<table><tr><th class="rowhead"></th>';
    for (let h = 0; h < 24; h++) html += `<th>${h % 2 === 0 ? hourLabel(h) : ''}</th>`;
    html += '</tr>';
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    for (const r of rows) {
        const mx = Math.max(...r.pct);
        html += `<tr><th class="rowhead">${r.year}</th>`;
        for (let h = 0; h < 24; h++) {
            const f = mx ? r.pct[h]/mx : 0;
            // Single-hue ramp, gamma-shaped so the low end stays legible. Light mode
            // runs white to black; dark mode inverts it so an idle hour sits near the
            // page background instead of being the brightest cell on the page.
            const l = dark ? Math.round(24 + 215*Math.pow(f, .72))
                           : Math.round(255 - 235*Math.pow(f, .72));
            html += `<td><div class="c" style="background:rgb(${l},${l},${l})" `
                 +  `title="${r.year} ${hourFull(h)} — ${r.pct[h].toFixed(2)}% of the year"></div></td>`;
        }
        html += '</tr>';
    }
    html += '</table>';
    document.getElementById('hourYearHM').innerHTML = html;
}

// Shades the dormant years so the eye reads that stretch as "no account
// activity" rather than "very quiet listening" — they are not the same claim.
const dormantShade = {
    id:'dormantShade',
    beforeDatasetsDraw(chart, args, opts) {
        const idx = opts.untilIndex;
        if (idx == null || idx < 1) return;
        const { ctx, chartArea:{ top, bottom }, scales:{ x } } = chart;
        const x0 = x.getPixelForValue(0), x1 = x.getPixelForValue(idx);
        ctx.save();
        ctx.fillStyle = ink('rgba(0,0,0,.045)');
        ctx.fillRect(x0, top, x1-x0, bottom-top);
        ctx.strokeStyle = ink('#bbb'); ctx.setLineDash([4,3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x1, top); ctx.lineTo(x1, bottom); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = ink('#999'); ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        if (x1-x0 > 70) ctx.fillText('account largely dormant', (x0+x1)/2, top+14);
        ctx.restore();
    }
};
Chart.register(dormantShade);

function drawComet(D) {
    // Label only the handful big enough to name without the chart turning to soup.
    const pts = D.comet.map(c => ({ x:c.first, y:c.plays, name:c.name }));
    const nameThreshold = 700;
    new Chart(document.getElementById('cometChart'), {
        type:'scatter',
        data:{ datasets:[{
            label:'Artist', data:pts,
            backgroundColor:pts.map(p => p.y >= nameThreshold ? 'rgba(192,57,43,.75)' : 'rgba(0,0,0,.32)'),
            borderColor:'transparent',
            pointRadius:pts.map(p => Math.max(3, Math.min(13, Math.sqrt(p.y)/6))),
            pointHoverRadius:pts.map(p => Math.max(5, Math.min(15, Math.sqrt(p.y)/6 + 2)))
        }]},
        options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{
                legend:{ display:false },
                tooltip:{ callbacks:{
                    label: c => `${c.raw.name} — ${comma(c.raw.y)} plays, first heard ${fmtDate(c.raw.x)}`
                }}
            },
            scales:{
                x:{ type:'linear', grid:GRID,
                    title:{ display:true, text:'First heard' },
                    ticks:{ maxRotation:0, callback:v => new Date(v).getFullYear() } },
                y:{ type:'logarithmic', grid:GRID,
                    title:{ display:true, text:'Total plays (log scale)' },
                    afterBuildTicks: ax => { ax.ticks = [150,250,500,1000,2000,3000].map(v => ({ value:v })); },
                    ticks:{ autoSkip:false, callback:v => comma(v) } }
            }
        },
        plugins:[{
            id:'cometLabels',
            afterDatasetsDraw(chart) {
                const { ctx, chartArea:A } = chart;
                const meta = chart.getDatasetMeta(0);
                ctx.save();
                ctx.font = '600 10px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Biggest first, so if space runs out it is a minor name that goes.
                const order = pts.map((p,i) => i)
                    .filter(i => pts[i].y >= nameThreshold)
                    .sort((a,b) => pts[b].y - pts[a].y);
                const placed = [];
                const hits = r => placed.some(q =>
                    r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0);

                for (const i of order) {
                    const p = pts[i], pt = meta.data[i];
                    if (!pt) continue;
                    const w = ctx.measureText(p.name).width, h = 12;
                    const rad = (meta.data[i].options && meta.data[i].options.radius) || 6;
                    // Above, below, then further out, then to either side.
                    const cands = [
                        [0, -(rad+9)], [0, rad+9], [0, -(rad+21)], [0, rad+21],
                        [-(w/2+rad+6), 0], [w/2+rad+6, 0]
                    ];
                    let box = null;
                    for (const [dx, dy] of cands) {
                        const cx = pt.x + dx, cy = pt.y + dy;
                        const r = { x0:cx-w/2-2, x1:cx+w/2+2, y0:cy-h/2, y1:cy+h/2, cx, cy };
                        if (r.x0 < A.left || r.x1 > A.right || r.y0 < A.top || r.y1 > A.bottom) continue;
                        if (hits(r)) continue;
                        box = r; break;
                    }
                    if (!box) continue;
                    placed.push(box);
                    // Halo, so a label crossing a point or gridline stays readable.
                    ctx.lineWidth = 3; ctx.strokeStyle = ink('#fff');
                    ctx.strokeText(p.name, box.cx, box.cy);
                    ctx.fillStyle = ink(C.red);
                    ctx.fillText(p.name, box.cx, box.cy);
                }
                ctx.restore();
            }
        }]
    });
}

function drawGenre(D) {
    const R = D.genreRank, cov = D.genreCoverage, W = D.genreWindows;

    // Stacked to 100% of each year. Percentage rather than counts, because the
    // volume story is told elsewhere and mixing the two here would let a big
    // year swamp the shape that this chart exists to show.
    new Chart(document.getElementById('genreStackChart'), {
        type:'line',
        data:{
            labels:D.years,
            datasets:D.genreSeries.map(g => ({
                label:g.genre, data:g.series,
                backgroundColor:GENRE_COLOR[g.genre],
                borderColor:GENRE_COLOR[g.genre],
                borderWidth:0, fill:true, tension:0,
                pointRadius:0, pointHoverRadius:4
            }))
        },
        options:{
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'index', intersect:false },
            plugins:{
                legend:{ position:'top', align:'start',
                         labels:{ boxWidth:10, boxHeight:10, usePointStyle:true,
                                  pointStyle:'rect', padding:9, font:{ size:10.5 } } },
                tooltip:{
                    itemSort:(a,b) => b.raw - a.raw,
                    // A 16-genre stack produces a tooltip the height of the chart;
                    // the tail is all sub-1% noise, so it is trimmed.
                    filter:item => item.raw >= 0.5,
                    callbacks:{ label: c => `${c.dataset.label}: ${c.raw.toFixed(1)}%` }
                }
            },
            scales:{
                x:{ grid:{ display:false }, stacked:true },
                y:{ stacked:true, min:0, max:100, grid:GRID,
                    title:{ display:true, text:'% of that year’s scrobbles' },
                    ticks:{ callback:v => v + '%' } }
            }
        }
    });

    // Biggest mover across the record, by change in share of the year.
    const first = D.years[0], last = D.years[D.years.length-1];
    const moves = D.genreSeries
        .filter(g => g.genre !== UNCLASSIFIED)
        .map(g => ({ genre:g.genre, from:g.series[0], to:g.series[g.series.length-1],
                     delta:+(g.series[g.series.length-1] - g.series[0]).toFixed(1) }));
    const risen  = moves.reduce((a,b) => b.delta > a.delta ? b : a, moves[0]);
    const fallen = moves.reduce((a,b) => b.delta < a.delta ? b : a, moves[0]);
    const topNow = D.genreSeries
        .filter(g => g.genre !== UNCLASSIFIED)
        .reduce((a,b) => b.series[b.series.length-1] > a.series[a.series.length-1] ? b : a);

    document.getElementById('genreTakeaway').innerHTML = `
        <div><div class="k">Genres identified</div><div class="v">${cov.genres}</div></div>
        <div><div class="k">Plays classified</div><div class="v">${cov.pct}%</div></div>
        <div><div class="k">Biggest riser</div><div class="v up">${risen.genre}</div>
             <div class="k">${risen.from.toFixed(1)}% → ${risen.to.toFixed(1)}%</div></div>
        <div><div class="k">Biggest faller</div><div class="v">${fallen.genre}</div>
             <div class="k">${fallen.from.toFixed(1)}% → ${fallen.to.toFixed(1)}%</div></div>
        <div><div class="k">Largest in ${last}</div><div class="v">${topNow.genre}</div>
             <div class="k">${topNow.series[topNow.series.length-1].toFixed(1)}%</div></div>`;

    const top3 = R.filter(g => g.genre !== UNCLASSIFIED).slice(0,3);
    const hi = W[0], lo = W[W.length-1];
    // The clearest single statement of the pattern is the genre that most
    // inverts between the two windows.
    const flip = [...W].sort((a,b) => (b.eve.lift - b.work.lift) - (a.eve.lift - a.work.lift))[0];
    document.getElementById('genreInsight').innerHTML = `
        <strong>The library has a centre of gravity, and it moves.</strong>
        ${top3.map(g => `${g.genre} (${g.share}%)`).join(', ')} lead all time, but the
        year-by-year stack shows the balance shifting rather than holding:
        <strong>${risen.genre}</strong> has gone from ${risen.from.toFixed(1)}% of
        ${first} to ${risen.to.toFixed(1)}% of ${last}, while
        <strong>${fallen.genre}</strong> has fallen from ${fallen.from.toFixed(1)}% to
        ${fallen.to.toFixed(1)}%.<br><br>
        The chart beside it answers something the clock at the top of this page could
        not. That clock showed <em>when</em> there is music, and found a hole from
        ${hourFull(WORK_WINDOW[0])} to noon. This shows <em>what</em> survives inside
        it — and it is not a smaller copy of the rest of the day.
        <strong>${hi.genre} runs at ${hi.work.lift.toFixed(2)}&times; its library rate
        in those hours</strong> (z&nbsp;=&nbsp;${hi.work.z.toFixed(1)}), and
        ${W[1].genre} at ${W[1].work.lift.toFixed(2)}&times;, while ${lo.genre} falls to
        ${lo.work.lift.toFixed(2)}&times; (z&nbsp;=&nbsp;${lo.work.z.toFixed(1)}).<br><br>
        After ${hourFull(EVE_WINDOW[0])} the order inverts: ${flip.genre} climbs from
        ${flip.work.lift.toFixed(2)}&times; in the morning to
        ${flip.eve.lift.toFixed(2)}&times; in the evening, while ${hi.genre} falls to
        ${hi.eve.lift.toFixed(2)}&times;. The axis is not
        really genre at all — it is <strong>music you leave on against music you
        choose</strong>. Wordless, beatless things keep playing through the hours when
        nobody is at the controls; the music with voices and drums waits for someone
        to be there.`;

    const maxG = R[0].plays;
    document.getElementById('genreTable').innerHTML = `
        <tr><th></th><th>Genre</th><th style="text-align:right">Artists</th>
            <th style="text-align:right">Plays</th></tr>
        ${R.map((g,i) => `
            <tr>
                <td class="n">${i+1}</td>
                <td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;
                    background:${GENRE_COLOR[g.genre]};margin-right:7px"></span>${esc(g.genre)}
                    <span class="bar" style="width:${100*g.plays/maxG}%;background:${GENRE_COLOR[g.genre]}"></span></td>
                <td class="meta">${comma(g.artists)}</td>
                <td class="v">${comma(g.plays)}<div class="sub" style="font-weight:400">${g.share}%</div></td>
            </tr>`).join('')}`;

    // Bars drawn as lift MINUS one, so the axis is centred on "behaves like the
    // rest of the library" and over/under-representation reads as a direction.
    new Chart(document.getElementById('genreWindowChart'), {
        type:'bar',
        data:{
            labels:W.map(g => g.genre),
            datasets:[{
                label:'Lift in 08:00-noon',
                data:W.map(g => +(g.work.lift - 1).toFixed(3)),
                backgroundColor:W.map(g => GENRE_COLOR[g.genre]),
                borderWidth:0
            }]
        },
        options:{
            indexAxis:'y',
            responsive:true, maintainAspectRatio:false,
            plugins:{
                legend:{ display:false },
                tooltip:{ callbacks:{
                    title: items => items[0].label,
                    label: c => {
                        const g = W[c.dataIndex];
                        return [
                            `${g.work.lift.toFixed(2)}x the library rate, 08:00-noon`,
                            `${g.work.share.toFixed(2)}% of its ${comma(g.total)} plays fall there`,
                            `z = ${g.work.z.toFixed(1)} vs the rest of the library`,
                            `evening 18:00-midnight: ${g.eve.lift.toFixed(2)}x`
                        ];
                    }
                }}
            },
            scales:{
                x:{ grid:GRID,
                    title:{ display:true, text:'Concentration in 08:00-noon, vs the whole library' },
                    ticks:{ callback:v => (1+v).toFixed(1) + 'x' } },
                y:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } }
            }
        }
    });

    const unc = R.find(g => g.genre === UNCLASSIFIED);
    document.getElementById('genreCoverage').innerHTML = `
        <div class="ribbon">
            <div><div class="y">Curated</div><div class="a">${comma(cov.curated)} artists</div>
                 <div class="p">hand-assigned, overrides tags</div></div>
            <div><div class="y">From Last.fm tags</div>
                 <div class="a">${cov.tagged ? comma(cov.tagged) + ' artists' : 'not loaded'}</div>
                 <div class="p">${cov.tagged
                    ? 'via tools/fetch_lastfm_tags.py'
                    : 'run tools/fetch_lastfm_tags.py to add'}</div></div>
            <div><div class="y">Classified</div><div class="a">${cov.pct}% of plays</div>
                 <div class="p">${comma(cov.classified)} of ${comma(D.totals.scrobbles)} scrobbles</div></div>
            <div><div class="y">Unclassified</div>
                 <div class="a">${unc ? unc.share + '%' : '0%'}</div>
                 <div class="p">${unc ? comma(unc.artists) + ' artists, mostly the long tail' : 'none'}</div></div>
        </div>`;
}

// ─────────────────────────────────────────────────────────────
//  4. DISCOVERY AND COMFORT
// ─────────────────────────────────────────────────────────────
function drawDiscovery(D) {
    const d = D.discovery;
    new Chart(document.getElementById('discoveryChart'), {
        data:{
            labels:d.map(x => x.year),
            datasets:[
                { type:'bar', label:'New artists heard', data:d.map(x => x.newArtists),
                  backgroundColor:C.dark, borderWidth:0, yAxisID:'y', order:2 },
                { type:'line', label:'% of the year that was new', data:d.map(x => x.novelty),
                  borderColor:C.red, backgroundColor:C.red, borderWidth:2.5,
                  pointRadius:3, pointHoverRadius:6, tension:0, yAxisID:'y1', order:1 }
            ]
        },
        options:{
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'index', intersect:false },
            plugins:{
                legend:LEGEND_TOP,
                tooltip:{ callbacks:{ label: c => c.dataset.yAxisID === 'y1'
                    ? `${c.raw.toFixed(1)}% of plays were first-year artists`
                    : `${comma(c.raw)} artists heard for the first time` } }
            },
            scales:{
                x:{ grid:{ display:false } },
                y:{ beginAtZero:true, position:'left', grid:GRID,
                    title:{ display:true, text:'New artists' } },
                y1:{ beginAtZero:true, position:'right', grid:{ display:false },
                     title:{ display:true, text:'% of year that was new', color:C.red },
                     ticks:{ color:C.red, callback:v => v + '%' } }
            }
        }
    });

    const f = D.discovery[0], l = D.discovery[D.discovery.length-1];
    const T = D.totals;
    document.getElementById('discoveryInsight').innerHTML = `
        <strong>Two curves moving in opposite directions.</strong>
        The number of new artists heard each year has roughly
        ${(l.newArtists/f.newArtists).toFixed(1)}&times;'d since ${f.year} —
        ${comma(f.newArtists)} then, ${comma(l.newArtists)} in ${l.year}. Yet the
        share of listening those newcomers actually earn has fallen steadily, from
        ${f.novelty.toFixed(1)}% to ${l.novelty.toFixed(1)}%. More is sampled; less of
        it sticks.<br><br>
        The concentration curve says the same thing from the other side.
        <strong>${comma(T.half)} artists — ${(100*T.half/T.artists).toFixed(1)}% of the
        ${comma(T.artists)} ever played — account for half of all listening</strong>, while
        ${T.onePlayPct}% of artists (${comma(T.onePlay)} of them) were played exactly once
        and never again. This is a library with a small, hard core and an enormous
        exploratory fringe: most of what gets tried is tried once, and the few that
        survive are played into the ground.`;
}

function drawLorenz(D) {
    new Chart(document.getElementById('lorenzChart'), {
        type:'line',
        data:{ datasets:[
            { label:'Cumulative share of plays', data:D.lorenz,
              borderColor:C.black, backgroundColor:'rgba(0,0,0,.07)',
              borderWidth:2, fill:true, pointRadius:0, tension:0 },
            { label:'If every artist were played equally',
              data:[{x:0,y:0},{x:100,y:100}],
              borderColor:C.vlight, borderWidth:1.5, borderDash:[5,4],
              pointRadius:0, fill:false }
        ]},
        options:{
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'nearest', intersect:false },
            plugins:{
                legend:LEGEND_TOP,
                tooltip:{ callbacks:{ label: c =>
                    `Top ${c.raw.x.toFixed(1)}% of artists = ${c.raw.y.toFixed(1)}% of plays` } }
            },
            scales:{
                x:{ type:'linear', min:0, max:100, grid:GRID,
                    title:{ display:true, text:'% of artists, ranked by plays' },
                    ticks:{ callback:v => v + '%' } },
                y:{ min:0, max:100, grid:GRID,
                    title:{ display:true, text:'% of all scrobbles' },
                    ticks:{ callback:v => v + '%' } }
            }
        }
    });
}

// ─────────────────────────────────────────────────────────────
//  5. SITTINGS AND SEASONS
// ─────────────────────────────────────────────────────────────
function drawSessions(D) {
    const b = D.sessionBuckets;
    new Chart(document.getElementById('sessionChart'), {
        type:'bar',
        data:{ labels:b.map(x => x.label), datasets:[{
            label:'Sittings', data:b.map(x => x.n), backgroundColor:C.dark, borderWidth:0 }]},
        options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ display:false },
                      tooltip:{ callbacks:{ label: c =>
                          `${comma(c.raw)} sittings (${pct(c.raw, D.totals.sessions).toFixed(1)}%)` } } },
            scales:{
                x:{ grid:{ display:false }, title:{ display:true, text:'Tracks in the sitting' } },
                y:{ beginAtZero:true, grid:GRID, title:{ display:true, text:'Sittings' } }

}

function drawSeason(D) {
    // Per-day rate, not raw totals: months differ in length, and the record
    // stops partway through the final month.
    const vals = D.monthRatePerDay;
    new Chart(document.getElementById('seasonChart'), {
        type:'bar',
        data:{ labels:MONTHS, datasets:[{
            label:'Scrobbles per day', data:vals,
            backgroundColor:vals.map(v => v === Math.max(...vals) ? C.red : C.dark),
            borderWidth:0 }]},
        options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ display:false },
                      tooltip:{ callbacks:{ label: c => c.raw.toFixed(1) + ' scrobbles per day' } } },
            scales:{
                x:{ grid:{ display:false } },
                y:{ beginAtZero:true, grid:GRID, title:{ display:true, text:'Scrobbles per day' } }
            }
        }
    });
}

// ─────────────────────────────────────────────────────────────
//  6. TABLES

function drawTables(D) {

    const maxA = D.topArtists[0].plays;
    document.getElementById('artistTable').innerHTML = `

        ${D.topArtists.map((a,i) => `
            <tr>
                <td class="n">${i+1}</td>
                <td>${esc(a.name)}<span class="bar" style="width:${100*a.plays/maxA}%"></span></td>
                <td class="meta">${fmtDate(a.first)}</td>
                <td class="v">${comma(a.plays)}<div class="sub" style="font-weight:400">${a.share}%</div></td>
            </tr>`).join('')}`;

    document.getElementById('trackTable').innerHTML = `

    document.getElementById('albumTable').innerHTML = `

    document.getElementById('bingeTable').innerHTML = `
        <tr><th></th><th>Day</th><th>Artist</th>
            <th style="text-align:right">Plays</th><th style="text-align:right">Share of day</th></tr>
        ${D.binges.map((b,i) => `
            <tr>
                <td class="n">${i+1}</td>
                <td class="meta" style="text-align:left">${fmtDate(new Date(b.day+'T00:00:00').getTime())}</td>
                <td>${esc(b.artist)}</td>
                <td class="v">${comma(b.plays)}<div class="sub" style="font-weight:400">of ${b.total}</div></td>

            </tr>`).join('')}`;

// Artist and track names are arbitrary user-supplied strings from Last.fm and
// go into innerHTML, so they are escaped rather than trusted.
function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ─────────────────────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────────────────────
async function boot() {
    showLoading();

    let csvText = null, lastModified = null;
    try {
        const res = await fetch(CSV_FILENAME, { cache:'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
        lastModified = res.headers.get('Last-Modified') || new Date().toISOString();
        csvText = await res.text();
    } catch (fetchErr) {
        try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            if (cached?.data) {
                console.warn('CSV fetch failed; using cache:', fetchErr.message);
                renderDashboard(cached.data, cached.lastModified);
                return;
            }
        } catch (_) {}
        showError(fetchErr.message);
        return;
    }

    // Optional companion file. A 404 is the normal state before the fetch script
    // has been run, so it is not an error: genre falls back to the curated list
    // and the coverage panel says exactly what was loaded.
    let tagIndex = null, tagsStamp = 'none';
    try {
        const res = await fetch(TAGS_FILENAME, { cache:'no-store' });
        if (res.ok) {
            const payload = await res.json();
            tagIndex  = payload.artists || null;
            tagsStamp = payload.generated || 'unknown';
            console.log(`Loaded tags for ${Object.keys(tagIndex || {}).length} artists.`);
        } else {
            console.info(`${TAGS_FILENAME} not present (HTTP ${res.status}) - using the curated genre list only.`);
        }
    } catch (e) {
        console.info(`${TAGS_FILENAME} could not be read - using the curated genre list only.`, e.message);
    }

    const raw = parseCSV(csvText);
    if (!raw.length) { showValidationError('The file is empty.'); return; }

    // Tolerate a header row if a future export adds one.
    let start = 0;
    if (/artist/i.test(raw[0][0] || '') && !parseTS(raw[0][3])) start = 1;

    const recs = [];
    let skipped = 0;
    for (let i = start; i < raw.length; i++) {
        const r = raw[i];
        if (r.length < 4) { skipped++; continue; }
        const t = parseTS(r[3]);
        if (!t || !r[0]) { skipped++; continue; }
        recs.push({ ar:r[0].trim(), al:(r[1] || '').trim(), tr:(r[2] || '').trim(), t });
    }
    if (!recs.length) {
        showValidationError(`No parseable rows in ${comma(raw.length)} lines. ` +
            `Expected: artist, album, track, "DD Mon YYYY, HH:MM".`);
        return;
    }
    if (skipped) console.warn(`Skipped ${skipped} unparseable row(s).`);

    // Cache is keyed on the file's Last-Modified and row count, so a new export
    // invalidates it automatically — drop in a fresh CSV and the page follows.
    try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached?.lastModified === lastModified && cached?.rowCount === recs.length
            && cached?.tagsStamp === tagsStamp) {
            console.log('Cache hit — skipping re-processing.');
            renderDashboard(cached.data, cached.lastModified);
            return;
        }
    } catch (_) {}

    const processed = processData(recs, tagIndex);
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data:processed, lastModified, rowCount:recs.length, tagsStamp,
            cachedAt:new Date().toISOString()
        }));
    } catch (e) {
        console.warn('localStorage write failed:', e.message);
    }

    renderDashboard(processed, lastModified);
}

boot();

// The toggle button's own click handling lives in the independent script
// right after it in <body>, so it keeps working even if this Chart.js-

});
